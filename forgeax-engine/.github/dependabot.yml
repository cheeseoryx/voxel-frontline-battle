# Dependabot configuration -- @webgpu/types upstream patch tracking.
#
# Decision S-4 (OQ-3 verdict): dependabot auto-PR + monthly manual review backstop.
# Lock policy ^0.1.69 (caret range follows patch within the v0.1.x line; v0.2.x
# triggers a major-upgrade signal). See plan-strategy section 2 S-4 +
# AGENTS.md packages "RHI / WebGPU" subsection.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-name: '@webgpu/types'
    labels:
      - dependencies
      - webgpu-types
    commit-message:
      prefix: chore(deps)
      include: scope
    open-pull-requests-limit: 5
