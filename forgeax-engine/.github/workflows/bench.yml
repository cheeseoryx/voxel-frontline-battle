# bench.yml — vitest bench informational job (M5 / T-036, AC-13)
#
# Purpose: run packages/math vitest bench and write hz/mean/p99/rme to the PR
# GITHUB_STEP_SUMMARY; non-blocking (no fail threshold, always green). bench-result.json
# is consumed directly by the summary step below; no downstream job needs a transfer artifact.
#
# Related: requirements §AC-13 hot path bench; plan-strategy D-P11;
#          wiki/vitest-bench §6 CI integration (non-blocking PR template).

name: bench

on:
  pull_request:
    branches: [main]
    paths:
      # BEGIN ci-paths-ssot — generated by scripts/ci/sync-paths.mjs — DO NOT EDIT
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'templates/**'
      - 'skills/**'
      - '.github/**'
      - 'forgeax-engine-assets'
      - '.gitmodules'
      - 'AGENTS.md'
      - '*.json'
      - '*.yaml'
      - '*.ts'
      - '*.toml'
      - 'bun.lock'
      - '.pnpm-version'
      - '.bun-version'
      - '.nvmrc'
      - '!.forgeax-harness/docs/**'
      - '!docs/**'
      # END ci-paths-ssot
  workflow_dispatch:

# Preserve every bench sample; a newer push must not erase an in-flight sample.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Opt-in to Node.js 24 for JavaScript actions ahead of GitHub's June 2026
  # forced cutover. See ci.yml for context.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  bench:
    name: math bench (informational only)
    runs-on: [self-hosted, Linux, X64, standard]
    timeout-minutes: 15
    # Note: do not set continue-on-error; vitest bench has no default fail condition,
    # bench always exits 0 (throws: false). A failure only reflects sink-mode regression
    # or a benched function throwing — that case should let the job go red and expose the
    # problem explicitly, not pass silently.
    steps:
      # Scrub a persisted global/system git auth header before checkout — the
      # self-hosted $HOME persists a leftover http.extraheader Authorization
      # across jobs; combined with checkout's own token header git sends two
      # Authorization headers → GitHub 400 "Duplicate header". No-op on clean /
      # hosted runners. See forgeax-engine ci.yml build-artifacts for full detail.
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GHA }}

      # Read pnpm version from .pnpm-version SSOT file — same alpha path as ci.yml.
      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # This job runs on the persistent self-hosted Linux pool. The pnpm
          # store already survives between jobs; uploading a ~350 MB archive
          # per PR bench only grows the repository cache and delays install.
          package-manager-cache: false

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      # Bun channel sanity (feat-20260512 M6 / AC-11): K-5 dual-pipeline stance
      # in bench.yml — only frozen install + workspaces equivalence guard. No
      # bench task on the bun side (single perf signal source stays on pnpm).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Bun install (frozen)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Bun workspaces equivalence guard
        run: bun run sync:check

      # English-only check (feat-20260510-smoke-onboarding-doc-polish w15 / D-4):
      # mirror ci.yml byte-for-byte so bench-on-PR also enforces source text
      # ASCII guard. Single self-hosted Linux X64 runner (no matrix). Vendor
      # drift check stays ci.yml-only (plan-strategy D-4 single-source guard,
      # AC-15).
      - name: English-only check
        run: |
          python3 scripts/forgeax/check_english_only.py --code packages/*/src apps/*/src scripts tests
          python3 scripts/forgeax/check_english_only.py AGENTS.md
          python3 scripts/forgeax/check_english_only.py --extensions .yml --extensions .yaml .github
          python3 scripts/forgeax/check_english_only.py --extensions .ts \
            $(find packages apps -maxdepth 3 \
                \( -name "vitest.config.ts" -o -name "tsup.config.ts" \) \
                -not -path "*/node_modules/*" -not -path "*/dist/*") \
            vitest.config.ts vitest.setup-webgpu.ts tsup.base.ts

      - name: Run vitest bench (math)
        run: pnpm -F @forgeax/engine-math bench:json

      - name: Write summary table
        # Write hz / mean / p99 / rme to GITHUB_STEP_SUMMARY to avoid installing a
        # third-party PR comment action (wiki/vitest-bench §6.2 template, node inline script).
        # vitest 4.x bench JSON shape: files[].groups[].benchmarks[];
        # fields hang directly on the benchmark object (not nested under .result).
        run: |
          node -e "
            const r = require('./packages/math/bench-result.json');
            const lines = [
              '## math bench result (vitest @ ' + new Date().toISOString().slice(0, 10) + ')',
              '',
              '| name | hz (ops/s) | mean (ms) | p99 (ms) | rme (%) |',
              '|---|---:|---:|---:|---:|',
            ];
            for (const f of r.files || []) {
              for (const g of f.groups || []) {
                for (const t of g.benchmarks || []) {
                  if (typeof t.hz !== 'number') continue;
                  lines.push(
                    '| ' + t.name +
                    ' | ' + Math.round(t.hz).toLocaleString('en-US') +
                    ' | ' + t.mean.toFixed(6) +
                    ' | ' + t.p99.toFixed(6) +
                    ' | ' + (t.rme * 100).toFixed(2) + ' |'
                  );
                }
              }
            }
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          "
