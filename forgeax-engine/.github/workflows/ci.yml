        id: write-app-shard-2-provenance
        env:
          ARTIFACT_ID: ${{ steps.upload-app-dist-2.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.upload-app-dist-2.outputs.artifact-name }}
          UPLOAD_STARTED_AT: ${{ steps.upload-app-dist-2.outputs.upload-started-at }}
          UPLOAD_COMPLETED_AT: ${{ steps.upload-app-dist-2.outputs.upload-completed-at }}
          UPLOAD_ELAPSED_SECONDS: ${{ steps.upload-app-dist-2.outputs.upload-elapsed-seconds }}
          UPLOAD_TRANSFER_ATTEMPT: ${{ steps.upload-app-dist-2.outputs.upload-transfer-attempt }}
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const fingerprints = JSON.parse(fs.readFileSync('app-dist-2-fingerprints.json'));
          const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
          const record = {
            schemaVersion: 1,
            producer: 'app-shard-2',
            runId: process.env.GITHUB_RUN_ID,
            producerRunAttempt: attempt,
            artifacts: [{
              class: 'app-dist-2',
              artifactName: process.env.ARTIFACT_NAME,
              artifactId: process.env.ARTIFACT_ID,
              producerRunAttempt: attempt,
              inputFingerprint: fingerprints['app-dist-2'],
              upload: {
                startedAt: process.env.UPLOAD_STARTED_AT,
                completedAt: process.env.UPLOAD_COMPLETED_AT,
                elapsedSeconds: Number(process.env.UPLOAD_ELAPSED_SECONDS),
                transferAttempt: Number(process.env.UPLOAD_TRANSFER_ATTEMPT),
              },
            }],
          };
          fs.writeFileSync(
            `provenance-app-shard-2-a${attempt}.json`,
            `${JSON.stringify(record)}\n`,
          );
          const payload = Buffer.from(JSON.stringify(record)).toString('base64');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `payload=${payload}\n`);

  build-artifacts:
    name: build-artifacts
    if: always()
    needs: [core-build, shared-app-inputs, app-shard-0, app-shard-1, app-shard-2]
    outputs:
      artifact_ids: ${{ steps.merge-provenance.outputs.artifact_ids }}
      core_artifact_ids: ${{ steps.merge-provenance.outputs.core_artifact_ids }}
      app_artifact_ids: ${{ steps.merge-provenance.outputs.app_artifact_ids }}
      shared_artifact_id: ${{ needs.shared-app-inputs.outputs.shared_artifact_id }}
      shared_input_fingerprint: ${{ needs.shared-app-inputs.outputs.input_fingerprint }}
      artifact_ids_primary_pnpm: ${{ steps.merge-provenance.outputs.artifact_ids_primary_pnpm }}
      artifact_ids_coverage_pnpm: ${{ steps.merge-provenance.outputs.artifact_ids_coverage_pnpm }}
      artifact_ids_coverage_perf: ${{ steps.merge-provenance.outputs.artifact_ids_coverage_perf }}
      artifact_ids_vitest_browser: ${{ steps.merge-provenance.outputs.artifact_ids_vitest_browser }}
      artifact_ids_shared_inputs_browser: ${{ steps.merge-provenance.outputs.artifact_ids_shared_inputs_browser }}
      artifact_ids_multithread_browser_benchmark: ${{ steps.merge-provenance.outputs.artifact_ids_multithread_browser_benchmark }}
      artifact_ids_smoke_fleet: ${{ steps.merge-provenance.outputs.artifact_ids_smoke_fleet }}
      artifact_ids_bevy_smoke_fleet: ${{ steps.merge-provenance.outputs.artifact_ids_bevy_smoke_fleet }}
      artifact_ids_vitest_dawn: ${{ steps.merge-provenance.outputs.artifact_ids_vitest_dawn }}
      artifact_ids_webkit_fallback: ${{ steps.merge-provenance.outputs.artifact_ids_webkit_fallback }}
      artifact_ids_portability_bun: ${{ steps.merge-provenance.outputs.artifact_ids_portability_bun }}
      artifact_ids_metrics_validate: ${{ steps.merge-provenance.outputs.artifact_ids_metrics_validate }}
      artifact_ids_collectathon_boot_e2e: ${{ steps.merge-provenance.outputs.artifact_ids_collectathon_boot_e2e }}
      provenance_payload: ${{ steps.provenance-output.outputs.payload }}
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "standard"]') }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: false
          token: ${{ secrets.GHA }}
      - name: Setup Node.js for CI aggregation scripts
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify producer job results
        run: |
          test '${{ needs.core-build.result }}' = success
          test '${{ needs.shared-app-inputs.result }}' = success
          test '${{ needs.app-shard-0.result }}' = success
          test '${{ needs.app-shard-1.result }}' = success
          test '${{ needs.app-shard-2.result }}' = success
      - name: Download shard report artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.app-shard-0.outputs.app_report_artifact_id }},${{ needs.app-shard-1.outputs.app_report_artifact_id }},${{ needs.app-shard-2.outputs.app_report_artifact_id }}"
          --path shard-reports
      - name: Decode producer provenance records
        env:
          APP_SHARD_0_PROVENANCE: ${{ needs.app-shard-0.outputs.provenance_payload }}
          APP_SHARD_1_PROVENANCE: ${{ needs.app-shard-1.outputs.provenance_payload }}
          APP_SHARD_2_PROVENANCE: ${{ needs.app-shard-2.outputs.provenance_payload }}
          CORE_PROVENANCE: ${{ needs.core-build.outputs.provenance_payload }}
          SHARED_PROVENANCE: ${{ needs.shared-app-inputs.outputs.provenance_payload }}
        shell: node {0}
        run: |
          const fs = require('node:fs');
          fs.mkdirSync('provenance-records', { recursive: true });
          const payloads = [
            process.env.CORE_PROVENANCE,
            process.env.APP_SHARD_0_PROVENANCE,
            process.env.APP_SHARD_1_PROVENANCE,
            process.env.APP_SHARD_2_PROVENANCE,
            process.env.SHARED_PROVENANCE,
          ];
          for (const payload of payloads) {
            const record = JSON.parse(Buffer.from(payload, 'base64').toString('utf8'));
            const path = `provenance-records/provenance-${record.producer}-a${record.producerRunAttempt}.json`;
            fs.writeFileSync(path, `${JSON.stringify(record)}\n`);
          }
      - name: Merge provenance records
        id: merge-provenance
        run: >-
          node scripts/ci/merge-provenance-records.mjs --records-dir provenance-records
          --aggregate-attempt ${{ github.run_attempt }} --out ci-provenance-merged.json
          --github-output "$GITHUB_OUTPUT"
      - name: Merge shard results
        run: >-
          node scripts/ci/merge-app-shard-results.mjs --reports-dir shard-reports/report
          --selection ci-provenance-merged.json
      - name: Encode merged provenance output
        id: provenance-output
        run: |
          set -euo pipefail
          bytes="$(wc -c < ci-provenance-merged.json)"
          if [ "$bytes" -gt 500000 ]; then
            echo "::error::ci-provenance-merged.json is ${bytes} bytes; job-output transport is limited to 500000 raw bytes"
            exit 1
          fi
          echo "payload=$(base64 < ci-provenance-merged.json | tr -d '\n')" >> "$GITHUB_OUTPUT"

  cache-warm:
    name: cache-warm
    # Cache return evidence measures CI cost; it does not decide source correctness.
    # Keep it available with the explicit evidence probe without charging every PR.
    if: github.event_name == 'workflow_dispatch' && inputs.run_shared_evidence_probe == true
    needs: [app-shard-0, app-shard-1, app-shard-2]
    outputs:
      timing_payload: ${{ steps.cache-cost-output.outputs.timing_payload }}
      audit_payload: ${{ steps.cache-cost-output.outputs.audit_payload }}
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "standard"]') }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: false
          token: ${{ secrets.GHA }}
      - name: Setup Node.js for CI cache scripts
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Resolve forgeax-engine-assets revision
        id: assets-sha
        run: echo "value=$(git ls-tree HEAD forgeax-engine-assets | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - name: Fingerprint merged DDC inputs
        id: ddc-fingerprint
        env:
          ASSETS_REVISION: ${{ steps.assets-sha.outputs.value }}
        shell: node {0}
        run: |
          const { appendFileSync } = require('node:fs');
          const { pathToFileURL } = require('node:url');
          const main = async () => {
            const module = await import(pathToFileURL(
              `${process.cwd()}/scripts/ci/evidence/fingerprint.mjs`,
            ));
            const fingerprint = module.fingerprintValue({
              runnerScope: process.env.CACHE_RUNNER_SCOPE,
              assetsRevision: process.env.ASSETS_REVISION,
            });
            appendFileSync(process.env.GITHUB_OUTPUT, `value=${fingerprint}\n`);
          };
          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
      - name: Start merged DDC restore timer
        id: ddc-restore-start
        run: echo "seconds=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Restore merged DDC cache
        id: cache-ddc
        uses: actions/cache/restore@v5
        with:
          path: ddc-merged
          key: ${{ env.CACHE_RUNNER_SCOPE }}-forgeax-shard-ddc-${{ steps.assets-sha.outputs.value }}
      - name: Finish merged DDC restore timer
        id: ddc-restore-finish
        run: >-
          echo "seconds=$(( $(date +%s) - ${{ steps.ddc-restore-start.outputs.seconds }} ))" >> "$GITHUB_OUTPUT"
      - name: Download shard DDC artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.app-shard-0.outputs.app_ddc_artifact_id }},${{ needs.app-shard-1.outputs.app_ddc_artifact_id }},${{ needs.app-shard-2.outputs.app_ddc_artifact_id }}"
          --path ddc-snapshots
      - name: Merge DDC snapshots
        run: >-
          node scripts/ci/merge-ddc-snapshots.mjs --snapshots-dir ddc-snapshots/ddc --out-dir ddc-merged
          ${{ steps.cache-ddc.outputs.cache-hit == 'true' && '--cache-hit' || '' }}
      - name: Audit active CI cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/audit-ci-cache.mjs > ci-cache-audit.json
      - name: Start merged DDC save timer
        id: ddc-save-start
        if: steps.cache-ddc.outputs.cache-hit != 'true'
        run: echo "millis=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - name: Save merged DDC cache on miss
        id: ddc-save
        if: steps.cache-ddc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ddc-merged
          key: ${{ env.CACHE_RUNNER_SCOPE }}-forgeax-shard-ddc-${{ steps.assets-sha.outputs.value }}
      - name: Finish merged DDC save observation
        id: ddc-save-finish
        if: steps.cache-ddc.outputs.cache-hit != 'true' && always()
        env:
          SAVE_OUTCOME: ${{ steps.ddc-save.outcome }}
          START_MILLIS: ${{ steps.ddc-save-start.outputs.millis }}
        run: |
          completed_millis=$(date +%s%3N)
          elapsed_seconds=$(awk -v start="$START_MILLIS" -v end="$completed_millis" 'BEGIN { printf "%.3f", (end - start) / 1000 }')
          echo "elapsed_seconds=$elapsed_seconds" >> "$GITHUB_OUTPUT"
          echo "outcome=$SAVE_OUTCOME" >> "$GITHUB_OUTPUT"
      - name: Write cache timing facts
        if: always()
        env:
          CACHE_HIT: ${{ steps.cache-ddc.outputs.cache-hit }}
          INPUT_FINGERPRINT: ${{ steps.ddc-fingerprint.outputs.value }}
          MATCHED_KEY: ${{ steps.cache-ddc.outputs.cache-matched-key }}
          REQUESTED_KEY: ${{ steps.cache-ddc.outputs.cache-primary-key }}
          RESTORE_SECONDS: ${{ steps.ddc-restore-finish.outputs.seconds }}
          SAVE_OUTCOME: ${{ steps.ddc-save-finish.outputs.outcome }}
          SAVE_SECONDS: ${{ steps.ddc-save-finish.outputs.elapsed_seconds }}
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const save = process.env.CACHE_HIT === 'true'
            ? { "outcome": 'notApplicable' }
            : {
                "outcome": process.env.SAVE_OUTCOME,
                "elapsedSeconds": Number(process.env.SAVE_SECONDS),
              };
          const restore = {
            "elapsedSeconds": Number(process.env.RESTORE_SECONDS),
          };
          const facts = {
            schemaVersion: 1,
            family: 'merged-ddc',
            identity: {
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            },
            producer: {
              owner: 'cache-warm',
              producerRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            },
            consumer: {
              owner: 'cost-reporter',
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            },
            inputFingerprint: process.env.INPUT_FINGERPRINT,
            "requestedKey": process.env.REQUESTED_KEY,
            "matchedKey": process.env.MATCHED_KEY,
            "cacheHit": process.env.CACHE_HIT,
            restore,
            save,
            warmRestoreSeconds: restore.elapsedSeconds,
          };
          fs.writeFileSync('ci-cache-timing.json', `${JSON.stringify(facts)}\n`);
      - name: Encode cache cost outputs
        id: cache-cost-output
        if: always()
        run: |
          set -euo pipefail
          for file in ci-cache-timing.json ci-cache-audit.json; do
            bytes="$(wc -c < "$file")"
            if [ "$bytes" -gt 500000 ]; then
              echo "::error::${file} is ${bytes} bytes; job-output transport is limited to 500000 raw bytes"
              exit 1
            fi
          done
          echo "timing_payload=$(base64 < ci-cache-timing.json | tr -d '\n')" >> "$GITHUB_OUTPUT"
          echo "audit_payload=$(base64 < ci-cache-audit.json | tr -d '\n')" >> "$GITHUB_OUTPUT"

  # `primary-pnpm` is the CI source of truth: full gate set including GPU smoke,
  # browser/dawn vitest, coverage, metrics, inspector e2e. `portability-bun`
  # re-runs the 6 aligned base gates on the bun channel to catch package-manager
  # drift. Display names use the same role/tool token so log scanning stays
  # cheap. See AGENTS.md "Conventions > Dual lockfile".
  primary-pnpm:
    name: primary-pnpm
    # The M4 Preview simulation smoke loads the full game-default graph and
    # reserves a 4 GiB child heap; keep the source-of-truth job on the heavy
    # pool so the browser process and lavapipe remain within the runner limit.
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "heavy"]') }}
    needs: [build-artifacts, post-merge-gate]
    # feat-20260715-post-merge-skip: when post-merge-gate confirms the merge tree
    # matches the PR's tested tree, skip this job (already validated by PR CI).
    # On PR events, post-merge-gate is skipped → condition evaluates to false →
    # job runs (the default pre-optimization behavior).
    if: |
      always() &&
      needs.build-artifacts.result == 'success' &&
      ! (needs.post-merge-gate.result == 'success' && needs.post-merge-gate.outputs.skip_checks == 'true')
    # feat-small-20260518-ci-cost-and-parallel-trims D-3: dorny/paths-filter on
    # `pull_request` events needs `pull-requests: read` to query the changed-files
    # API; without it the action fails 401 (research F-4 + Q-3). Declared at job
    # scope (not workflow scope) so other jobs keep the default minimal token —
    # mirrors the sticky-comment job's job-scoped permissions style.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    # Immutable build-artifact hydration transfers several app/core archives
    # before the full source-of-truth gate can start.
    timeout-minutes: 60
    steps:
      # Scrub a leftover GLOBAL/SYSTEM http.extraheader Authorization before
      # checkout — see build-artifacts' identical step for the full rationale
      # (issue #709: stale --global/--system auth header on the persistent
      # self-hosted runners → duplicate Authorization → GitHub 400).
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GHA }}

      - name: Prepare XDG runtime directory
        uses: ./.github/actions/prepare-xdg-runtime

      # Read pnpm version from .pnpm-version SSOT file (feat-20260512 α path:
      # pnpm/action-setup@v5 has no file-based version input — read into output
      # then feed via with.version). Mirrors .bun-version / .nvmrc file shape.
      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> $GITHUB_OUTPUT

      # pnpm/action-setup MUST run before actions/setup-node so the runner has
      # a usable pnpm binary on PATH (plan-strategy §K-7).
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Self-hosted workspaces persist node_modules between jobs. pnpm 11
      # short-circuits a lockfile-clean install even when root .bin shims were
      # removed or point at an older dependency tree, leaving biome/tsc absent
      # for the lint and Vitest typecheck subprocesses. Removing only the root
      # dependency tree forces pnpm to recreate the workspace command shims;
      # package source and immutable build artifacts remain untouched.
      - name: Verify heavy runner capacity
        run: node scripts/ci/verify-runner-pool-capacity.mjs --pool heavy

      - name: Clear stale root dependency links (self-hosted)
        run: rm -rf node_modules

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare Dawn device-limit normalization
        uses: ./.github/actions/prepare-dawn-device-limits

      # Documentation contracts now live in the floating harness clone. The
      # CI install intentionally uses --ignore-scripts, so materialize that
      # clone explicitly before catalog/VFX documentation tests run.
      - name: Materialize harness documentation
        env:
          FORGEAX_HARNESS_TOKEN: ${{ secrets.GHA }}
          FORGEAX_HARNESS_SPARSE_DOCS: '1'
        run: node scripts/ci/materialize-harness-docs.mjs

      # Cross-job artifact pipeline (feat-20260716-ci-build-artifact-cost-optimization
      # M2): consume per-contract-class artifacts from build-artifacts.
      - name: Hydrate immutable build artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.build-artifacts.outputs.artifact_ids_primary_pnpm }}" --path .

      - name: Hydrate immutable shared app inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.build-artifacts.outputs.shared_artifact_id }}"
          --path shared-app-inputs-transfer

      - name: Unpack immutable shared app inputs
        run: node scripts/ci/unpack-shared-app-inputs.mjs --root .

      # Primary still runs app smoke scripts that read the shared engine shader
      # projection. The projection is tiny; materialize it locally instead of
      # restoring any app's full dist payload.
      - name: Materialize shared app shader manifests
        run: >-
          node scripts/ci/materialize-app-shader-manifests.mjs
          --root . --shared-input-manifest shared-app-inputs/manifest.json

      # Verify required artifact classes are present before main logic
      # (feat-20260716-ci-build-artifact-cost-optimization M2).
      - name: Verify artifact inputs
        run: node scripts/ci/verify-build-artifact-input.mjs --consumer primary-pnpm --root .

      - name: Code file line gate
        run: pnpm check:code-file-lines

      # Profiler consumer and relation gates run after the immutable package
      # artifacts are hydrated, so they exercise the public package exports.
      - name: Profiler consumer smoke
        run: pnpm --filter @forgeax/engine-profiler smoke:consumer

      - name: Profiler phase catalog relation
        run: pnpm profiler:phase-catalog

      - name: Profiler D-6 overhead and allocation gate
        run: pnpm --filter @forgeax/engine-profiler test:perf

      # Metric registry drift gate (feat-20260510-ci-metrics-coverage-drift M3 / w11):
      # asserts every workspace member declares forgeax.metrics per
      # forgeax-metrics.schema.json. Position: between Install and Build per
      # plan-strategy §1 mermaid (install -> metrics -> build -> runJ).
      # continue-on-error stays unset so any drift fails the job (K-10 stance,
      # no manual override, charter proposition 4 explicit failure).
      # Step run literal is byte-for-byte aligned with package.json#scripts.metrics:check.
      - name: Check metrics declared
        run: pnpm metrics:check

      - name: Workspaces equivalence guard
        run: pnpm run sync:check

      - name: Package directory naming guard
        run: pnpm run check:package-directory-names

      # CI paths SSOT drift gate: asserts all workflow yml marker regions
      # match scripts/ci/paths.json (the single source of truth for trigger
      # path globs). Zero npm deps; idempotent re-run via sync-paths.mjs.
      - name: CI paths SSOT drift check
        run: node scripts/ci/sync-paths.mjs --check

      # CI primary-pnpm ↔ portability-bun alignment drift gate (feat-20260512 M5 / AC-10):
      # asserts jobs.primary-pnpm and jobs.portability-bun cover the 6 aligned base gates (AC-01)
      # + jobs.portability-bun stays free of forbidden pnpm-only literals (AC-02)
      # + .pnpm-version matches package.json#packageManager (AC-03). Zero npm
      # deps; hand-rolled minimal YAML parser; --self-test mode covers three
      # fixtures (aligned / missing-in-portability / primary-only-allowlist).
      - name: CI primary-pnpm ↔ portability-bun alignment check
        run: node scripts/check-ci-channel-alignment.mjs

      # feat-small-20260518-ci-cost-and-parallel-trims D-2/D-6: short-circuit the
      # codemod idempotency check on PRs that don't touch scripts/codemod/**.
      # paths-filter v4 SHA pinned per AGENTS.md actions pin habit; dependabot
      # owns version bumps. `filters:` lists only `scripts/codemod/**` because
      # that is the only codemod source-of-truth in the tree today (D-6); future
      # `packages/*/codemod/**` additions extend this list explicitly.
      - name: Detect codemod source changes
        id: codemod-filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            codemod:
              - 'scripts/codemod/**'

      # Long-term fixture from feat-20260511-engine-package-family-rename M5 / w24
      # (OQ-R5 decision: keep as permanent codemod regression guard, charter
      # proposition 4 explicit failure). Re-running the rename codemod on the
      # current tree must produce zero diff (AC-16 idempotency). If anyone hand-
      # edits a `@forgeax/<old>` literal in source, this step turns red.
      # SKIP_BUN_INSTALL=1: the bun.lock parity gate is owned by the dedicated
      # `portability-bun` job (AC-17); the primary-pnpm job idempotency check
      # only verifies the source-file rewrite phases produce zero diff.
      # `git diff --quiet` is scoped to exclude packages/*/pkg/* (wasm-pack
      # output regenerated by the prior `Build wgpu-wasm` step; codemod never
      # touches these files — toolchain-version byte differences here are
      # orthogonal to AC-16 codemod idempotency).
      - name: Verify codemod idempotency
        if: steps.codemod-filter.outputs.codemod == 'true'
        run: |
          SKIP_BUN_INSTALL=1 bash scripts/codemod/rename-engine-family.sh
          git diff --quiet -- . ':!packages/*/pkg/**'

      - name: Biome ci
        run: pnpm run lint

      # Test placement is a repository contract, not a convention-only review
      # rule. Keep it as a named CI step so a misplaced test fails visibly even
      # when the broader lint:grep bundle changes its composition.
      - name: Test layout
        run: pnpm test:layout

      # Shared RHI-debug browser smoke ownership must reap its detached Vite
      # process group before a retry can reuse the fixed strict port.
      - name: RHI-debug process-group lifecycle regression
        run: node --test scripts/ci/__tests__/rhi-debug-process.test.mjs
      - name: RHI-debug verify runtime regression
        run: node --test scripts/ci/__tests__/rhi-debug-verify-runtime.test.mjs

      # feat-20260722 M5: keep the public CatalogSource discovery path aligned
      # with the source contract. The cross-repository form also runs locally
      # against the editor worktree before its gitlink is advanced.
      - name: Catalog documentation exit sweep
        run: |
          node scripts/forgeax/check-catalog-docs.mjs
          node --test scripts/__tests__/catalog-documentation-material.test.mjs

      # M5 authority audit: every named category and producer must resolve to
      # one author authority, runtime source, lifecycle, and sourceKey policy.
      - name: Asset authority audit
        run: pnpm run check:asset-authority-audit

      - name: English-only check
        run: |
          python3 scripts/forgeax/check_english_only.py --code packages/*/src apps/*/src scripts tests
          python3 scripts/forgeax/check_english_only.py AGENTS.md
          # Surface scope extension (bug-20260513-english-only-config-yml-scope):
          # .github workflows / dependabot + per-package vitest.config.ts /
          # tsup.config.ts + root build configs were previously skipped because
          # the legacy invocation restricted itself to packages/*/src
          # apps/*/src. AGENTS.md "English-only source + entry docs" is the
          # SSOT; this step now enforces it across the CI surface as well so
          # future PRs cannot reintroduce CJK in workflow comments.
          python3 scripts/forgeax/check_english_only.py --extensions .yml --extensions .yaml .github
          python3 scripts/forgeax/check_english_only.py --extensions .ts \
            $(find packages apps -maxdepth 3 \
                \( -name "vitest.config.ts" -o -name "tsup.config.ts" \) \
                -not -path "*/node_modules/*" -not -path "*/dist/*") \
            vitest.config.ts vitest.setup-webgpu.ts tsup.base.ts

      # Submodule pin reachability gate: every submodule pin (gitlink SHA in
      # HEAD) must be an ancestor of that submodule's origin/main. Catches the
      # bottom-up-merge violation where a superrepo PR merges before its paired
      # submodule PR (e.g. forgeax-engine PR #568 landed an forgeax-engine-assets
      # pin that only lived on the assets feature branch, never on assets main).
      # Runs here (primary-pnpm has submodules: recursive) so it is a required
      # check; refreshes the remote ref and complete ancestry before failing the
      # PR when a pin is not durable on the submodule main.
      - name: Submodule pin reachability
        run: python3 scripts/forgeax/check_submodule_pins.py --repo .

      # Vendor drift check retired 2026-06-06: it read .forgeax-harness/harness-pin.json
      # to diff vendored scripts/ files against the harness at a pinned ref. The
      # harness is now a floating clone (no pin, no submodule checkout in CI) — see
      # docs/specs/2026-06-06-harness-desubmodule-floating-clone-design.md.

      # Brand cast lint (T-008 / D-P15 / R7): 'as Vec*/Mat*/Quat/Color' is
      # only allowed inside packages/math/src/ factories; cross-boundary casts
      # in business code fail the build.
      - name: Math brand cast lint
        run: node packages/math/scripts/lint-brand-cast.mjs

      # R12 Lint (descriptor mirror) — feat-20260508-rhi-surface-completion w16
      # / D-S2 / AC-RSC-08. Walks every `*Descriptor` / `*Attachment` type
      # alias in `@forgeax/engine-rhi` and asserts each property name is present on
      # the matching `GPU*` type from `@webgpu/types@^0.1.69`. Runs before the
      # vitest step so descriptor drift fails CI ahead of the expensive test
      # matrix (charter proposition 4 explicit failure + plan-strategy §4 lint
      # gate row).
      - name: R12 Lint (descriptor mirror)
        run: pnpm r12-lint

      # D-internal lint: enforce `_xxx` <-> @internal JSDoc bidirectional coupling
      # across packages/*/src + apps/*/src. Owns R-internal-B/C/D/E (R-internal-A
      # is owned by Biome useNamingConvention in the lint step above). Only runs
      # in primary-pnpm (portability-bun is literal-forbidden by ci-channel-align).
      - name: lint:internal
        run: pnpm lint:internal

      # feat-20260608-ci-time-cut M5 w15: 4 lint-style vitest tests stripped
      # to direct grep scripts under scripts/lint/ so they run in the lint
      # phase (millisecond cost) instead of the vitest matrix (per-file
      # transform + import graph). Sources:
      #   - grep-r12-lint.mjs        <- packages/rhi/__tests__/r12-lint.test.ts
      #   - grep-error-hints.mjs     <- packages/types/src/__tests__/error-hints.test.ts
      #   - grep-pbr-ibl-callsite.mjs <- packages/shader/src/__tests__/pbr-ibl-callsite.test.ts
      #   - grep-console-errors.mjs  <- packages/remote/src/__tests__/errors.test.ts
      #     (only static-surface drift; runtime instanceof / JSON.stringify
      #     contracts moved to integration coverage).
      - name: lint:grep (feat-20260608-ci-time-cut)
        run: pnpm lint:grep

      # The M4 smoke invokes the same dawn.node/WebGPU path as the headless
      # smoke fleet, so the standard runner must provision lavapipe first.
      - name: Install Mesa Vulkan (lavapipe software path for Hello M4 Dawn smoke)
        uses: ./.github/actions/install-mesa-vulkan-drivers
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}

      # The real hello-audio browser leg uses the same Chrome WebGPU path as
      # vitest-browser. Install the pinned channel here instead of assuming the
      # standard runner image happens to carry /opt/google/chrome/chrome.
      - name: Install Playwright Chrome Beta (for Hello M4 browser smoke)
        uses: ./.github/actions/install-playwright-chrome-beta
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}

      - name: Detect lavapipe ICD (for Hello M4 Chrome Beta WebGPU)
        run: |
          set -e
          ICD_PATH=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "Detected ICD: $ICD_PATH"
          echo "VK_ICD_FILENAMES=$ICD_PATH" >> $GITHUB_ENV
          echo "VK_DRIVER_FILES=$ICD_PATH" >> $GITHUB_ENV

      - name: Hello M4 interactive simulation smoke
        env:
          FORGEAX_CHROME_CHANNEL: chrome-beta
        # Chrome Beta's WebGPU device is stable on this Linux/lavapipe path
        # when headed under Xvfb; headless GPU-process teardown can destroy
        # the device while the real audio/browser assertions are still live.
        run: xvfb-run -a env FORGEAX_BROWSER_HEADLESS=0 pnpm --filter @forgeax/hello-m4-interactive-simulation smoke

      # tweak-20260521-bun-portability-script-gates-expansion w4 / D-4:
      # mirrors the script-name step added to jobs.portability-bun (w3) so
      # `pnpm ci:channel-align` sees a `ci:paths-check` runMatcher hit in
      # this channel. The earlier `node scripts/ci/sync-paths.mjs --check`
      # step (line ~286) is the original SSOT drift gate; this duplicate
      # invocation via the package.json script alias is the explicit
      # channel-alignment touchpoint (research §F-5 / plan §R-4).
      - name: ci:paths-check
        run: pnpm ci:paths-check

      # Vitest coverage and its perf-budget guard are owned by coverage-pnpm.
      # Keeping one producer avoids event-specific test ownership and hidden file handoff.

      # Coverage runs in the independent coverage-pnpm job
      # Package-local Vitest projects own Node coverage; real Dawn files stay
      # in the dedicated vitest-dawn job and require its native setup.
      # The repository-wide declaration/typecheck gate is already owned by
      # ci-core/build-artifacts. Keep this job focused on instrumented runtime
      # coverage; repeating the all-project Vitest typecheck here cost 985s on
      # the heavy runner without adding a new assertion.
      #
      # Vitest 4.x 'close timed out after 500ms' shutdown anomaly: same flake
      # the unit step above guards against can also hit the coverage run
      # (post-merge red on commit 7726c932 → bug-20260609-ci-coverage-close-
      # timeout). Tolerate ONLY when:
      #   1. exit code is non-zero
      #   2. the shutdown marker "close timed out after 500ms" is present
      #   3. NO coverage threshold ERROR ("ERROR: Coverage for") is present
      #   4. the JSON report shows success=true and zero failed tests/suites
      # Conditions 2–3 keep coverage threshold misses (the real failure mode
      # this gate is supposed to catch) failing fast.
      # Bound workers because several self-hosted runner processes share one
      # machine. Host CPU count is not this job's CPU budget; unbounded Vitest
      # workers starve timers and dynamic imports until otherwise-fast tests
      # cross their 5s timeout.
      # Coverage is owned by coverage-pnpm below.

      # The perf-budget guard stays with its coverage producer in
      # coverage-pnpm, so this job has no hidden cross-job file dependency.
      # rhi-wgpu explicit build gate (feat-20260511-rhi-wgpu-impl M2 retained
      # form; feat-20260511-naga-rhi-wgpu-merge M3 retired the rhi-wgpu Rust
      # crate — rhi-wgpu is now a TS-only thin shell that re-exports
      # @forgeax/engine-wgpu-wasm's RHI surface, so `pnpm -F @forgeax/engine-rhi-wgpu build`
      # runs `tsup` only after root typecheck; the wasm bundle owner is @forgeax/engine-wgpu-wasm
      # built in the "Build wgpu-wasm" step above). The recursive `pnpm -r build`
      # step already covers this, but the named explicit step gives the
      # acceptance gate a named CI checkpoint so verify can see "M2 gate pass"
      # in the workflow status (charter proposition 4 explicit failure — named
      # gate vs implicit recursive run). wasm bundle size is metered by the
      # bundle-size MetricKind on @forgeax/engine-wgpu-wasm (forgeax-metrics.schema.json
      # workspace declaration).
      - name: rhi-wgpu build gate
        run: pnpm -F @forgeax/engine-rhi-wgpu build

      # feat-20260616-ci-time-cut-roi-batch M3 (D-4): vitest browser project
      # extracted to standalone `vitest-browser` job (this file, below
      # primary-pnpm); chrome-beta install + lavapipe ICD detect for
      # chrome-beta WebGPU live there.
      # feat-20260617-ci-time-cut-webkit-fallback-split: the fallback verify gate
      # (the self-contained ~145s block: browser install + dev server + verify
      # + screenshot) was extracted to the standalone protected compatibility
      # job `webkit-fallback` (this file, below vitest-dawn) to lift it off the
      # primary-pnpm critical path. It runs in parallel with primary-pnpm,
      # fully masked by the longer primary wall. sticky-comment `needs:` keeps
      # a red fallback row visible in the PR check list.

      # feat-20260616-ci-time-cut-roi-batch M3 (D-4): vitest dawn project
      # extracted to standalone `vitest-dawn` job (this file, below
      # primary-pnpm). dawn-node auto-discovers via standard Vulkan loader
      # paths so that job needs only mesa-vulkan-drivers + dawn.node native
      # binding (no chrome-beta, no lavapipe ICD env exports).

      # AC-06 (a/b/c) shader gate + AC-08 grep gate (feat-20260510-ci-merge-gate-hardening
      # M5 w20 / plan-strategy §4.5):
      #   AC-06 triple gate (feat-20260508-shader-pipeline-mvp / plan-strategy §S-2):
      #     (a) production bundle grep — hello-triangle/dist must not contain naga / wasm-shim references
      #     (b) runtime package dep static check — @forgeax/engine-shader/package.json three dep sections must not contain build core
      #     (c) runtime source import grep — @forgeax/engine-shader/src/**/*.ts must not import build core
      #   AC-08 grep gate (this loop adds gate 13 to ac-08-grep-gate.mjs):
      #     ac-08-grep-gate.mjs aggregates 14 stance gates (a..l + e2 + 13);
      #     gate 13 = `--auto` literal absent in finalize.json (LLM convention drift
      #     detector for finalizer.md Step 5; AC-05 (c) / K-5).
      # Four scripts are independent / zero npm deps; any exit 1 fails CI (charter proposition 4 explicit failure).
      - name: AC-06 (a/b/c) shader gate + AC-08 grep gate
        run: |
          node scripts/check-shader-no-naga-in-dist.mjs
          node scripts/check-shader-runtime-deps.mjs
          node scripts/check-shader-no-compiler-import.mjs
          node apps/hello/triangle/scripts/ac-08-grep-gate.mjs

      # AC-09 + AC-22 + AC-01 + AC-02 + AC-16 console bundle physical
      # isolation + dependency inversion gate (feat-20260511 T-04 +
      # feat-20260516-console-dependency-inversion w6a/w6b/w6d). Three
      # complementary directions on the console <-> engine boundary:
      #   (forward, AC-09 + AC-22 + AC-16) check-engine-no-console-dep.mjs
      #     - engine package.json three dep segments do NOT list
      #       @forgeax/engine-remote + engine dist runtime bundle has 0
      #       hit on @forgeax/engine-remote + 0 hit on the AC-16 named
      #       leaks (ConsoleHandle / StartConsoleOptions / InspectorError).
      #   (reverse bundle, AC-09) check-console-not-in-engine-bundle.mjs
      #     - engine dist runtime bundle (excluding .d.ts) is clean.
      #   (reverse import, AC-01 + AC-02 + G1) check-console-not-import-engine.mjs
      #     - console package.json #dependencies has 0 entry of
      #       @forgeax/engine-{runtime,ecs,pack,gltf} +
      #       #peerDependencies has 0 entry of @forgeax/engine-{pack,gltf} +
      #       packages/remote/src/** has 0 import / require / bare literal
      #       of @forgeax/engine-{pack,gltf} (R-GREP-FALSE-NEG mitigation).
      # AC-17 retired: check-pack-not-in-server-bundle.mjs deleted in
      # the same w6d cut because the dependency inversion physically
      # removed pack from the console deps tree (M3 / w3rm); the gate's
      # guarded surface no longer exists.
      - name: AC-09 + AC-22 console bundle physical isolation gate
        run: |
          node packages/remote/scripts/check-engine-no-console-dep.mjs
          node packages/remote/scripts/check-console-not-in-engine-bundle.mjs
          node packages/remote/scripts/check-console-not-import-engine.mjs
          node packages/remote/scripts/check-no-string-sugar.mjs
          node packages/remote/scripts/check-no-cli-deps.mjs
          node packages/remote/scripts/check-readme-sections.mjs
          # w12: check-no-ecs-literal-residue.mjs deleted — gate depended on ECS_MUTATING_METHODS which is removed.

      # AC-09a engine.assets.load() grep gate (feat-20260513-guid-asset-package-system w14).
      # Asserts that `engine.assets.load(` does not appear in packages/ apps/ templates/
      # (loadByGuid is the replacement; this gate prevents accidental regression).
      - name: AC-09a no-assets-load grep gate
        run: node packages/pack/scripts/check-no-assets-load.mjs

      # AC-12 App package no-component grep gate
      # (feat-20260518-app-shell-game-loop M5 / w17, plan-strategy section 5.5).
      # Two-assertion enforcement on packages/app/src/**:
      #   (a) syntactic export ban -- value-level `App` exports (const /
      #       class / function / default class / default function) plus
      #       export-list re-exports of `App`. Type-level handle
      #       (`interface App` / `type App = ...`) is allowed because the
      #       canonical `App` handle interface lives in
      #       packages/app/src/types.ts (plan-strategy 3.1 + 8.X SSOT)
      #       and re-exports through index.ts (allowlisted).
      #   (b) ECS registration literal ban -- `name: 'App'` inside
      #       defineComponent / registerComponent / addEvent /
      #       insertResource / etc. registrations.
      # AI users who land on this gate fix the symbol name; the literal
      # `App` is reserved for the future ECS Component single closure
      # (OOS-7 spinoff in plan-strategy section 7).
      - name: AC-12 App package no-component grep gate
        run: node scripts/check-app-package-no-component.mjs

      # AC-15 image pipeline isolation gate (feat-20260515-learn-render-getting-started M3 / T-M3-06).
      # Three-path enforcement of the disk -> memory two-state separation
      # (charter P5 producer / consumer split):
      #   (a) packages/runtime/src/  must NOT import legacy image-decoders.d.ts
      #       OR call decodeImage* APIs (the runtime is the GPU consumer; route
      #       via @forgeax/engine-image and pass DecodedImage POD to
      #       AssetRegistry.uploadTexture).
      #   (b) packages/image/src/    must NOT call device.queue.writeTexture
      #       (the image package is the disk-side decoder; it returns
      #       DecodedImage POD and never touches GPU).
      #   (c) apps/learn-render/.../4.textures/index.ts at M8 milestone must
      #       contain `engine.assets.loadByGuid` and must NOT contain direct
      #       `decodeImage` / `uploadTexture` calls. M3 milestone: file absent
      #       -> skip-not-fail (M8 milestone returns the regression check).
      - name: AC-15 image pipeline isolation gate
        run: node scripts/check-image-pipeline-isolation.mjs

      # AC-02 render-graph RHI-pure isolation gate (feat-20260529-rendergraph-pass-abstraction M1 / w8).
      # Asserts that packages/render-graph/src/**/*.ts does not import
      # @forgeax/engine-runtime; the render-graph package is RHI-pure and only
      # depends on @forgeax/engine-rhi + @forgeax/engine-math.
      - name: AC-02 render-graph isolation grep gate
        run: node scripts/check-render-graph-no-runtime-import.mjs packages/render-graph/src

      # AC-29 ecs-runtime dependency isolation gate
      # (feat-20260531-ecs-relationship-abstraction-bidirectional-sync M4 / t22).
      # Asserts packages/ecs/src/**/*.ts does not value-import
      # @forgeax/engine-runtime. The relationship abstraction names its mirror
      # component by string (relationship.mirror = 'Children') resolved via
      # World._getComponentByName, so engine-ecs keeps zero runtime edge.
      - name: AC-29 ecs no-runtime-import grep gate
        run: node scripts/check-ecs-no-runtime-import.mjs

      - name: ECS query public surface census
        run: pnpm grep:ecs-query-surface

      # M1 rename grep gate (feat-20260608-gltf-runtime-textured-scene-and-scene-entity-renam M1 / w1).
      # Asserts that renamed identifiers (SceneNode, LocalNodeId, LocalNodeIdBrand,
      # SceneAsset.nodes) are absent from packages/ + apps/ source. Exempts lines
      # containing "glTF node" / "glTF spec" (AC-02).
      - name: M1 rename grep gate (SceneNode->SceneEntity)
        run: node scripts/check-rename-grep-gate.mjs

      # feat-20260614-ecs-shared-component-and-unique-rename M1-M9 grep gate
      # (plan-strategy 5.5). Bans the 5 stale ECS brand/vocab families in live
      # source: 'managed'/'unmanaged' brand literals, 'ref<'/'handle<' schema
      # vocab, and ManagedRef* class/error identifiers (renamed to 'unique'/
      # 'shared'/UniqueRef*). Whitelists D-6 internal 'managed-array-*' helpers.
      - name: ecs-brand rename grep gate (managed/unmanaged -> shared/unique)
        run: node scripts/grep/check-ecs-brand-grep-gate.mjs

      # learn-render onerror-gate coverage gate (bug-20260609-learn-render-onerror-gate-coverage M5).
      # Asserts every demo under apps/learn-render/*/*/ has src/__tests__/onerror-gate.browser.test.ts
      # AND its index.ts/main.ts contains the __learnRenderErrors bus push literal.
      # Failure stderr is keyed by missing-test / missing-bus-push / missing-entry per demo.
      - name: learn-render onerror-gate coverage gate
        run: node scripts/check-learn-render-onerror-gate.mjs

      # M3 gltf no-image-import grep gate
      # (feat-20260608-gltf-runtime-textured-scene-and-scene-entity-renam M3 / w16).
      # Asserts @forgeax/engine-gltf carries no static `import ... from
      # '@forgeax/engine-image'` lines — image decode flows through the
      # ImportContext.decodeImage seam (D-1 / D-7 enforcement).
      - name: M3 gltf no-image-import grep gate
        run: node packages/gltf/scripts/check-no-image-import.mjs

      # AC-13 browser-safe entries gate (feat-20260524-browser-safe-subexports M4 / T-09).
      # Four-path enforcement of the browser-safe sub-export invariant:
      #   (a) packages/types/dist/index.mjs  must NOT contain `from 'ws'` or
      #       `require('ws')` — the ws peer lives only behind the ./inspector-client
      #       sub-export (node condition).
      #   (b) packages/types/dist/index.d.ts  must NOT expose defaultConnect or
      #       InspectorClient — the sub-export split deleted the main-entry
      #       `export * from './inspector-client'`.
      #   (c) packages/image/dist/index.mjs   must NOT contain `from 'jpeg-js'`,
      #       `from 'upng-js'`, `require('jpeg-js')`, or `require('upng-js')` —
      #       CJS decoders live only behind the ./parse-image / ./decode-image-from-file
      #       sub-exports.
      #   (d) packages/{types,image}/package.json exports map for the three
      #       sub-export paths must contain a `node` block and `"default": null`.
      # OOS-6: this gate is primary-pnpm only (dist sovereignty); NOT replicated
      # to portability-bun (lint / typecheck / sync canary).
      - name: AC-13 browser-safe entries gate
        run: node scripts/check-browser-safe-entries.mjs

      # AC-14 image / gltf sub-asset-key alignment gate (feat-20260515-
      # learn-render-getting-started M8 / T-M8-06):
      #   The image importer (this loop) and the in-flight gltf-loader
      #   importer feat must publish identical SubAssetKey shapes
      #   ({kind, name?, indexFallback}) so reimport-reuse-meta works
      #   uniformly across both pipelines. The script runs single-side
