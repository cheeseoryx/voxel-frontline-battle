      - name: ECS AC-09 single-exit gate
        run: |
          pnpm grep:single-exit

      # AC-12 string-managed-collapse freeze gates
      # (feat-20260515-string-managed-collapse M4 / w15 + w16):
      #   no-string-view-import: the StringView class was deleted when 'string'
      #     collapsed onto the managed-ref dispatch (charter prop 5: native JS
      #     string by-reference, no view-class wrapper). Gate scans packages/
      #     apps/ templates/ TS+JS for `import .* StringView .* from ...` or
      #     `from '.../string-view'` — re-imports regress AI-user single-import
      #     contract. See AGENTS.md Breaking changes 2026-05-15 row.
      #   no-set-managed-ref-store: World.setManagedRefStore + getManagedRefStore
      #     were deleted when managedRefs became constructor-owned non-null.
      #     Gate scans packages/ apps/ templates/ scripts/ + ecs tests for the
      #     literal symbol names; lingering callers regress the always-on
      #     contract.
      - name: ECS string-managed-collapse freeze gates
        run: |
          pnpm grep:no-string-view-import
          pnpm grep:no-set-managed-ref-store

      # Zero-binary invariant gate (docs/2026-05-30-repo-slimming-history-rewrite.md
      # §1 + §10). After the history rewrite, the engine main repo tracks NO
      # binaries — all baselines / demo assets / vendor textures live in the
      # forgeax-engine-assets submodule and the wgpu wasm rebuilds from Rust
      # source. `.gitignore` blocks images/videos passively; this gate enforces
