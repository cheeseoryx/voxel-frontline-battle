  # CI artifacts are a bounded cross-job transport, not a release surface. Once
  # every consumer, report, and main-only publisher has finished, remove the
  # artifacts produced by this run so high-frequency PR/main traffic cannot
  # accumulate Actions storage. GitHub job logs and the sticky PR comment remain
  # the durable diagnostic surfaces; GitHub Release assets are separate storage
  # and are not returned by this workflow-run artifact endpoint.
