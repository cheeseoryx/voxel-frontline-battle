      - metrics-validate
      - sticky-comment
      - publish-fbx-wasm-release
      - publish-wgpu-wasm-release
      - publish-basis-wasm-release
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "standard"]') }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout cleanup script
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: false
          token: ${{ github.token }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Delete artifacts produced by this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/delete-workflow-artifacts.mjs
