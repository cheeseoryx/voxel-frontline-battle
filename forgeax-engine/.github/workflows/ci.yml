name: CI

# Cache strategy: feat-20260608-ci-time-cut-wall-and-machine
#                 + feat-20260616-ci-time-cut-roi-batch (M1-M5 ROI tighten)
#                 + feat-20260617-ci-time-cut-webkit-fallback-split
#                   (fallback verify gate ~145s extracted from primary-pnpm to
#                    standalone protected compatibility job, off the critical path)
# Reusable state is reserved for outputs whose measured reproduction cost
# exceeds transfer overhead:
# 1. .tsbuildinfo + .d.ts — keyed on pnpm-lock.yaml + tsconfig.base.json + **/tsconfig.json + packages/*/src/** + apps/*/src/**
#    (src/** added 2026-06-09 to invalidate cache after upstream-merge stale-dist trap, see PR #320 / #322)
#    Exact hits skip typecheck; prefix matches rebuild declarations under the current source key.
# 2. node_modules — keyed on pnpm-lock.yaml + .pnpm-version + .nvmrc
# 3. Pinned Playwright Chrome Beta carrier — the positive browser jobs and the
#    Chromium WebGL2 fallback share the canonical Linux install action and its
#    scoped deb bundle; Xvfb remains the headed presentation carrier for both.
# Cache-miss upper bound: wall <= 14m / machine-time <= 17m (4-vCPU, AC-03/04)
# Self-hosted runners retain the pnpm content-addressed store under the runner
# home across jobs. Keep `actions/setup-node` from downloading the same
# ~350 MB store archive for every job: on a contended runner the restore has
# stalled for more than ten minutes before `pnpm install` can start. Every
# setup-node block below therefore opts out with `package-manager-cache: false`;
# the install still uses the persistent store, while explicit output caches
# above remain responsible for measured build artifacts.
# AC-82 Q1: tsbuildinfo key = hashFiles(pnpm-lock.yaml, tsconfig.base.json, **/tsconfig.json,
#          packages/*/src/**, apps/*/src/**) on self-hosted Linux X64; node_modules
#          key = hashFiles(pnpm-lock.yaml, .pnpm-version, .nvmrc) on self-hosted Linux X64
# AC-82 Q2: all repository events run the same hard Vitest coverage gate on the
#          trusted self-hosted pool; ci-core owns the repository typecheck, while
#          coverage-pnpm owns instrumented coverage and perf-budget, and
#          coverage-perf owns only the uninstrumented ratio projects.
#          vitest-browser + vitest-dawn run on both PR and main as standalone jobs
#          (feat-20260616 M3: split out of primary-pnpm; sticky-comment `needs:` includes them).
#          smoke-fleet (the non-Bevy dawn-node headless smokes + Mesa install + smoke coverage gate)
#          and bevy-smoke-fleet (the independent Bevy build→smoke pairs) are standalone jobs
#          on the heavy-capacity pool
#          (feat-20260623: split out of primary-pnpm to lift the dawn-node smoke fleet off the
#          build-artifacts -> primary-pnpm critical path; sticky-comment `needs:` includes it).

on:
  push:
    branches: [main]
    paths:
      # BEGIN ci-paths-ssot — generated by scripts/ci/sync-paths.mjs — DO NOT EDIT
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'templates/**'
      - 'skills/**'
      - '.github/**'
      - 'forgeax-engine-assets'
      - '.gitmodules'
      - 'AGENTS.md'
      - '*.json'
      - '*.yaml'
      - '*.ts'
      - '*.toml'
      - 'bun.lock'
      - '.pnpm-version'
      - '.bun-version'
      - '.nvmrc'
      - '!.forgeax-harness/docs/**'
      - '!docs/**'
      # END ci-paths-ssot
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    # CI runs on PR creation, new commits, and reopen. Marking a Draft PR ready
    # for review is a review-state transition, not a new code revision, so it
    # must not launch a duplicate full CI run for the same head SHA.
    # The required-context roster below is therefore always produced by this
    # workflow; no synthetic fallback workflow is needed for path-filtered or
    # documentation-only changes.
    # Render benchmark thresholds are declared by packages/render/package.json;
    # the render-core reduction keeps that producer contract visible here.
  # feat-20260512-threejs-pixel-parity-bench M3 T-016 + T-011 spike backfill:
  # workflow_dispatch trigger lets maintainers re-run the metrics-validate job
  # on the GH Larger NVIDIA-Optimized runner without pushing a new commit, so
  # the T-011 spike samples (n=10, ceil(p95 * 1.10)) can be collected
  # post-merge to bump the threshold=256 placeholder in
  # apps/parity/{threejs,forgeax}/package.json#forgeax.metrics.bench.pixelDiff.
  # See plan-decisions.md "T-014 placeholder backfill TODO" for the loop.
  workflow_dispatch:
    inputs:
      run_shared_evidence_probe:
        description: Run the bounded shared-input baseline/cold/warm evidence probe
        required: false
        type: boolean
        default: false
      run_m4_live_evidence:
        description: Run the opt-in M4 Chrome live re-entry probe
        required: false
        type: boolean
        default: false
concurrency:
  # Only PR runs share a group, so an updated PR commit supersedes its older
  # run. Push and manual runs use their run ID and therefore retain evidence.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # One immutable product identity is shared by checkout, build artifacts,
  # smoke shards, and the required aggregate.
  EXPECTED_PRODUCT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # Opt-in to Node.js 24 for JavaScript actions ahead of GitHub's June 2026
  # forced cutover (Node 20 deprecated 2025-09-19). Surfaces incompatibility
  # now rather than at the cutover deadline.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # feat-20260608-ci-time-cut-wall-and-machine: pinned versions for cache keys.
  # Read from SSOT files (.nvmrc, .pnpm-version) so cache keys auto-invalidate
  # on version bumps.
  NODE_VERSION: '24'
  PNPM_VERSION: '10'
  # All repository events use the trusted self-hosted pool; cache scope derives from the
  # runner capability rather than the event's repository relationship.
  CACHE_RUNNER_SCOPE: self-hosted-ubuntu-linux-x64

jobs:
  # ----------------------------------------------------------------------------
  # post-merge-gate: on push to main, checks whether the merge commit's tree
  # matches the PR's refs/pull/N/merge tree. If identical, the PR CI already
  # validated this exact tree — downstream check jobs can be skipped. The PR
  # association fallback also handles admin squash commits whose title omits #N.
  #
  # Always defaults to "run full CI" on any error — the optimization is a
  # best-effort shortcut, not a correctness dependency.
  #
  # See docs/specs/2026-07-15-post-merge-skip-redundant-checks.md.
  # ----------------------------------------------------------------------------
  post-merge-gate:
    name: post-merge-gate
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "standard"]') }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Self-hosted setup + checkout + the GitHub API comparison can exceed two minutes
    # under normal runner/cache contention; keep this optimization gate from cancelling
    # before it can decide whether redundant post-merge checks are safe to skip.
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip_checks: ${{ steps.compare.outputs.skip_checks }}
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: false
          fetch-depth: 2
          token: ${{ secrets.GHA }}

      - name: Compare merge tree with PR merge ref
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Extract PR number from a merge title when available. Admin squash
          # commits usually use the PR title and omit "#N", so fall back to
          # GitHub's commit-to-PR association endpoint for that shape.
          PR_NUMBER=$(git log -1 --format=%B | head -1 | sed -n 's/.*#\([0-9][0-9]*\).*/\1/p' || true)

          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq 'map(select(.base.ref == "main" and .merged_at != null)) | .[0].number // empty' \
              2>/dev/null || true)
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No associated merged PR found for commit — run full CI"
            echo "skip_checks=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "PR number: ${PR_NUMBER}"

          # Get parent1 of the merge commit = main HEAD at merge time.
          # If this equals the PR's base.sha, main didn't advance between
          # the PR's last CI run and the actual merge → the merge commit
          # tree is identical to what the PR CI already tested.
          #
          # We use the GitHub API instead of git fetch refs/pull/N/merge
          # because: (1) shallow checkout can't fetch refs, and (2) GitHub
          # deletes refs/pull/N/merge after the PR is merged.
          MERGE_PARENT1=$(git log -1 --format=%P | awk '{print $1}')

          PR_BASE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '.base.sha' 2>/dev/null || echo "")

          if [ -z "$PR_BASE" ]; then
            echo "Failed to fetch PR #${PR_NUMBER} base SHA — run full CI"
            echo "skip_checks=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "merge parent1: ${MERGE_PARENT1}"
          echo "PR base:       ${PR_BASE}"

          if [ "$MERGE_PARENT1" = "$PR_BASE" ]; then
            echo "PR #${PR_NUMBER} base matches merge parent1 — main didn't advance, skipping redundant checks"
            echo "skip_checks=true" >> $GITHUB_OUTPUT
          else
            echo "PR #${PR_NUMBER} base differs from merge parent1 — main advanced, running full CI"
            echo "skip_checks=false" >> $GITHUB_OUTPUT
          fi

  # ----------------------------------------------------------------------------
  # build-artifacts: shared build-once / fan-out source for primary-pnpm,
  # portability-bun, and metrics-validate.
  #   feat-small-20260518-ci-cost-and-parallel-trims (D-4 / D-7 / D-8 / AC-12)
  # Baseline (run 26011329234, May 2026): primary-pnpm 4m20s + portability-bun
  # 2m31s + metrics-validate 2m04s wall ~6m20s, runner-min ~10m45s. Each
  # downstream job re-ran tsc -b + tsup pre-test redundantly; Rust+wasm-pack
  # was duplicated only in primary-pnpm but locked metrics-validate via needs.
  # Target after this lift: build-artifacts ~2m + max(primary~2-3m, bun~1.5m)
  # = wall ~4m04s, runner-min ~8m20s (AC-01/02 single-run thresholds 4m30s /
  # 8m30s).
  # Failure mode (charter P3 explicit failure): build-artifacts red ⇒
  # primary-pnpm / portability-bun / metrics-validate ALL stop (sticky-comment
  # job's "build failed" branch, ci.yml line ~1080, surfaces this — AI users
  # tracing a red CI signal land on the build-artifacts log first instead of
  # chasing skipped downstreams). artifact name=build-output is the shared SSOT
  # consumed by all three downstream `Download build artifacts` steps.
  # ----------------------------------------------------------------------------
  core-build:
    name: ci-core
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "standard"]') }}
    outputs:
      core_artifact_id: ${{ steps.upload-core-build.outputs.artifact-id }}
      core_artifact_name: ${{ steps.upload-core-build.outputs.artifact-name }}
      provenance_payload: ${{ steps.write-core-provenance.outputs.payload }}
    # Keep a bounded cold-cache allowance for the exceptional WASM source
    # fallback and the package graph build. The normal path restores the
    # content-keyed WASM bundles and remains a few-minute producer; a timeout is
    # still a cancelled job whose cache post-steps do not run.
    timeout-minutes: 60
    steps:
      - name: Verify self-hosted Linux prerequisites
        if: runner.environment == 'self-hosted'
        run: |
          set -eu
          command -v sudo

      # Scrub a leftover GLOBAL/SYSTEM http.extraheader Authorization before
      # checkout (issue #709 CI outage). actions/checkout sets exactly ONE
      # http.https://github.com/.extraheader at --local scope and cleans that
      # scope in its pre/post steps — but on these persistent self-hosted
      # runners a stale Authorization header is present at --global (~/.gitconfig)
      # and/or --system (/etc/gitconfig) scope, which checkout's --local unset
      # cannot reach. git then sends TWO Authorization headers → GitHub 400
      # "Duplicate header" and checkout fails (observed across Ubpa-0/Ubpa-2).
      # Unset both global and system scopes here; `|| true` keeps it a no-op when
      # the key is absent on a clean self-hosted runner.
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: false
          token: ${{ secrets.GHA }}

      - name: Verify expected product checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"

      # pnpm + Node.js are set up before WASM hydration and all downstream
      # checks. setup-node follows setup-pnpm (it auto-detects the pnpm package
      # manager; its package-manager cache is deliberately disabled for this
      # persistent runner).
      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # The engine root no longer owns a docs/ tree. Keep this check in the
      # build-artifact dependency chain so root docs cannot bypass a required
      # CI context when another scoped path also starts the workflow.
      - name: Enforce root docs policy
        run: node scripts/ci/check-root-docs.mjs

      # The engine repository does not own a root forgeax-loop tree.
      - name: Enforce root forgeax-loop policy
        run: node scripts/ci/check-root-forgeax-loop.mjs

      # Keep the SDK Candidate producer/consumer workflow and its CI baseline
      # contract executable on every main push, not merely Biome-visible.
      - name: SDK Candidate workflow contract
        run: node --test scripts/ci/__tests__/sdk-pr-preflight-contract.test.mjs

      # Every workflow that can execute for a pull request or after a main
      # merge must stay on the organization's self-hosted fleet. Keep this
      # check in the first shared build job so a new hosted selector cannot
      # silently enter PR or post-merge CI.
      - name: Enforce self-hosted PR and post-merge runner policy
        run: >-
          node scripts/ci/check-runner-pool-labels.mjs
          --workflows-dir .github/workflows
          --require-self-hosted-pr
          --require-self-hosted-post-merge

      # feat-20260608-ci-time-cut-wall-and-machine M1 w1: emit runner vCPU count
      # into the job log — the nproc output is the empirical input for the
      # plan-decisions.md decision X/Y (research §F7: both interpretations need
      # real measurement to arbitrate).
      - name: Read runner vCPU count (feat-20260608-ci-time-cut)
        run: |
          echo "nproc: $(nproc)"
          echo "cpuinfo processors: $(cat /proc/cpuinfo | grep -c processor)"

      # Persistent self-hosted workspaces retain generated WASM between
      # checkouts. Remove only the exact package output roots before the
      # content-keyed cache/release ladder so an old bundle cannot masquerade as
      # the current source key on a cache miss.
      - name: Clear stale generated WASM outputs (self-hosted)
        if: runner.environment == 'self-hosted'
        run: rm -rf packages/wgpu-wasm/pkg packages/fbx/pkg packages/codec/pkg

      # wgpu-wasm pkg/ — CACHE -> RELEASE -> BUILD. The output is content-keyed
      # on the Rust sources and build recipe, so the normal path restores a
      # verified bundle in seconds. Only a cache/release miss provisions Rust
      # and runs wasm-pack.
      - name: Cache wgpu-wasm pkg/ (content-keyed)
        uses: actions/cache@v5
        with:
          path: packages/wgpu-wasm/pkg
          key: ${{ env.CACHE_RUNNER_SCOPE }}-wgpu-wasm-pkg-v1-${{ hashFiles('packages/wgpu-wasm/src/**/*.rs', 'packages/wgpu-wasm/Cargo.toml', 'packages/wgpu-wasm/Cargo.lock', 'packages/wgpu-wasm/rust-toolchain.toml', 'packages/wgpu-wasm/build.sh') }}
      - name: Hydrate wgpu-wasm package
        id: hydrate-wgpu-wasm
        env:
          GH_TOKEN: ${{ secrets.GHA }}
        run: |
          set -euo pipefail
          node packages/wgpu-wasm/scripts/ensure-wasm.mjs
          if [ -f packages/wgpu-wasm/pkg/wgpu_wasm.js ]; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "::warning::wgpu-wasm release/cache unavailable; enabling the bounded Rust build path"
          fi
      # A cold wgpu-wasm build invokes Cargo host build scripts, which require
      # a C linker even though the final target is wasm32. Keep this check after
      # cache/release hydration so the common path never touches APT.
      - name: Ensure Ubuntu host compiler
        if: runner.environment == 'self-hosted' && steps.hydrate-wgpu-wasm.outputs.needs_build == 'true'
        shell: bash
        run: bash scripts/ci/ensure-ubuntu-host-compiler.sh
      - name: Setup Rust toolchain
        if: steps.hydrate-wgpu-wasm.outputs.needs_build == 'true'
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: '1.93'
          targets: wasm32-unknown-unknown
      - name: Setup wasm-pack (self-hosted Linux)
        if: steps.hydrate-wgpu-wasm.outputs.needs_build == 'true'
        uses: ./.github/actions/setup-wasm-pack
        with:
          version: '0.14.0'
      - name: Cache cargo registry + wgpu-wasm target
        if: steps.hydrate-wgpu-wasm.outputs.needs_build == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/wgpu-wasm
          shared-key: wgpu-wasm-${{ env.CACHE_RUNNER_SCOPE }}
          cache-on-failure: 'false'
      - name: Build wgpu-wasm (release/cache first, compile only if absent)
        if: steps.hydrate-wgpu-wasm.outputs.needs_build == 'true'
        run: |
          echo "wgpu-wasm pkg/ absent after cache+release — compiling from source"
          bash packages/wgpu-wasm/build.sh

      # fbx-wasm + basis-wasm use the same CACHE -> RELEASE -> BUILD ladder.
      # Their emcc toolchain and multi-minute compiles are skipped whenever a
      # content-keyed cache or the pinned wasm-artifacts release is available.
      - name: Cache fbx-wasm pkg/ (content-keyed)
        id: cache-fbx-pkg
        uses: actions/cache@v5
        with:
          path: packages/fbx/pkg
          key: ${{ env.CACHE_RUNNER_SCOPE }}-fbx-wasm-pkg-v1-${{ hashFiles('packages/fbx/src/native/bridge.c', 'packages/fbx/scripts/fetch-ufbx.mjs', 'packages/fbx/scripts/build-wasm.mjs') }}

      - name: Cache basis-wasm pkg/ (content-keyed)
        id: cache-codec-pkg
        uses: actions/cache@v5
        with:
          path: packages/codec/pkg
          key: ${{ env.CACHE_RUNNER_SCOPE }}-basis-wasm-pkg-v1-${{ hashFiles('packages/codec/scripts/fetch-basis.mjs', 'packages/codec/scripts/build-wasm.mjs') }}

      - name: Hydrate fbx + codec pkg/ from release (best-effort)
        env:
          GH_TOKEN: ${{ secrets.GHA }}
        run: |
          node packages/fbx/scripts/ensure-wasm.mjs
          node packages/codec/scripts/ensure-wasm.mjs

      # Emscripten is needed only after both output caches and release hydration
      # miss. This keeps the no-xz bootstrap and its archive download off the
      # common ci-core path.
      - name: Check emcc build needed
        id: emcc-needed
        run: |
          need=false
          [ -f packages/fbx/pkg/fbx-wasm.wasm ] || need=true
          [ -f packages/codec/pkg/encode/basis_encoder.wasm ] || need=true
          echo "value=$need" >> "$GITHUB_OUTPUT"
          echo "emcc build needed: $need"

      - name: Restore Emscripten no-xz cache (Linux)
        id: emsdk-no-xz-cache
        if: steps.emcc-needed.outputs.value == 'true' && runner.os == 'Linux'
        uses: actions/cache/restore@v5
        with:
          path: emsdk-cache
          key: emsdk-no-xz-${{ runner.os }}-${{ runner.arch }}-6.0.2-${{ hashFiles('scripts/ci/setup-emscripten-no-xz.py', 'scripts/ci/emscripten-no-xz.lock.json', '.nvmrc') }}

      - name: Prepare pinned Emscripten archive (Linux cache miss)
        if: steps.emcc-needed.outputs.value == 'true' && runner.os == 'Linux' && steps.emsdk-no-xz-cache.outputs.cache-hit != 'true'
        run: >-
          python3 scripts/ci/prepare-emscripten-no-xz-archive.py
          --lock scripts/ci/emscripten-no-xz.lock.json
          --archive "$RUNNER_TEMP/emscripten-no-xz/wasm-binaries.tar.xz"
          --github-env "$GITHUB_ENV"

      - name: Setup Emscripten without external xz (Linux)
        if: steps.emcc-needed.outputs.value == 'true' && runner.os == 'Linux'
        run: |
          if [ "${{ steps.emsdk-no-xz-cache.outputs.cache-hit }}" = "true" ]; then
            python3 scripts/ci/setup-emscripten-no-xz.py \
              --version 6.0.2 \
              --lock scripts/ci/emscripten-no-xz.lock.json \
              --cache-dir emsdk-cache \
              --github-env "$GITHUB_ENV" \
              --github-path "$GITHUB_PATH" \
              --evidence-output artifacts/emscripten-bootstrap.json
          else
            python3 scripts/ci/setup-emscripten-no-xz.py \
              --version 6.0.2 \
              --lock scripts/ci/emscripten-no-xz.lock.json \
              --archive "$RUNNER_TEMP/emscripten-no-xz/wasm-binaries.tar.xz" \
              --release-metadata scripts/ci/emscripten-no-xz.lock.json \
              --archive-sha256 "$EMSCRIPTEN_NO_XZ_ARCHIVE_SHA256" \
              --cache-dir emsdk-cache \
              --github-env "$GITHUB_ENV" \
              --github-path "$GITHUB_PATH" \
              --evidence-output artifacts/emscripten-bootstrap.json
          fi

      - name: Export Emscripten no-xz environment (Linux)
        if: steps.emcc-needed.outputs.value == 'true' && runner.os == 'Linux'
        run: |
          set -eu
          emsdk_root="$GITHUB_WORKSPACE/emsdk-cache/install"
          emscripten_root="$emsdk_root/emscripten"
          node_path="$(command -v node)"
          config_path="$RUNNER_TEMP/forgeax-emscripten-config.py"
          cat > "$config_path" <<EOF
          LLVM_ROOT = "$emsdk_root/bin"
          BINARYEN_ROOT = "$emsdk_root"
          NODE_JS = "$node_path"
          CACHE = "$emscripten_root/cache"
          EOF
          {
            echo "EMSDK=$emsdk_root"
            echo "EMSCRIPTEN=$emscripten_root"
            echo "EMSCRIPTEN_ROOT=$emscripten_root"
            echo "EMSDK_NODE=$node_path"
            echo "EM_CONFIG=$config_path"
            echo "EM_CACHE=$emscripten_root/cache"
            echo "EM_LLVM_ROOT=$emsdk_root/bin"
            echo "EM_BINARYEN_ROOT=$emsdk_root"
          } >> "$GITHUB_ENV"
          {
            echo "$emscripten_root"
            echo "$emsdk_root/bin"
          } >> "$GITHUB_PATH"
          test -x "$emscripten_root/emcc"
          EM_CONFIG="$config_path" "$emscripten_root/emcc" --version

      - name: Typecheck output preflight regression
        run: node --test scripts/__tests__/typecheck-output-preflight.test.mjs

      - name: Save Emscripten no-xz cache (Linux)
        if: steps.emcc-needed.outputs.value == 'true' && runner.os == 'Linux' && steps.emsdk-no-xz-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: emsdk-cache
          key: emsdk-no-xz-${{ runner.os }}-${{ runner.arch }}-6.0.2-${{ hashFiles('scripts/ci/setup-emscripten-no-xz.py', 'scripts/ci/emscripten-no-xz.lock.json', '.nvmrc') }}

      - name: Build fbx-wasm (compile only if absent)
        if: steps.emcc-needed.outputs.value == 'true'
        run: |
          if [ ! -f packages/fbx/pkg/fbx-wasm.wasm ]; then
            echo "fbx-wasm pkg/ absent after cache+release — compiling from source"
            node packages/fbx/scripts/fetch-ufbx.mjs
            node packages/fbx/scripts/build-wasm.mjs
          else
            echo "fbx-wasm pkg/ present — skipping emcc compile"
          fi

      - name: Build basis-wasm (compile only if absent)
        if: steps.emcc-needed.outputs.value == 'true'
        run: |
          if [ ! -f packages/codec/pkg/encode/basis_encoder.wasm ]; then
            echo "basis-wasm pkg/ absent after cache+release — compiling from source"
            node packages/codec/scripts/fetch-basis.mjs
            node packages/codec/scripts/build-wasm.mjs
          else
            echo "basis-wasm pkg/ present — skipping emcc compile"
          fi

      # Self-hosted workspaces persist ignored dependency trees between jobs.
      # Clear only the root links before install so the typecheck command is
      # recreated deterministically; pnpm's persistent store remains intact.
      - name: Clear stale root dependency links (self-hosted)
        run: rm -rf node_modules

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile --ignore-scripts --force

      # pnpm 11 may omit TypeScript's root .bin shim with --ignore-scripts.
      # Repair the two exact links once after install before all typecheck and
      # package build steps.
      - name: Ensure TypeScript command shims
        run: |
          ln -sf "$PWD/node_modules/typescript/bin/tsc" "$PWD/node_modules/.bin/tsc"
          ln -sf "$PWD/node_modules/typescript/bin/tsserver" "$PWD/node_modules/.bin/tsserver"

      - name: Add TypeScript bin path (self-hosted cache safety)
        run: echo "$PWD/node_modules/typescript/bin" >> "$GITHUB_PATH"

      # === Cache: .tsbuildinfo (feat-20260608-ci-time-cut-wall-and-machine) ===
      # Restore .tsbuildinfo for tsc -b incremental builds; restore-keys
      # prefix-match picks the newest entry across runs when the exact key
      # misses (e.g. lockfile bump). Key hashes lockfile + tsconfig to
      # naturally invalidate on TS dependency or tsconfig changes (research
      # F6 trap 4). No --force on tsc -b (F6 trap 2 — would bypass cache).
      # feat-20260616 w8a: split into restore + save steps so the typecheck
      # gate can read `cache-matched-key` (only exposed by the split form;
      # the combined `actions/cache@v5` exposes only `cache-hit`, which is
      # `'true'` solely on exact-key match — prefix-match wins via
      # restore-keys would not skip typecheck under combined form, and
      # actionlint rejects the property reference, causing GitHub Actions
      # to silently drop the workflow with 0 CI runs triggered).
      - name: Restore .tsbuildinfo + .d.ts (feat-20260608-ci-time-cut)
        id: cache-tsbuildinfo
        uses: actions/cache/restore@v5
        with:
          # Cache both the .tsbuildinfo SSOT and the .d.ts/.d.ts.map outputs
          # produced by `tsc -b`. Restoring buildinfo without the .d.ts outputs
          # would let typecheck-skip succeed but break downstream consumers
          # (vitest --typecheck, portability-bun bun.lock) that rely on the
          # declaration files. Cache key hashes packages/*/src/** and the
          # typecheck scheduler in addition to lockfile + tsconfig so source,
          # export, or scheduler changes naturally invalidate;
          # the original (lockfile + tsconfig only) key let tsc -b "incremental
          # skip" succeed against stale .d.ts when an upstream merge added new
          # exports without touching tsconfig (feat-20260608-ci-time-cut
          # post-merge stale-dist trap, surfaced on PR #320 + #322 portability-
          # bun reds against origin/main HEAD with new SceneEntity / LocalEntityId
          # exports).
          path: |
            packages/*/dist/.tsbuildinfo
            packages/*/dist/**/*.d.ts
            packages/*/dist/**/*.d.ts.map
            apps/*/dist/.tsbuildinfo
            apps/*/dist/**/*.d.ts
            apps/*/dist/**/*.d.ts.map
          # `-v2-` namespace bump: the prior buggy typecheck-skip guard
          # (cache-matched-key == '') saved STALE .d.ts under the exact v1
          # key for src states it never ran `tsc -b` against. Those poisoned
          # v1 entries must be evicted; a fresh prefix (`-v2-`) cannot
          # prefix-match them, forcing a one-time full miss -> correct rebuild.
          # `-v5-` namespace bump (feat-20260727-m3-cache-repair): the v4
          # prefix cache was observed restoring a poisoned tsbuildinfo entry
          # whose declaration outputs omitted @forgeax/engine-types. That
          # made the app typecheck fail before downstream artifacts existed.
          # Start a clean namespace instead of inheriting that prefix.
          # `-v6-` namespace bump (feat-20260805-threejs-color-lighting-parity):
          # v5 also retained a producer-package declaration cache that omitted
          # the runtimeBinding export consumed by the vfx integration test.
          # The physics/
          # rapier2d/rapier3d previously diverged from sibling tsconfigs in two
          # ways that together caused TS5055 ("would overwrite input file") in
          # the build-artifacts typecheck: (1) `include: ["src"]` (directory
          # form) instead of ["src/**/*"], and (2) the default .tsbuildinfo
          # location (packages/<pkg>/tsconfig.tsbuildinfo, OUTSIDE dist/) so
          # this cache stored their .d.ts but NOT their buildinfo. A
          # restore-keys prefix-match then brought back stale physics .d.ts
          # without a matching buildinfo, and `tsc -b` treated those .d.ts as
          # program inputs. The 3 tsconfigs are now fully aligned to the sibling
          # shape (declaration + declarationMap + ./dist/.tsbuildinfo +
          # include ["src/**/*"]). v2/v3/v4 entries are poisoned (the v3/v4
          # attempts were re-saved mid-failure by the always()-gated save
          # step), so v5 is a clean slate; mirrors the v1->v2 eviction
          # precedent above.
          # `-v8-` namespace bump (feat-20260813-mesh-material-slots): v6/v7
          # prefix restore could retain the shared-types buildinfo while
          # materialization ran without --force. A producer-only type change
          # then left consumers reading the restored pre-change declaration,
          # and the always() save poisoned the exact source key. v8 evicts
          # those entries; the forced graph rebuild and success-only save below
          # prevent recurrence.
          key: ${{ env.CACHE_RUNNER_SCOPE }}-tsbuildinfo-v8-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.base.json', '**/tsconfig.json', 'scripts/typecheck-apps.mjs', 'scripts/lib/runner-resources.mjs', 'packages/*/src/**', 'apps/*/src/**') }}
          restore-keys: |
            ${{ env.CACHE_RUNNER_SCOPE }}-tsbuildinfo-v8-

      # Exact declaration-cache hits skip typecheck; prefix matches rebuild and save
      # under the current source key so stale declarations cannot cross revisions.
      - name: Invalidate prefix-restored buildinfo before typecheck
        if: steps.cache-tsbuildinfo.outputs.cache-hit != 'true'
        run: |
          find packages apps -path '*/dist/.tsbuildinfo' -delete 2>/dev/null || true
          # A prefix hit restores declarations from an older source graph as
          # well as its buildinfo. Leaving those outputs in place makes tsc -b
          # treat an output declaration as an input when a package changed.
          find packages apps -type f \( -path '*/dist/*.d.ts' -o -path '*/dist/*.d.ts.map' \) -delete 2>/dev/null || true

      - name: Clear poison-prone physics dist before typecheck (feat-20260623-plugin-system)
        if: steps.cache-tsbuildinfo.outputs.cache-hit != 'true'
        run: |
          find packages/physics packages/physics-rapier2d packages/physics-rapier3d \
            -path '*/dist/*' -name '*.d.ts' -delete 2>/dev/null || true
          rm -f packages/physics/dist/.tsbuildinfo \
            packages/physics-rapier2d/dist/.tsbuildinfo \
            packages/physics-rapier3d/dist/.tsbuildinfo 2>/dev/null || true

      # The vfx compiler integration test imports the Vite Pack producer through
      # its package export. Remove only that package's cached declarations on a
      # cache miss so the new project reference rebuilds the export from source
      # instead of accepting a stale dist/index.d.ts.
      - name: Clear stale Vite Pack declarations before typecheck
        if: steps.cache-tsbuildinfo.outputs.cache-hit != 'true'
        run: |
          rm -f packages/vite-plugin-pack/dist/.tsbuildinfo \
            packages/vite-plugin-pack/dist/*.d.ts \
            packages/vite-plugin-pack/dist/*.d.ts.map

      # @forgeax/engine is a generated facade package, not a TypeScript
      # project-reference participant. The broad cache invalidation above
      # removes its facade declarations together with project outputs, while
      # its runtime .mjs files remain the current source-build projection.
      # Rebuild the small facade package before consumer typecheck so imports
      # such as @forgeax/engine/pack/guid retain their declaration contract on
      # a cold or prefix-restored runner.
      - name: Materialize generated Engine facade declarations before app typecheck
        if: steps.cache-tsbuildinfo.outputs.cache-hit != 'true'
        run: |
          pnpm --filter @forgeax/engine build
          test -s packages/engine/dist/facades/pack/guid.d.ts

      # The app typecheck runs outside the project-reference graph and
      # resolves workspace package exports directly. Materialize the shared
      # types declarations explicitly so a cold or partial declaration cache
      # cannot make @forgeax/engine-types disappear from consumer apps.
      - name: Materialize shared declarations before app typecheck
        run: >-
          node node_modules/typescript/bin/tsc -b
          packages/types/tsconfig.json
          packages/profiler/tsconfig.json
          --force

      - name: Vitest typecheck (feat-20260608-ci-time-cut)
        if: steps.cache-tsbuildinfo.outputs.cache-hit != 'true'
        run: |
          # pnpm 11 may omit the root .bin shim for TypeScript with
          # --ignore-scripts; expose the installed compiler directly.
          echo "$PWD/node_modules/typescript/bin" >> "$GITHUB_PATH"
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$PWD/node_modules/typescript/bin:$PWD/node_modules/.bin:$PATH"
          pnpm run typecheck

      # A restored declaration cache can hide a missing project reference: the
      # consumer resolves an unrelated package's old dist/index.d.ts instead of
      # making tsc build that package first. Clear state's declarations and
      # build runtime alone so this graph edge is exercised on the self-hosted
      # PR runner (issue #758).
      - name: 'Reproduce clean state declaration graph (issue #758)'
        run: |
          rm -f packages/state/dist/.tsbuildinfo \
            packages/state/dist/*.d.ts \
            packages/state/dist/*.d.ts.map \
            packages/runtime/dist/.tsbuildinfo
          # Force the referenced producer projects too: a prefix-restored
          # producer tsbuildinfo can otherwise claim an old declaration is
          # current after a producer-only API change (e.g. render's material
          # channel options), leaving the consumer graph stale.
          node node_modules/typescript/bin/tsc -b packages/runtime/tsconfig.json --force

      # The import package consumes geometry declarations directly. Clearing
      # both consumer and producer outputs makes this narrow project-reference
      # edge fail on a missing reference instead of passing through a restored
      # declaration cache (bug-build-graph-20260819).
      - name: Reproduce clean import geometry declaration graph
        run: |
          rm -f packages/geometry/dist/.tsbuildinfo \
            packages/geometry/dist/*.d.ts \
            packages/geometry/dist/*.d.ts.map \
            packages/import/dist/.tsbuildinfo \
            packages/import/dist/*.d.ts \
            packages/import/dist/*.d.ts.map
          node node_modules/typescript/bin/tsc -b packages/import/tsconfig.json --force

      # feat-20260616 w8a: save side of the split cache. Gated on success so
      # failed declaration builds cannot poison the exact source key, and on
      # `cache-hit != 'true'` to avoid duplicate exact-hit saves. A successful
      # prefix-match rebuild still saves under the new exact key.
      - name: Save .tsbuildinfo + .d.ts (feat-20260608-ci-time-cut)
        if: success() && steps.cache-tsbuildinfo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            packages/*/dist/.tsbuildinfo
            packages/*/dist/**/*.d.ts
            packages/*/dist/**/*.d.ts.map
            apps/*/dist/.tsbuildinfo
            apps/*/dist/**/*.d.ts
            apps/*/dist/**/*.d.ts.map
          key: ${{ env.CACHE_RUNNER_SCOPE }}-tsbuildinfo-v8-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.base.json', '**/tsconfig.json', 'scripts/typecheck-apps.mjs', 'scripts/lib/runner-resources.mjs', 'packages/*/src/**', 'apps/*/src/**') }}

      # Forty remote cache actions took 93-1099s to restore outputs that tsup
      # rebuilt in 38-58s. One topological pnpm invocation keeps dependency
      # order while using the four-vCPU runner instead of serial transfer
      # actions. The reusable Editor action has its own source-only producer;
      # ci-core owns only Engine CI's canonical package artifact.
      - name: Build package JavaScript once
        run: pnpm --filter './packages/**' -r --workspace-concurrency=4 --if-present build

      - name: Check package runtime dependency closure
        run: pnpm check:package-runtime-dependencies

      - name: Test package runtime dependency checks
        run: pnpm test:package-runtime-dependencies

      # Per-artifact size report: emit compressed/expanded bytes for each
      # contract-declared artifact class. Uses `shopt -s nullglob` so an empty
      # shader-manifest family collapses to nothing.
      - name: Echo per-artifact sizes
        shell: bash
        run: |
          shopt -s nullglob
          CLASS_NAMES=(
            engine-dist
            wasm-runtime
            wasm-fbx
            wasm-codec
            app-dist
          )
          CLASS_GLOBS=(
            "packages/*/dist packages/preview/assets/canonical-kit"
            "packages/wgpu-wasm/pkg"
            "packages/fbx/pkg"
            "packages/codec/pkg"
            "apps/*/dist/shaders/manifest.json"
          )
          TOTAL_KB=0
          for INDEX in "${!CLASS_NAMES[@]}"; do
            CLASS="${CLASS_NAMES[$INDEX]}"
            read -ra GLOBS <<< "${CLASS_GLOBS[$INDEX]}"
            DIRS=()
            for G in "${GLOBS[@]}"; do
              for F in $G; do
                if [ -f "$F" ] || [ -d "$F" ]; then
                  DIRS+=("$F")
                fi
              done
            done
            if [ "${#DIRS[@]}" -gt 0 ]; then
              KB=$(du -sk "${DIRS[@]}" | awk '{ sum += $1 } END { print sum }')
              MB=$((KB / 1024))
              echo "  ${CLASS}: ${MB} MB" | tee -a "$GITHUB_STEP_SUMMARY"
              TOTAL_KB=$((TOTAL_KB + KB))
            else
              echo "  ${CLASS}: 0 MB (empty)" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          TOTAL_MB=$((TOTAL_KB / 1024))
          echo "total artifact size: ${TOTAL_MB} MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "${TOTAL_MB}" -gt 500 ]; then
            echo "::error::total artifact size ${TOTAL_MB} MB exceeds 500 MB hard cap"
            exit 1
          fi
          if [ "${TOTAL_MB}" -gt 100 ]; then
            echo "::warning::total artifact size ${TOTAL_MB} MB exceeds 100 MB soft warning"
          fi

      # Stage each class at the consumer extraction root. upload-artifact
      # removes path segments before a glob's least common ancestor, so direct
      # uploads of `packages/*/dist` would extract as `<package>/dist` instead
      # of `packages/<package>/dist`. The preview package's source-at-build
      # canonical kit is staged beside its dist output so package-owned assets
      # survive core artifact hydration.
      - name: Stage core artifact classes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/core/packages
          for source in packages/*/dist packages/preview/assets/canonical-kit; do
            target="ci-artifacts/core/${source}"
            mkdir -p "$(dirname "$target")"
            cp -a "$source" "$target"
          done
          for class in wasm-runtime wasm-fbx wasm-codec; do
            case "$class" in
              wasm-runtime) source=packages/wgpu-wasm/pkg ;;
              wasm-fbx) source=packages/fbx/pkg ;;
              wasm-codec) source=packages/codec/pkg ;;
            esac
            target="ci-artifacts/core/${source}"
            mkdir -p "$(dirname "$target")"
            cp -a "$source" "$target"
          done

      - name: Fingerprint core artifact families
        shell: node {0}
        run: |
          const { execFileSync } = require('node:child_process');
          const { globSync, writeFileSync } = require('node:fs');
          const root = 'ci-artifacts/core';
          const fingerprint = (paths) => execFileSync(
            process.execPath,
            ['scripts/ci/evidence/fingerprint.mjs', '--root', root, ...paths],
            { encoding: 'utf8' },
          ).trim();
          const engineDistPaths = [
            ...globSync('packages/*/dist', { cwd: root }),
            'packages/preview/assets/canonical-kit',
          ];
          const fingerprints = {
            'engine-dist': fingerprint(engineDistPaths),
            'wasm-runtime': fingerprint(['packages/wgpu-wasm/pkg']),
            'wasm-fbx': fingerprint(['packages/fbx/pkg']),
            'wasm-codec': fingerprint(['packages/codec/pkg']),
          };
          writeFileSync('ci-artifacts/core-fingerprints.json', `${JSON.stringify(fingerprints)}\n`);

      # Keep this small source-identity receipt for GPU timing and artifact
      # consumers. Its historical filename is retained for those readers; it
      # is not an Editor prerequisite build or a cross-repository dependency.
      - name: Bind core artifact to the checked-out Engine source
        shell: node {0}
        run: |
          const { writeFileSync } = require('node:fs');
          writeFileSync(
            'ci-artifacts/core/engine-prerequisite-build-manifest.json',
            `${JSON.stringify({ engineSha: process.env.EXPECTED_PRODUCT_SHA }, null, 2)}\n`,
          );

      - name: Upload core build transfer artifact
        id: upload-core-build
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: core-build-a${{ github.run_attempt }}
          path: ci-artifacts/core
          retention-days: 1
          if-no-files-found: error

      - name: Write core producer provenance record
        id: write-core-provenance
        env:
          ARTIFACT_ID: ${{ steps.upload-core-build.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.upload-core-build.outputs.artifact-name }}
          UPLOAD_STARTED_AT: ${{ steps.upload-core-build.outputs.upload-started-at }}
          UPLOAD_COMPLETED_AT: ${{ steps.upload-core-build.outputs.upload-completed-at }}
          UPLOAD_ELAPSED_SECONDS: ${{ steps.upload-core-build.outputs.upload-elapsed-seconds }}
          UPLOAD_TRANSFER_ATTEMPT: ${{ steps.upload-core-build.outputs.upload-transfer-attempt }}
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const fingerprints = JSON.parse(fs.readFileSync('ci-artifacts/core-fingerprints.json'));
          const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
          const upload = {
            startedAt: process.env.UPLOAD_STARTED_AT,
            completedAt: process.env.UPLOAD_COMPLETED_AT,
            elapsedSeconds: Number(process.env.UPLOAD_ELAPSED_SECONDS),
            transferAttempt: Number(process.env.UPLOAD_TRANSFER_ATTEMPT),
          };
          const artifacts = Object.entries(fingerprints).map(([className, inputFingerprint]) => ({
            class: className,
            artifactName: process.env.ARTIFACT_NAME,
            artifactId: process.env.ARTIFACT_ID,
            producerRunAttempt: attempt,
            inputFingerprint,
            upload,
          }));
          const record = {
            schemaVersion: 1,
            producer: 'core-build',
            runId: process.env.GITHUB_RUN_ID,
            producerRunAttempt: attempt,
            artifacts,
          };
          fs.writeFileSync(
            `provenance-core-build-a${attempt}.json`,
            `${JSON.stringify(record)}\n`,
          );
          const payload = Buffer.from(JSON.stringify(record)).toString('base64');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `payload=${payload}\n`);

      # Contract-workflow consistency check (feat-20260716-ci-build-artifact-cost-optimization
      # M2): verify that the workflow matches the contract after upload steps.
      - name: Check contract-workflow consistency
        run: node scripts/ci/check-build-artifact-contract.mjs --workflow .github/workflows/ci.yml

  shared-app-inputs:
    name: shared-app-inputs
    outputs:
      input_fingerprint: ${{ steps.build-shared-inputs.outputs.input_fingerprint }}
      shared_artifact_id: ${{ steps.upload-shared-inputs.outputs.artifact-id }}
      shared_artifact_name: ${{ steps.upload-shared-inputs.outputs.artifact-name }}
      provenance_payload: ${{ steps.write-shared-provenance.outputs.payload }}
    permissions:
      contents: read
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "standard"]') }}
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: recursive
          token: ${{ secrets.GHA }}
      - name: Ensure Ubuntu host compiler
        if: runner.environment == 'self-hosted'
        shell: bash
        run: bash scripts/ci/ensure-ubuntu-host-compiler.sh
      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> $GITHUB_OUTPUT
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The shared producer's shader plugin transitively imports the wgpu-wasm
      # glue. Provision it with the same CACHE -> RELEASE -> BUILD contract as
      # core-build before installing or building plugin dependencies.
      - name: Setup Rust toolchain for wgpu-wasm
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93'
          targets: wasm32-unknown-unknown
      - name: Setup wasm-pack for wgpu-wasm
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - name: Cache wgpu-wasm pkg/ (content-keyed)
        uses: actions/cache@v5
        with:
          path: packages/wgpu-wasm/pkg
          key: ${{ env.CACHE_RUNNER_SCOPE }}-wgpu-wasm-pkg-v1-${{ hashFiles('packages/wgpu-wasm/src/**/*.rs', 'packages/wgpu-wasm/Cargo.toml', 'packages/wgpu-wasm/Cargo.lock', 'packages/wgpu-wasm/rust-toolchain.toml', 'packages/wgpu-wasm/build.sh') }}
      - name: Build wgpu-wasm (release/cache first, compile only if absent)
        env:
          GH_TOKEN: ${{ secrets.GHA }}
        run: |
          node packages/wgpu-wasm/scripts/ensure-wasm.mjs
          if [ ! -f packages/wgpu-wasm/pkg/wgpu_wasm.js ]; then
            echo "wgpu-wasm pkg/ absent after cache+release — compiling from source"
            bash packages/wgpu-wasm/build.sh
          else
            echo "wgpu-wasm pkg/ present (cache or release) — skipping wasm-pack compile"
          fi
      - name: Install shared producer dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build shared producer plugin dependencies
        run: |
          pnpm --filter @forgeax/engine-vite-plugin-pack... build
          pnpm --filter @forgeax/engine-vite-plugin-shader... build
          pnpm --filter @forgeax/engine-audio-webaudio... build
          pnpm --filter @forgeax/engine-gltf... build
      - name: Build declared shared app inputs
        id: build-shared-inputs
        run: >-
          node scripts/ci/build-shared-app-inputs.mjs --root . --out shared-app-inputs
          --catalog-only
          --github-output "$GITHUB_OUTPUT"
      - name: Fingerprint shared artifact families
        shell: node {0}
        run: |
          const { execFileSync } = require('node:child_process');
          const { writeFileSync } = require('node:fs');
          const fingerprint = (path) => execFileSync(
            process.execPath,
            ['scripts/ci/evidence/fingerprint.mjs', '--root', '.', path],
            { encoding: 'utf8' },
          ).trim();
          const fingerprints = {
            'shared-asset-pack': fingerprint('shared-app-inputs/assets'),
            'shared-engine-shaders': fingerprint('shared-app-inputs/shaders'),
          };
          writeFileSync('shared-input-fingerprints.json', `${JSON.stringify(fingerprints)}\n`);
      - name: Pack shared app input projection
        run: |
          rm -rf shared-app-inputs-transfer
          mkdir -p shared-app-inputs-transfer
          tar -czf shared-app-inputs-transfer/shared-app-inputs.tar.gz \
            -C shared-app-inputs assets shaders manifest.json
          test -s shared-app-inputs-transfer/shared-app-inputs.tar.gz
          du -h shared-app-inputs-transfer/shared-app-inputs.tar.gz
      - name: Upload app-shard shared input projection
        id: upload-shared-inputs
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: shared-app-inputs-a${{ github.run_attempt }}
          path: shared-app-inputs-transfer/shared-app-inputs.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Write shared producer provenance record
        id: write-shared-provenance
        env:
          # Provenance classes describe the one catalog projection consumed by
          # app shards and the browser publication probe.
          SHARED_ARTIFACT_ID: ${{ steps.upload-shared-inputs.outputs.artifact-id }}
          SHARED_ARTIFACT_NAME: ${{ steps.upload-shared-inputs.outputs.artifact-name }}
          UPLOAD_STARTED_AT: ${{ steps.upload-shared-inputs.outputs.upload-started-at }}
          UPLOAD_COMPLETED_AT: ${{ steps.upload-shared-inputs.outputs.upload-completed-at }}
          UPLOAD_ELAPSED_SECONDS: ${{ steps.upload-shared-inputs.outputs.upload-elapsed-seconds }}
          UPLOAD_TRANSFER_ATTEMPT: ${{ steps.upload-shared-inputs.outputs.upload-transfer-attempt }}
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('shared-app-inputs/manifest.json'));
          const sharedProduction = JSON.parse(fs.readFileSync('shared-app-inputs/production-facts.json'));
          const fingerprints = JSON.parse(fs.readFileSync('shared-input-fingerprints.json'));
          const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
          const upload = {
            startedAt: process.env.UPLOAD_STARTED_AT,
            completedAt: process.env.UPLOAD_COMPLETED_AT,
            elapsedSeconds: Number(process.env.UPLOAD_ELAPSED_SECONDS),
            transferAttempt: Number(process.env.UPLOAD_TRANSFER_ATTEMPT),
          };
          const record = {
            schemaVersion: 1,
            producer: 'shared-app-inputs',
            runId: process.env.GITHUB_RUN_ID,
            producerRunAttempt: attempt,
            sharedInputs: {
              schemaVersion: manifest.schemaVersion,
              inputFingerprint: manifest.inputFingerprint,
              sourceFingerprint: manifest.inputFingerprint,
              inventory: manifest.inventory,
            },
            sharedProduction,
            artifacts: [
              {
                class: 'shared-asset-pack',
                artifactName: process.env.SHARED_ARTIFACT_NAME,
                artifactId: process.env.SHARED_ARTIFACT_ID,
                producerRunAttempt: attempt,
                inputFingerprint: fingerprints['shared-asset-pack'],
                upload,
              },
              {
                class: 'shared-engine-shaders',
                artifactName: process.env.SHARED_ARTIFACT_NAME,
                artifactId: process.env.SHARED_ARTIFACT_ID,
                producerRunAttempt: attempt,
                inputFingerprint: fingerprints['shared-engine-shaders'],
                upload,
              },
            ],
          };
          fs.writeFileSync(
            `provenance-shared-app-inputs-a${attempt}.json`,
            `${JSON.stringify(record)}\n`,
          );
          const payload = Buffer.from(JSON.stringify(record)).toString('base64');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `payload=${payload}\n`);

  # Optional, explicitly sampled evidence for the shared-input cost fact. This is
  # never part of the required PR/main path; a maintainer opts in through
  # workflow_dispatch when a comparable baseline/cold/warm window is needed.
  shared-evidence-probe:
    name: shared-evidence-probe
    if: github.event_name == 'workflow_dispatch' && inputs.run_shared_evidence_probe == true
    timeout-minutes: 20
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "standard"]') }}
    permissions:
      contents: read
    outputs:
      evidence_payload: ${{ steps.encode.outputs.evidence_payload }}
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: recursive
          token: ${{ secrets.GHA }}
      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> "$GITHUB_OUTPUT"
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Setup Rust toolchain for wgpu-wasm
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93'
          targets: wasm32-unknown-unknown
      - name: Setup wasm-pack for wgpu-wasm
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - name: Ensure wgpu-wasm release artifact
        env:
          GH_TOKEN: ${{ secrets.GHA }}
        run: |
          node packages/wgpu-wasm/scripts/ensure-wasm.mjs
          if [ ! -f packages/wgpu-wasm/pkg/wgpu_wasm.js ]; then
            bash packages/wgpu-wasm/build.sh
          fi
      - name: Install probe dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build shared producer plugin dependencies
        run: |
          pnpm --filter @forgeax/engine-vite-plugin-pack... build
          pnpm --filter @forgeax/engine-vite-plugin-shader... build
          pnpm --filter @forgeax/engine-audio-webaudio... build
          pnpm --filter @forgeax/engine-gltf... build
      - name: Run measured shared-input probe
        run: node scripts/ci/probe-shared-input-evidence.mjs --root . --out shared-evidence.json
      - name: Encode bounded evidence output
        id: encode
        run: |
          set -euo pipefail
          raw_bytes=$(wc -c < shared-evidence.json | tr -d ' ')
          test "$raw_bytes" -le 500000 || { echo "::error::shared evidence exceeds 500KB ($raw_bytes bytes)"; exit 1; }
          echo "evidence_payload=$(base64 < shared-evidence.json | tr -d '\n')" >> "$GITHUB_OUTPUT"
  # Transfer ownership is explicit: the shared producer emits one catalog-only
  # projection, app shards carry only app-local payloads, and reports/DDC
  # snapshots use separate transfers.
  app-shard-0:
    name: app-shard-0
    outputs:
      app_dist_artifact_id: ${{ steps.upload-app-dist-0.outputs.artifact-id }}
      app_dist_artifact_name: ${{ steps.upload-app-dist-0.outputs.artifact-name }}
      app_report_artifact_id: ${{ steps.upload-app-report-0.outputs.artifact-id }}
      app_ddc_artifact_id: ${{ steps.upload-app-ddc-0.outputs.artifact-id }}
      provenance_payload: ${{ steps.write-app-shard-0-provenance.outputs.payload }}
    needs: [core-build, shared-app-inputs]
    permissions:
      actions: read
      contents: read
    # All app shards use the 8 vCPU/16 GiB pool so build-apps can take its
    # machine-adaptive seven-slot budget without a slow standard-runner tail.
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "heavy"]') }}
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          # Every app shard consumes forgeax-engine-assets. Keep checkout
          # credential propagation on the action so a newly pinned SHA does
          # not depend on a stale runner-side submodule cache.
          submodules: recursive
          token: ${{ secrets.GHA }}
      - id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> $GITHUB_OUTPUT
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify heavy runner capacity
        run: node scripts/ci/verify-runner-pool-capacity.mjs --pool heavy
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Optional shard DDC stays off the build path; cache-warm owns its facts and audit.
      - name: Hydrate immutable core artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.core-build.outputs.core_artifact_id }}"
          --path .
          --stagger-seconds 0
      - name: Hydrate declared shared app inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.shared-app-inputs.outputs.shared_artifact_id }}"
          --path shared-app-inputs-transfer
      - name: Unpack declared shared app inputs
        run: node scripts/ci/unpack-shared-app-inputs.mjs --root .
      - name: Verify core artifact inputs
        run: >-
          node scripts/ci/verify-build-artifact-input.mjs --consumer app-shard --root .
          --shared-input-manifest shared-app-inputs/manifest.json
          --input-fingerprint "${{ needs.shared-app-inputs.outputs.input_fingerprint }}"
      - name: Build shard apps
        run: node scripts/ci/build-app-shard.mjs --shard-count 3 --shard-index 0 --attempt ${{ github.run_attempt }} --output-dir shard-output --shared-input-manifest shared-app-inputs/manifest.json
      - name: Stage shard transfer artifact
        run: |
          rm -rf shard-transfer shard-report-transfer shard-ddc-transfer
          mkdir -p shard-transfer
          cp -a shard-output/artifacts/. shard-transfer/
          mkdir -p shard-report-transfer
          cp -a shard-output/report shard-report-transfer/report
          mkdir -p node_modules/.cache/forgeax-ddc
          touch node_modules/.cache/forgeax-ddc/.keep
          mkdir -p shard-ddc-transfer
          cp -a node_modules/.cache/forgeax-ddc shard-ddc-transfer/ddc
          rm -f shard-ddc-transfer/ddc/ddc-warm-status.json
          touch shard-ddc-transfer/ddc/ci-empty
      - name: Fingerprint app-dist-0 artifact family
        shell: node {0}
        run: |
          const { execFileSync } = require('node:child_process');
          const { writeFileSync } = require('node:fs');
          const fingerprints = {
            'app-dist-0': execFileSync(
              process.execPath,
              ['scripts/ci/evidence/fingerprint.mjs', '--root', '.', 'shard-transfer'],
              { encoding: 'utf8' },
            ).trim(),
          };
          writeFileSync('app-dist-0-fingerprints.json', `${JSON.stringify(fingerprints)}\n`);
      - name: Upload shard transfer artifact
        id: upload-app-dist-0
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: app-dist-0-a${{ github.run_attempt }}
          path: shard-transfer
          retention-days: 1
          if-no-files-found: error
      - name: Upload shard report artifact
        id: upload-app-report-0
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: app-shard-report-0-a${{ github.run_attempt }}
          path: shard-report-transfer
          retention-days: 1
          if-no-files-found: error
      - name: Upload shard DDC artifact
        id: upload-app-ddc-0
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: app-shard-ddc-0-a${{ github.run_attempt }}
          path: shard-ddc-transfer
          retention-days: 1
          if-no-files-found: error
      - name: Write app-shard-0 producer provenance record
        id: write-app-shard-0-provenance
        env:
          ARTIFACT_ID: ${{ steps.upload-app-dist-0.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.upload-app-dist-0.outputs.artifact-name }}
          UPLOAD_STARTED_AT: ${{ steps.upload-app-dist-0.outputs.upload-started-at }}
          UPLOAD_COMPLETED_AT: ${{ steps.upload-app-dist-0.outputs.upload-completed-at }}
          UPLOAD_ELAPSED_SECONDS: ${{ steps.upload-app-dist-0.outputs.upload-elapsed-seconds }}
          UPLOAD_TRANSFER_ATTEMPT: ${{ steps.upload-app-dist-0.outputs.upload-transfer-attempt }}
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const fingerprints = JSON.parse(fs.readFileSync('app-dist-0-fingerprints.json'));
          const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
          const record = {
            schemaVersion: 1,
            producer: 'app-shard-0',
            runId: process.env.GITHUB_RUN_ID,
            producerRunAttempt: attempt,
            artifacts: [{
              class: 'app-dist-0',
              artifactName: process.env.ARTIFACT_NAME,
              artifactId: process.env.ARTIFACT_ID,
              producerRunAttempt: attempt,
              inputFingerprint: fingerprints['app-dist-0'],
              upload: {
                startedAt: process.env.UPLOAD_STARTED_AT,
                completedAt: process.env.UPLOAD_COMPLETED_AT,
                elapsedSeconds: Number(process.env.UPLOAD_ELAPSED_SECONDS),
                transferAttempt: Number(process.env.UPLOAD_TRANSFER_ATTEMPT),
              },
            }],
          };
          fs.writeFileSync(
            `provenance-app-shard-0-a${attempt}.json`,
            `${JSON.stringify(record)}\n`,
          );
          const payload = Buffer.from(JSON.stringify(record)).toString('base64');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `payload=${payload}\n`);

