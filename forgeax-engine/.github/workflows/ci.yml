      # This root is outside apps/hello and apps/learn-render. Its compact
      # shader manifest is hydrated with the app-shard artifacts; keep only
      # the smoke assertion here and avoid a duplicate Vite build.
      - name: Shadertoy happy-blob smoke
        if: matrix.group == 1
        run: pnpm --filter @forgeax/engine-shadertoy-happy-blob smoke

      - name: Upload Dawn roster shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-device-loss-smoke-roster-${{ matrix.group }}
          path: artifacts/renderer-device-loss/smoke-roster/
          if-no-files-found: error
          retention-days: 7

  # Required compatibility context: the four matrix legs are the producers;
  # this job is the only full-fleet verdict and refuses incomplete evidence.
  smoke-fleet-required-context:
    name: smoke-fleet
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "standard"]') }}
    needs: [smoke-fleet]
    if: always()
    permissions:
      actions: read
      contents: read
    steps:
      - name: Report intentional post-merge skip
        if: needs.smoke-fleet.result == 'skipped'
        run: echo "smoke-fleet intentionally skipped by post-merge gate"

      - name: Checkout
        if: needs.smoke-fleet.result != 'skipped'
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}

      - name: Setup Node.js
        if: needs.smoke-fleet.result != 'skipped'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download Dawn roster shard evidence
        if: needs.smoke-fleet.result != 'skipped'
        uses: actions/download-artifact@v5
        with:
          pattern: renderer-device-loss-smoke-roster-*
          path: artifacts/renderer-device-loss/smoke-roster
          merge-multiple: true

      - name: Aggregate authoritative Dawn roster
        if: needs.smoke-fleet.result != 'skipped'
        # Preserve the same explicit BLOCKED evidence at the required
        # aggregate context; this flag does not turn blocked rows into pass.
        run: >-
          node scripts/ci/run-dawn-smoke-roster.mjs --aggregate
          --allow-blocked
          --reports artifacts/renderer-device-loss/smoke-roster
          --expected-product-sha "$EXPECTED_PRODUCT_SHA"
  # Bevy smokes are independent from the rest of the Dawn fleet. Keep them in
  # their own matrix so each runner can execute one ordered slice while the
  # matrix preserves the exact package-derived membership and build→smoke pair.
  bevy-smoke-fleet:
    name: bevy-smoke-fleet-${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2]
    # Bevy smokes use the same heavy lavapipe-capable Ubuntu pool as the
    # non-Bevy smokes.
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "heavy"]') }}
    needs: [build-artifacts, post-merge-gate]
    if: |
      always() &&
      needs.build-artifacts.result == 'success' &&
      ! (needs.post-merge-gate.result == 'success' && needs.post-merge-gate.outputs.skip_checks == 'true')
    permissions:
      actions: read
      contents: read
    # Bevy smoke consumers hydrate only the core and shared shader inputs before
    # Dawn/Mesa work starts. scripts/bevy-demo.mjs builds every Bevy app in its
    # build→smoke pair, so app-dist-0/1/2 would duplicate roughly 1 GiB of
    # transfer without changing the smoke inputs.
    timeout-minutes: 45
    env:
      CACHE_RUNNER_SCOPE: self-hosted-ubuntu-linux-x64
      SMOKE_MIN_FRAMES: 100
      SMOKE_DURATION_MS: 1667
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: recursive
          token: ${{ secrets.GHA }}

      - name: Prepare XDG runtime directory
        uses: ./.github/actions/prepare-xdg-runtime

      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> $GITHUB_OUTPUT
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify heavy runner capacity
        run: node scripts/ci/verify-runner-pool-capacity.mjs --pool heavy

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare Dawn device-limit normalization
        uses: ./.github/actions/prepare-dawn-device-limits
      - name: Hydrate immutable build artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.build-artifacts.outputs.artifact_ids_bevy_smoke_fleet }}" --path .

      - name: Hydrate immutable shared app inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.build-artifacts.outputs.shared_artifact_id }}"
          --path shared-app-inputs-transfer

      - name: Unpack immutable shared app inputs
        run: node scripts/ci/unpack-shared-app-inputs.mjs --root .

      - name: Materialize shared app shader manifests
        run: >-
          node scripts/ci/materialize-app-shader-manifests.mjs
          --root . --shared-input-manifest shared-app-inputs/manifest.json
      - name: Verify artifact inputs
        run: node scripts/ci/verify-build-artifact-input.mjs --consumer bevy-smoke-fleet --root .
      - name: Install Mesa Vulkan (lavapipe software path for dawn-node)
        uses: ./.github/actions/install-mesa-vulkan-drivers
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}
      - name: Bevy examples headless smokes (dawn-node)
        # Keep each matrix leg bounded by the runner's cgroup CPU/memory budget;
        # the adaptive worker pool shortens the long Bevy-0 tail without
        # hard-coding a runner-specific concurrency value.
        run: pnpm bevy:smokes -- --group ${{ matrix.group }} --groups 3 --concurrency auto

  # Compatibility aggregate for the repository ruleset's historical required
  # context. Matrix legs remain the real gates; this projects their aggregate
  # result under the unchanged `bevy-smoke-fleet` check name.
  bevy-smoke-fleet-required-context:
    name: bevy-smoke-fleet
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "standard"]') }}
    needs: [bevy-smoke-fleet]
    if: always()
    steps:
      - name: Report Bevy smoke matrix result
        env:
          MATRIX_RESULT: ${{ needs.bevy-smoke-fleet.result }}
        run: |
          case "$MATRIX_RESULT" in
            success|skipped) exit 0 ;;
            *)
              echo "bevy-smoke-fleet matrix result: $MATRIX_RESULT"
              exit 1
              ;;
          esac

  # feat-20260616-ci-time-cut-roi-batch M3 (D-4): vitest dawn project
  # extracted from primary-pnpm into a standalone job. dawn-node auto-
  # discovers the Vulkan loader so this job needs only mesa-vulkan-drivers
  # + dawn.node native binding — no chrome-beta install, no lavapipe ICD
  # env exports, no Playwright cache (vitest dawn project does not launch
  # a browser).
  vitest-dawn:
    name: vitest-dawn
    # dawn-node tests are a resource-intensive real-GPU gate; use the heavy
    # Ubuntu-capable pool shared by smoke.
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "heavy"]') }}
    needs: [core-build, shared-app-inputs, post-merge-gate]
    if: |
      always() &&
      needs.core-build.result == 'success' &&
      needs.shared-app-inputs.result == 'success' &&
      ! (needs.post-merge-gate.result == 'success' && needs.post-merge-gate.outputs.skip_checks == 'true')
    permissions:
      actions: read
      contents: read
    # The persistent Ubuntu runner can spend ~10m in setup-node before the
    # Dawn suite starts. The ordinary suite measured ~13m19s and the six
    # direct-light fresh processes ~4m56s on the overloaded reference run;
    # keep a 35m envelope for the full gate plus provisioning tail.
    timeout-minutes: 35
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: recursive
          token: ${{ secrets.GHA }}

      - name: Prepare XDG runtime directory
        uses: ./.github/actions/prepare-xdg-runtime

      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify heavy runner capacity
        run: node scripts/ci/verify-runner-pool-capacity.mjs --pool heavy

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare Dawn device-limit normalization
        uses: ./.github/actions/prepare-dawn-device-limits

      - name: Hydrate immutable core artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.core-build.outputs.core_artifact_id }}" --path .

      - name: Hydrate declared shared app inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.shared-app-inputs.outputs.shared_artifact_id }}"
          --path shared-app-inputs-transfer

      - name: Unpack declared shared app inputs
        run: node scripts/ci/unpack-shared-app-inputs.mjs --root .

      - name: Verify lifecycle shader manifest
        run: test -s shared-app-inputs/shaders/manifest.json

      # Verify required artifact classes are present before main logic
      # (feat-20260716-ci-build-artifact-cost-optimization M2).
      - name: Verify artifact inputs
        run: node scripts/ci/verify-build-artifact-input.mjs --consumer vitest-dawn --root .

      # Linux runtime deps: mesa-vulkan-drivers (lavapipe ICD for dawn-node's
      # Vulkan backend). dawn.node native binding (vitest.setup-webgpu.ts
      # injects it into globalThis.navigator.gpu) auto-discovers via
      # standard Vulkan loader paths.
      - name: Install Mesa Vulkan (lavapipe software path for dawn-node)
        uses: ./.github/actions/install-mesa-vulkan-drivers
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}

      # AC-06 (K-4 + K-6 PR Linux only): real GPU command recording +
      # queue.submit path. Linux must not skip (charter proposition 4 explicit
      # failure floor). K-10 stance: failure = job failure, manual override not
      # allowed. Invokes vitest directly:
      # `pnpm test:dawn` would re-run `pnpm -r build`, but the
      # build-artifacts download above already produced dist/ for every
      # package.
      # M7 HDRP clustered spot-shadow coverage: the direct-light file owns
      # several high-density native Dawn captures. Keep it out of the ordinary
      # project invocation; the partition runner below starts a fresh process
      # for each coherent direct-light group so native Dawn/Vulkan state cannot
      # accumulate across the complete ten-test roster.
      - name: Vitest dawn project (real GPU — *.dawn.test.ts)
        env:
          # Keep the ordinary roster representative on overloaded lavapipe
          # hosts. The full 300-frame windows remain the local/nightly default;
          # this CI profile preserves each assertion while bounding repeated
          # frame submission in the highest-cost Dawn files.
          FORGEAX_DAWN_LIGHTWEIGHT: '1'
        run: pnpm exec vitest run --project=dawn --exclude apps/parity/color-lighting/cases/direct-light/__tests__/direct-light.dawn.test.ts

      # The validated low/medium-density Dawn roster shares one module graph.
      # It still executes against the real Dawn adapter, but no longer pays a
      # fresh Vite/Engine import for every small renderer or contract file.
      - name: Shared Dawn module-graph lane
        env:
          FORGEAX_DAWN_COMPACT: '1'
          FORGEAX_DAWN_LIGHTWEIGHT: '1'
        run: node scripts/ci/run-compact-vitest-dawn.mjs

      # These two renderer integrations pass in one fresh Dawn process but can
      # exceed the per-test budget after the full shared Vulkan roster. Keep
      # that command explicit; vitest.config.ts excludes them from the bulk
      # invocation.
      - name: Isolated Dawn renderer integrations (fresh process)
        env:
          FORGEAX_DAWN_ISOLATED: '1'
          FORGEAX_DAWN_LIGHTWEIGHT: '1'
        run: >-
          pnpm exec vitest run --project=dawn --maxWorkers=1
          packages/runtime/src/__tests__/point-light-shadow.dawn.test.ts
          packages/runtime/src/__tests__/dawn/instances-uniform-fallback.dawn.test.ts

      # The lifecycle carrier owns the one long post-report device-release
      # boundary that must stay fresh. The remaining parity carriers have been
      # proven safe in one bounded no-isolate process on the heavy runner; keep
      # their explicit lightweight case/frame profile while removing ten
      # repeated Vite/native startups.
      - name: Isolated Dawn lifecycle carrier (fresh process)
        env:
          FORGEAX_DAWN_ISOLATED: '1'
          FORGEAX_DAWN_LIGHTWEIGHT: '1'
        run: >-
          pnpm exec vitest run --project=dawn --maxWorkers=1
          packages/render/bench/gpu-pass-timing/__tests__/gpu-pass-timing-lifecycle.dawn.test.ts

      - name: Shared Dawn heavy carriers (bounded module graph)
        env:
          FORGEAX_DAWN_ISOLATED: '1'
          FORGEAX_DAWN_LIGHTWEIGHT: '1'
        run: >-
          pnpm exec vitest run --project=dawn --no-isolate --maxWorkers=1
          --no-file-parallelism
          apps/hello/volumetric-fog/src/__tests__/mvd.dawn.test.ts
          apps/parity/color-lighting/cases/extended-lighting/__tests__/recovery.dawn.test.ts
          packages/render/src/transmission/__tests__/standard-transmission.dawn.test.ts
          packages/runtime/src/__tests__/dawn/material-alpha.dawn.test.ts
          apps/parity/color-lighting/cases/tone/__tests__/tone-ramp.dawn.test.ts
          apps/parity/color-lighting/cases/extended-lighting/__tests__/rect-area.dawn.test.ts
          apps/parity/color-lighting/cases/extended-lighting/__tests__/spot-modifiers.dawn.test.ts
          apps/parity/color-lighting/cases/extended-lighting/__tests__/probe.dawn.test.ts
          packages/runtime/src/__tests__/fullscreen-post-process-pass.dawn.test.ts
          packages/runtime/src/__tests__/shadow-csm-runtime-vary.dawn.test.ts

      # shadow-fields-observable owns 16 dense UBO/pixel assertions and was the
      # highest-cost file in the ordinary roster (~115s). Run it after the bulk
      # project in its own Dawn process and use the bounded CI render window;
      # local/nightly invocations retain the full 300-frame evidence window.
      - name: Isolated Dawn shadow-field observability (fresh process)
        env:
          FORGEAX_DAWN_ISOLATED: '1'
          FORGEAX_DAWN_LIGHTWEIGHT: '1'
        run: >-
          pnpm exec vitest run --project=dawn --maxWorkers=1
          packages/runtime/src/__tests__/shadow-fields-observable.dawn.test.ts

      - name: Direct-light Dawn partitions (real GPU — complete roster)
        env:
          FORGEAX_DAWN_LIGHTWEIGHT: '1'
        run: node scripts/ci/run-direct-light-dawn.mjs

  # Keep the protected `webkit-fallback` context as a compatibility key while
  # the remote ruleset is migrated. The implementation is the stable Chromium
  # WebGL2 fallback: it disables WebGPU, proves a real WebGL2 context, and
  # runs the same R5/parity assertions without installing or launching the
  # WebKit binary. This keeps the required-check contract unchanged while
  # removing the flaky WebKit process from CI.
  webkit-fallback:
    name: webkit-fallback
    outputs:
      webkit_status_artifact_id: ${{ steps.upload-webkit-status.outputs.artifact-id }}
      webkit_status_artifact_name: ${{ steps.upload-webkit-status.outputs.artifact-name }}
    # The pinned Chrome Beta fallback carrier requires apt-installed system
    # libraries; keep this browser gate on the heavy Ubuntu-capable pool.
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "heavy"]') }}
    needs: [core-build, shared-app-inputs, post-merge-gate]
    if: |
      always() &&
      needs.core-build.result == 'success' &&
      needs.shared-app-inputs.result == 'success' &&
      ! (needs.post-merge-gate.result == 'success' && needs.post-merge-gate.outputs.skip_checks == 'true')
    permissions:
      actions: read
      contents: read
    timeout-minutes: 15
    env:
      # Keep the browser cache ABI boundary explicit for this workload.
      CACHE_RUNNER_SCOPE: self-hosted-ubuntu-linux-x64
      # Reuse the immutable shader projection produced by shared-app-inputs so
      # every Vite server spends its CPU on the real browser assertions instead
      # of recooking the entire built-in shader fleet during cold start.
      FORGEAX_SHARED_APP_INPUTS_MANIFEST: ${{ github.workspace }}/shared-app-inputs/manifest.json
    steps:
      # Persistent self-hosted runners can retain an Authorization header outside
      # checkout's local config. Remove it before checkout adds its own header.
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: recursive
          token: ${{ secrets.GHA }}

      - name: Prepare XDG runtime directory
        uses: ./.github/actions/prepare-xdg-runtime

      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify heavy runner capacity
        run: node scripts/ci/verify-runner-pool-capacity.mjs --pool heavy

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Cross-job artifact pipeline (feat-20260716-ci-build-artifact-cost-optimization
      # M2): consume per-contract-class artifacts from build-artifacts.
      - name: Hydrate immutable core artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.core-build.outputs.core_artifact_id }}" --path .

      - name: Hydrate immutable shared app inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.shared-app-inputs.outputs.shared_artifact_id }}"
          --path shared-app-inputs-transfer

      - name: Unpack immutable shared app inputs
        run: node scripts/ci/unpack-shared-app-inputs.mjs --root .

      # Verify required artifact classes are present before main logic
      # (feat-20260716-ci-build-artifact-cost-optimization M2).
      - name: Verify artifact inputs
        run: >-
          node scripts/ci/verify-build-artifact-input.mjs
          --consumer webkit-fallback --root .
          --shared-input-manifest shared-app-inputs/manifest.json
          --shared-input-mode catalog-only
          --input-fingerprint "${{ needs.shared-app-inputs.outputs.input_fingerprint }}"

      # The fallback owns Channel 3 evidence only: the R5 survival cases and
      # six-case parity sentinel force rhi-wgpu WebGL2. Use the same pinned
      # Chrome Beta carrier for admission and every real gate below; the probe
      # remains fail-closed on both WebGPU absence and WebGL2 availability.
      - name: Install Playwright Chrome Beta (for Chromium WebGL2 fallback)
        uses: ./.github/actions/install-playwright-chrome-beta
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}
      - name: Probe Chrome Beta WebGL2 fallback capability
        env:
          FORGEAX_CHROME_CHANNEL: chrome-beta
        run: node scripts/ci/probe-playwright-chromium-webgl2.mjs
      - name: Start hello-triangle dev server (owned background)
        run: |
          GITHUB_ENV="$GITHUB_ENV" node scripts/ci/owned-dev-server.mjs start \
            --state-file report/ci-lifecycle/hello-triangle.json \
            --log-file report/ci-lifecycle/hello-triangle.log \
            --requested-port 5181 \
            --env-name DEV_SERVER_URL \
            --cwd apps/learn-render/1.getting-started/2.hello-triangle \
            -- \
            pnpm exec vite --host 127.0.0.1 --port __PORT__ --strictPort
      - name: Start color-lighting parity dev server (owned background)
        run: |
          GITHUB_ENV="$GITHUB_ENV" node scripts/ci/owned-dev-server.mjs start \
            --state-file report/ci-lifecycle/color-lighting-parity.json \
            --log-file report/ci-lifecycle/color-lighting-parity.log \
            --requested-port 5182 \
            --env-name PARITY_SERVER_URL \
            --cwd . \
            -- \
            pnpm --filter @forgeax/parity-color-lighting exec vite \
              --host 0.0.0.0 --port __PORT__ --strictPort
      - name: Start hello-taa dev server (owned background)
        run: |
          GITHUB_ENV="$GITHUB_ENV" node scripts/ci/owned-dev-server.mjs start \
            --state-file report/ci-lifecycle/hello-taa.json \
            --log-file report/ci-lifecycle/hello-taa.log \
            --requested-port 5183 \
            --env-name TAA_SERVER_URL \
            --cwd . \
            -- \
            pnpm --filter @forgeax/hello-taa exec vite \
              --host 127.0.0.1 --port __PORT__ --strictPort

      - name: Start hello-fxaa dev server (owned background)
        run: |
          GITHUB_ENV="$GITHUB_ENV" node scripts/ci/owned-dev-server.mjs start \
            --state-file report/ci-lifecycle/hello-fxaa.json \
            --log-file report/ci-lifecycle/hello-fxaa.log \
            --requested-port 5183 \
            --env-name DARK_GRADIENT_SERVER_URL \
            --timeout-ms 180000 \
            --cwd apps/hello/fxaa \
            -- \
            pnpm exec vite --host 127.0.0.1 --port __PORT__ --strictPort

      # Hello FXAA dark-gradient Chromium WebGL2 fallback route: this uses the
      # CI-owned Vite endpoint and records compositor final-display RGBA without
      # claiming a raw WebGPU surface endpoint. The backend identity is emitted
      # by the renderer and must match the explicit Chromium fallback channel.
      - name: Hello FXAA dark-gradient Chromium WebGL2 smoke (direct)
        env:
          FORGEAX_BROWSER_ENGINE: chromium-webgl2
          FORGEAX_BROWSER_CHANNEL: chrome-beta
          # Chromium's software WebGL GPU process can tear down during a
          # compositor/readback cycle in headless mode. Keep this fallback on
          # the same Xvfb + headed contract already used by the positive
          # Chrome Beta browser lanes; the WebGL2 capability probe above stays
          # headless and remains an independent admission check.
          FORGEAX_BROWSER_HEADLESS: '0'
          FORGEAX_BROWSER_HARD_DEADLINE_MS: '180000'
          FORGEAX_DARK_GRADIENT_OBSERVATION_TIMEOUT_MS: '90000'
          FORGEAX_DARK_GRADIENT_LANE: direct
        run: xvfb-run -a env FORGEAX_BROWSER_HEADLESS=0 FORGEAX_DARK_GRADIENT_URL="$DARK_GRADIENT_SERVER_URL" pnpm --filter @forgeax/hello-fxaa smoke:browser
      - name: Hello FXAA mipmap pipeline Chromium WebGL2 smoke
        env:
          FORGEAX_BROWSER_ENGINE: chromium-webgl2
          FORGEAX_BROWSER_CHANNEL: chrome-beta
          FORGEAX_BROWSER_HEADLESS: '0'
        run: xvfb-run -a env FORGEAX_BROWSER_HEADLESS=0 FORGEAX_MIPMAP_URL="$DARK_GRADIENT_SERVER_URL" pnpm --filter @forgeax/hello-fxaa smoke:mipmap
      - name: Hello FXAA dark-gradient Chromium WebGL2 smoke (clustered)
        env:
          FORGEAX_BROWSER_ENGINE: chromium-webgl2
          FORGEAX_BROWSER_CHANNEL: chrome-beta
          FORGEAX_BROWSER_HEADLESS: '0'
          FORGEAX_BROWSER_HARD_DEADLINE_MS: '180000'
          FORGEAX_DARK_GRADIENT_OBSERVATION_TIMEOUT_MS: '90000'
          FORGEAX_DARK_GRADIENT_LANE: clustered
        run: xvfb-run -a env FORGEAX_BROWSER_HEADLESS=0 FORGEAX_DARK_GRADIENT_URL="$DARK_GRADIENT_SERVER_URL" pnpm --filter @forgeax/hello-fxaa smoke:browser
      # bug-20260622 R5 WS1+WS2 shared e2e probe — verify over-capacity
      # graceful degradation (non-black frame) + bad-submit survival (no
      # panic, onError RhiError received, next frame renders). Reuses the
      # owned hello-triangle dev server (forgeaxShader manifest + monorepo-root
      # fs.allow) with channel proof, panic detection, and screenshot gates.
      # TIMEOUT_MS is a per-mode wall-clock budget, not a fixed sleep: the
      # deadline loop breaks the instant READY_FOR_SCREENSHOT is logged, so a
      # wide budget is free on the happy path. It exists only to bound a hang.
      # Each mode launches a fresh Chromium process. 120s clears the cold-start
      # with margin without weakening any gate assertion (no panic / non-black /
      # onError / instance-survives all still required).
      - name: Chromium fallback R5 stability verify (over-capacity + bad-submit)
        env:
          TIMEOUT_MS: '120000'
          FORGEAX_CHROME_CHANNEL: chrome-beta
          FORGEAX_BROWSER_HEADLESS: '0'
          SCREENSHOT_A: /tmp/r5-over-capacity-chromium.png
          SCREENSHOT_B: /tmp/r5-bad-submit-chromium.png
        run: xvfb-run -a env FORGEAX_BROWSER_HEADLESS=0 FORGEAX_FALLBACK_BROWSER=chromium DEV_SERVER_URL="$DEV_SERVER_URL" node scripts/dev-verify/verify-webkit-r5-stability.mjs
      - name: Chromium fallback color-lighting parity sentinel matrix (Xvfb headed)
        if: always()
        env:
          TIMEOUT_MS: '120000'
          FORGEAX_CHROME_CHANNEL: chrome-beta
          FORGEAX_BROWSER_HEADLESS: '0'
          PARITY_STATUS_OUTPUT: report/color-lighting-parity/chromium-status.json
        # Headless software Chromium can tear down its GPU process during
        # ReadPixels and invalidate the fallback context. Xvfb + headed keeps
        # the same real WebGL2 channel while preserving the fail-closed
        # lifecycle and pixel checks.
        run: xvfb-run -a env FORGEAX_BROWSER_HEADLESS=0 FORGEAX_FALLBACK_BROWSER=chromium URL="$PARITY_SERVER_URL" node scripts/dev-verify/verify-webkit-color-lighting.mjs
      - name: Upload Chromium fallback color-lighting status
        id: upload-webkit-status
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: chromium-fallback-color-lighting-status
          path: report/color-lighting-parity/chromium-status.json
          if-no-files-found: warn
          retention-days: 1
      - name: Upload Chromium fallback diagnostics
        if: failure()
        uses: ./.github/actions/upload-optional-artifact
        timeout-minutes: 2
        with:
          name: chromium-fallback-diagnostics
          path: |
            /tmp/r5-over-capacity-chromium.png
            /tmp/r5-bad-submit-chromium.png
          retention-days: 1
      - name: Stop dev server
        if: always()
        run: |
          set +e
          node scripts/ci/owned-dev-server.mjs stop \
            --state-file report/ci-lifecycle/hello-triangle.json \
            --allow-missing=true
          hello_cleanup_status=$?
          node scripts/ci/owned-dev-server.mjs stop \
            --state-file report/ci-lifecycle/color-lighting-parity.json \
            --allow-missing=true
          parity_cleanup_status=$?
          node scripts/ci/owned-dev-server.mjs stop \
            --state-file report/ci-lifecycle/hello-taa.json \
            --allow-missing=true
          taa_cleanup_status=$?
          node scripts/ci/owned-dev-server.mjs stop \
            --state-file report/ci-lifecycle/hello-fxaa.json \
            --allow-missing=true
          fxaa_cleanup_status=$?
          set -e
          if [ "$hello_cleanup_status" -ne 0 ] || [ "$parity_cleanup_status" -ne 0 ] || [ "$taa_cleanup_status" -ne 0 ] || [ "$fxaa_cleanup_status" -ne 0 ]; then
            exit 1
          fi
      - name: Upload Chromium fallback lifecycle evidence
        # This directory is not consumed by another job. Keep it only when a
        # fallback step or cleanup failed, so the normal path has no duplicate
        # lifecycle artifact.
        if: failure()
        uses: ./.github/actions/upload-optional-artifact
        timeout-minutes: 2
        with:
          name: chromium-fallback-server-lifecycle
          path: report/ci-lifecycle
          if-no-files-found: warn
          retention-days: 1

  portability-bun:
    name: portability-bun
    # Bun canary runs normal Math + ECS unit tests only; the named ecs-perf
    # project is owned by coverage-pnpm and remains uninstrumented there.
    # The fx test entry shares Vitest's large dependency graph with the browser
    # gate, so target the heavy runner pool.
    needs: [build-artifacts, post-merge-gate]
    if: |
      always() &&
      needs.build-artifacts.result == 'success' &&
      ! (needs.post-merge-gate.result == 'success' && needs.post-merge-gate.outputs.skip_checks == 'true')
    permissions:
      actions: read
      contents: read
    # The fx Vitest graph is large even with one Bun test entry; keep it on the
    # heavy runner pool and reserve a bounded heap.
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "heavy"]') }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    # The immutable build-artifact input can contain several app/core
    # archives; leave transfer, Bun test, and cleanup room on the heavy runner.
    timeout-minutes: 45
    steps:
      # Scrub a leftover GLOBAL/SYSTEM http.extraheader Authorization before
      # checkout — see build-artifacts' identical step for the full rationale
      # (issue #709: stale --global/--system auth header on the persistent
      # self-hosted runners → duplicate Authorization → GitHub 400).
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: false
          token: ${{ secrets.GHA }}

      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify heavy runner capacity
        run: node scripts/ci/verify-runner-pool-capacity.mjs --pool heavy

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # `--ignore-scripts` works around simple-git-hooks postinstall failing on a
      # fresh bun cache (bun 1.3.x order-of-operations issue). Hooks installation
      # is a developer-machine concern and should never run in CI anyway. esbuild's
      # native binary does NOT need its postinstall on bun's prebuilt path.
      - name: Install (frozen)
        run: bun install --frozen-lockfile --ignore-scripts

      # AC-01: assert `bun install --frozen-lockfile` produces zero diff on
      # bun.lock. The single-root lockfile model (research R-1 / R-6) means
      # the committed bun.lock is the SSOT; any post-install difference signals
      # that a dependabot sync or manual edit did not regenerate the lockfile.
      - name: bun.lock zero diff
        run: git diff --exit-code bun.lock

      # Cross-job artifact pipeline (feat-20260716-ci-build-artifact-cost-optimization
      # M2): consume per-contract-class artifacts from build-artifacts.
      - name: Hydrate immutable build artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.build-artifacts.outputs.artifact_ids_portability_bun }}" --path .

      # Verify required artifact classes are present before main logic
      # (feat-20260716-ci-build-artifact-cost-optimization M2).
      - name: Verify artifact inputs
        run: node scripts/ci/verify-build-artifact-input.mjs --consumer portability-bun --root .

      # feat-20260523-extend-bun-channel-for-studio-submodule-consumptio M2 / w3
      # Bun remains the package-script runner, while the repository package
      # graph owns dependency ordering and cgroup-derived concurrency. Bun's
      # `--sequential` only serializes workspace enumeration; it is not a
      # dependency topology and can run devkit before engine-project exists.
      - name: Bun topological package build
        env:
          FORGEAX_PACKAGE_BUILD_RUNNER: bun
          FORGEAX_BUILD_NO_TASK_CACHE: '1'
        run: node scripts/build-packages.mjs

      # feat-20260523-extend-bun-channel-for-studio-submodule-consumptio M2 / w4
      # Bun dist artefact probe: assert 5 key package dist/index.mjs files exist
      # after the bun workspace build. Inline shell (D-6: no separate script);
      # test -f only (D-2: no mtime/stale detection — bun channel explicitly does
      # NOT capture cross-package type regressions; pnpm channel sync:check covers
      # that). Missing artifact echoes `missing: <pkg>` and exits 1 for single-line
      # grep-able failure signal (charter P3 explicit failure).
      - name: Bun dist artefact probe
        run: |
          for pkg in runtime types ecs vite-plugin-shader vite-plugin-pack; do
            test -f "packages/$pkg/dist/index.mjs" || (echo "missing: $pkg" && exit 1)
          done

      # feat-20260523-extend-bun-channel-for-studio-submodule-consumptio M2 / w5
      # Bun dev server probe: start `bun run --cwd apps/hello/room dev` in
      # background, poll for up to 90s for Vite to bind, curl localhost:5173 HEAD.
      # The deadline is bounded while the terminal line retains elapsed time and
      # the last probe status for slow-runner diagnosis.
      - name: Bun dev server probe
        run: |
          bun run --cwd apps/hello/room dev &
          PID=$!
          rc=1
          timeout_seconds=90
          started_at=$(date +%s)
          deadline=$((started_at + timeout_seconds))
          attempts=0
          last_probe="not-run"
          while [ "$(date +%s)" -lt "$deadline" ]; do
            attempts=$((attempts + 1))
            if probe_status=$(curl --fail --max-time 1 -o /dev/null -sS -w '%{http_code}' http://localhost:5173/ 2>/dev/null); then
              probe_rc=0
            else
              probe_rc=$?
            fi
            last_probe="rc=${probe_rc},http=${probe_status:-none}"
            if [ "$probe_rc" -eq 0 ]; then
              rc=0
              last_probe="ready:http=${probe_status}"
              break
            fi
            sleep 1
          done
          elapsed_seconds=$(( $(date +%s) - started_at ))
          echo "dev server probe: rc=$rc elapsed=${elapsed_seconds}s attempts=$attempts last_probe=$last_probe"
          if [ "$rc" -ne 0 ]; then
            echo "dev server probe failed @ 5173 (elapsed=${elapsed_seconds}s last_probe=$last_probe)"
          fi
          kill "$PID" 2>/dev/null || true
          exit $rc

      # tweak-20260521-bun-portability-script-gates-expansion w3 / D-1 + D-5:
      # 16 additional gates folded into the portability-bun channel so AC-01
      # alignment covers all 22 base gates. Order: 4 non-grep then 12 grep:*
      # (plan-strategy 8 naming-convention, AI-user diff readability). Each
      # step is independently enumerable (AC-02). None of the entries are in
      # FORBIDDEN_IN_PORTABILITY (AC-05). The `ci:paths-check` mirror lives
      # in jobs.primary-pnpm (w4). Scripts execute via `bun run <name>`; for
      # node-script entries this is byte-equivalent to `pnpm <name>` since
      # the underlying command is `node <path>` (research §F-1 / §F-5).
      - name: lint:internal
        run: bun run lint:internal

      - name: check-engine-no-console-dep
        run: bun run check-engine-no-console-dep

      - name: check-console-not-in-engine-bundle
        run: bun run check-console-not-in-engine-bundle

      - name: ci:paths-check
        run: bun run ci:paths-check

      - name: grep:single-exit
        run: bun run grep:single-exit

      - name: grep:asset-registry-instanced-removed
        run: bun run grep:asset-registry-instanced-removed

      - name: grep:no-entity-array-literal
        run: bun run grep:no-entity-array-literal

      - name: grep:readme-array-vocab-mentioned
        run: bun run grep:readme-array-vocab-mentioned

      - name: grep:readme-string-vocab-mentioned
        run: bun run grep:readme-string-vocab-mentioned

      - name: grep:no-managed-array-view-import
        run: bun run grep:no-managed-array-view-import

      - name: grep:no-array-stride-option
        run: bun run grep:no-array-stride-option

      - name: grep:no-buffer-colon-keyword
        run: bun run grep:no-buffer-colon-keyword

      - name: grep:no-managed-array-error-code
        run: bun run grep:no-managed-array-error-code

      - name: grep:no-result-reproject-cast
        run: bun run grep:no-result-reproject-cast

      - name: grep:no-string-view-import
        run: bun run grep:no-string-view-import

      - name: grep:no-set-managed-ref-store
        run: bun run grep:no-set-managed-ref-store

      - name: grep:no-binary-assets
        run: bun run grep:no-binary-assets

      - name: Dependabot doc-anchor grep gate
        # bug-20260514 M4 / T-014: assert AGENTS.md > Conventions > Dual
        # lockfile keeps the FORGEAX_BUN_LOCK_OUT_OF_SYNC marker / workflow
        # filename anchors and the workflow header keeps the AGENTS.md
        # backlink. Fail-fast in portability-bun stops the merge when the
        # progressive-disclosure triangle drifts.
        run: bun run dependabot:check-doc-anchor

      - name: Workspaces equivalence guard
        run: bun run sync:check

      - name: Biome ci
        run: bunx biome ci .

      - name: English-only check
        run: |
          python3 scripts/forgeax/check_english_only.py --code packages/*/src apps/*/src scripts tests
          python3 scripts/forgeax/check_english_only.py AGENTS.md
          # Mirrors primary-pnpm job (bug-20260513-english-only-config-yml-scope) so
          # the portability-bun channel cannot regress while primary-pnpm catches drift.
          python3 scripts/forgeax/check_english_only.py --extensions .yml --extensions .yaml .github
          python3 scripts/forgeax/check_english_only.py --extensions .ts \
            $(find packages apps -maxdepth 3 \
                \( -name "vitest.config.ts" -o -name "tsup.config.ts" \) \
                -not -path "*/node_modules/*" -not -path "*/dist/*") \
            vitest.config.ts vitest.setup-webgpu.ts tsup.base.ts

      - name: R12 Lint (descriptor mirror)
        run: bun run r12-lint

      # Portability canary: run a representative subset (math + ecs) to verify
      # bun can resolve workspace deps and drive vitest. The full suite is
      # covered by primary-pnpm; duplicating it here adds ~100s runner-minutes
      # with no extra signal beyond import-resolution parity.
      # Do NOT replace with `bun test` — Bun's built-in runner ignores vitest.config.ts.
      - name: Vitest portability canary (via bun run test:portability)
        run: bun run test:portability

      # fx dev CLI (bun scripts/fx.ts) unit contract. The root `scripts` vitest
      # project is not in the test:unit filter set, so fx.test.ts is gated here
      # (path-scoped `test:fx`) under the bun channel that owns the fx runtime.
      - name: fx dev CLI unit tests
        run: bun run test:fx

      # fx dev CLI non-destructive check: exercise routing + the update/clean
      # planners under bun without mutating the tree (--dry-run prints the plan
      # only). Keep the run body free of FORBIDDEN_IN_PORTABILITY literals.
      - name: fx dev CLI dry-run
        run: |
          bun run fx help
          bun run fx update --dry-run
          bun run fx clean --dry-run

  # L2 split-job anchor feat-20260510-ci-merge-gate-hardening K-1 + K-2.
  # Browser/color evidence is an independent producer; the stable
  # metrics-validate join below owns the final report/check name.
  metrics-validate-browser:
    name: metrics-validate-browser
    outputs:
      metrics_evidence_artifact_id: ${{ steps.upload-metrics-browser-evidence.outputs.artifact-id }}
      metrics_evidence_artifact_name: ${{ steps.upload-metrics-browser-evidence.outputs.artifact-name }}
    # feat-20260512-threejs-pixel-parity-bench M3 T-016 + D-P1: pixel parity
    # bench requires WebGPU on the runner (right fixture uses
    # @forgeax/engine-rhi-webgpu via chromium + lavapipe/Vulkan swiftshader).
    # Chromium and its Playwright system dependencies use Ubuntu packages;
    # keep this WebGPU/pixel-parity gate on the heavy Ubuntu-capable pool.
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "heavy"]') }}
    needs: [core-build, post-merge-gate, webkit-fallback, smoke-fleet]
    if: |
      always() &&
      needs.core-build.result == 'success' &&
      needs.smoke-fleet.result == 'success' &&
      ! (needs.post-merge-gate.result == 'success' && needs.post-merge-gate.outputs.skip_checks == 'true')
    permissions:
      actions: read
      contents: read
    # The fail-closed color-lighting matrix includes independent Browser WebGPU,
    # Dawn, and vertex-color producers; on the heavy pool it can legitimately
    # exceed the old 15-minute wall clock even when every case is progressing.
    # Keep the full matrix intact and give the producer enough time to finish.
    # The 45-minute job budget leaves room for dependency/bootstrap overhead
    # before the matrix while still bounding a genuinely stuck producer.
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=10240
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: recursive
          token: ${{ secrets.GHA }}

      - name: Prepare XDG runtime directory
        uses: ./.github/actions/prepare-xdg-runtime

      # Read pnpm version from .pnpm-version SSOT file — same alpha path as primary-pnpm job.
      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify heavy runner capacity
        run: node scripts/ci/verify-runner-pool-capacity.mjs --pool heavy

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      - name: Prepare Dawn device-limit normalization
        uses: ./.github/actions/prepare-dawn-device-limits
      # Cross-job artifact pipeline (feat-20260716-ci-build-artifact-cost-optimization
      # M2): consume per-contract-class artifacts from build-artifacts.
      - name: Hydrate immutable build artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.core-build.outputs.core_artifact_id }}" --path .

      # Verify required artifact classes are present before main logic
      # (feat-20260716-ci-build-artifact-cost-optimization M2).
      - name: Verify artifact inputs
        run: node scripts/ci/verify-build-artifact-input.mjs --consumer metrics-validate-browser --root .

      # The compatibility-keyed fallback job owns the real Channel-3 parity
      # capture. Keep the dependency fail-closed: a missing/failed download
      # leaves the status absent or not-executed, so the parity bench blocks
      # instead of projecting the hello-triangle channel proof onto parity cases.
      - name: Hydrate Chromium fallback color-lighting status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p report/color-lighting-parity
          artifact_id='${{ needs.webkit-fallback.outputs.webkit_status_artifact_id }}'
          if [ -z "$artifact_id" ]; then
            echo "[chromium-fallback] status artifact ID is missing; parity bench will remain fail-closed"
            exit 0
          fi
          node scripts/ci/download-artifact-with-retry.mjs \
            --artifact-ids "$artifact_id" --path report/color-lighting-parity
          if [ ! -f report/color-lighting-parity/chromium-status.json ]; then
            echo "[chromium-fallback] downloaded artifact did not contain chromium-status.json"
          fi

      # Linux runtime deps: mesa-vulkan-drivers (lavapipe ICD for dawn-node's
      # Vulkan backend). Required because metrics:run dispatches gate commands
      # like `pnpm --filter @forgeax/hello-cube smoke` which rely on dawn-node + lavapipe
      # (same path as primary-pnpm job's smoke step). Without this, hello-cube smoke
      # fails with `vkCreateInstance: Found no drivers!` and gate.command exit 1.
      - name: Install Mesa Vulkan (lavapipe software path for dawn-node gate commands)
        uses: ./.github/actions/install-mesa-vulkan-drivers
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}

      # Playwright browser cache (feat-20260512 M4 / AC-07 / D-P2): cache the
      # `~/.cache/ms-playwright` directory so the chromium download (~120 MB) +
      # apt-get system deps install run only on cache miss. Key tracks the
      # playwright pin from apps/hello/triangle/package.json — bumping the
      # version invalidates the cache automatically (research §F-2 official
      # "hash of the Playwright version" guidance).
      #
      # feat-20260616: D-P4 still holds — chrome-beta channel uses a
      # PHYSICALLY ISOLATED cache path (`~/.cache/chrome-beta` +
      # `/opt/google/chrome-beta/`, owned by the
      # `.github/actions/install-playwright-chrome-beta/` composite action's
      # own deb cache); it does not touch `~/.cache/ms-playwright`. This
      # cache key is now used in TWO places with string-identical key
      # (AC-06 SSOT parity): metrics-validate (here, serving pixel-parity
      # + fps chromium binary) and primary-pnpm (:1667, serving Chrome Beta
      # for the browser verify gates). chrome-beta
      # remains outside both caches, so the keys cannot collide across
      # channels.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.CACHE_RUNNER_SCOPE }}-${{ hashFiles('apps/hello/triangle/package.json') }}

      # Round 2 experimented with awalsh128/cache-apt-pkgs-action@v1 to cache
      # the 9 font packages (fonts-ipafont-gothic / fonts-freefont-ttf /
      # fonts-tlwg-loma-otf / fonts-unifont / fonts-wqy-zenhei / xfonts-*)
      # which add 5m14s to Step B via 21.1 MB of downloads at 74 kB/s on the
      # Azure mirror. The action restored .deb files but did NOT update dpkg
      # state (README §Caveats/Non-file Dependencies — "restoring files only,
      # use apt-get install for dpkg state"), so `playwright install-deps`
      # still re-downloaded and re-installed all 9 packages on cache hit.
      # Round 3 decision: drop the cache layer and raise timeout-minutes
      # 10→15 instead (AC-07 budget relaxation). Step B runs ~2m18s when the
      # Ubuntu mirror is not throttled (observed 2026-05-12), fitting inside
      # 15 min comfortably with Mesa Vulkan + preceding steps ~4-5min.

      # Playwright install split into two steps (bug-20260512, issue #80:
      # https://github.com/ForgeaXGame/forgeax-engine/issues/80).
      # Previously a single `playwright install --with-deps chromium` step gated
      # by `if: cache-hit != 'true'` skipped the entire install (browser binary
      # AND apt system deps) on cache hit — but the Playwright browser cache
      # (actions/cache@v5 on ~/.cache/ms-playwright, research F-2) only covers
      # the browser binary; apt deps install to /usr/lib/x86_64-linux-gnu/ and
      # are NOT in the cache path. Result: cache-hit runs had no libnss3 /
      # libnspr4 / libatk-bridge, and chromium-launch stage failed in the
      # downstream pixel-parity bench.
      #
      # Fix: split along the Playwright CLI's two orthogonal subcommands
      # (research F-1). Step A installs the browser binary only on cache miss;
      # Step B runs `playwright install-deps` every run with no `if:` gate —
      # aligns with the `Install Mesa Vulkan (lavapipe ...)` step above
      # (research F-3 precedent: apt-based system-deps installs are cheap,
      # idempotent, and run unconditionally). Round 2 added the `Cache apt
      # packages` step above so Step B's apt work is cache-accelerated on
      # hit without changing its semantics.

      # bug-20260512-chromium-webgpu-swiftshader-init-failure: the
      # `playwright install chromium` step below fetches the
      # `chromium_headless_shell` binary, which ships WITHOUT WebGPU
      # (research F-1 / F-4 — `--use-vulkan=swiftshader` depends on the
      # chrome build flag `enable_swiftshader_vulkan` that stock chromium
      # does not enable). The pixel-parity bench drives WebGPU via
      # chrome-beta (same channel used by the primary-pnpm job's vitest.config.ts
      # line 88); install it additively here so `Run pixel parity bench`
      # can launch with `channel: 'chrome-beta'`. The `install chromium`
      # step below is preserved because `Run metrics generic runner` and
      # `Run fps reporter` further down still consume
      # chromium_headless_shell (fps reporter uses requestAnimationFrame,
      # no WebGPU dependency); both binaries coexist under
      # ~/.cache/ms-playwright/ without conflict (F-6). Reuses the
      # 0-input/0-output composite action from
      # .github/actions/install-playwright-chrome-beta/.
      - name: Install Playwright Chrome Beta (for pixel-parity bench WebGPU)
        uses: ./.github/actions/install-playwright-chrome-beta
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}

      # w3a: no `if: cache-hit != 'true'` gate. primary-pnpm /
      # vitest-browser / metrics-validate share `~/.cache/ms-playwright`
      # path + cache key but install different browser binaries
      # (chrome-beta / chromium); whichever job saves first wins the
      # cache, leaving cache-hits with the wrong binary. `playwright
      # install chromium` is idempotent (~1s no-op when present), so
      # always run — cache restore still accelerates the tar extraction.
      - name: Install Playwright browser binary (idempotent — playwright install skips already-installed)
        run: pnpm exec playwright install chromium
        working-directory: apps/hello/triangle

      - name: Install Playwright system deps (every run)
        shell: bash
        run: |
          set -eu
          apt_wrapper="${GITHUB_WORKSPACE}/scripts/ci/with-apt-ubuntu-sources.sh"
          "$apt_wrapper" pnpm exec playwright install-deps chromium
        working-directory: apps/hello/triangle

      # Detect lavapipe ICD path + export VK_ICD_FILENAMES / VK_DRIVER_FILES so
      # chromium (headless) launched by bench:pixel-parity can discover the
      # Mesa lavapipe Vulkan driver and expose WebGPU via --enable-unsafe-webgpu.
      # Mirrors the step in the primary-pnpm job (line 336) — dawn-node auto-discovers
      # via standard Vulkan loader paths and does not need this, but chromium
      # does. bug-20260512 round 3: adding here closes the last pre-existing
      # gap that surfaced only after apt/browser caches fixed the earlier
      # WebGPU init blocker; issue #80 capture-failed stage=chromium-launch
      # was observable even with deps installed because chromium had no ICD.
      - name: Detect lavapipe ICD (for chromium WebGPU in pixel-parity bench)
        run: |
          set -e
          ICD_PATH=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "Detected ICD: $ICD_PATH"
          echo "VK_ICD_FILENAMES=$ICD_PATH" >> $GITHUB_ENV
          echo "VK_DRIVER_FILES=$ICD_PATH" >> $GITHUB_ENV

      # feat-20260512-threejs-pixel-parity-bench M3 T-016: one Node runner
      # drives both pixel-parity fixture targets. The independent Vite bundles
      # build together inside this one job, then each target keeps its own
      # serialized preview/Chromium/readback capture, schema-validated report,
      # and exit code. One Xvfb/process invocation removes duplicate CI
      # orchestration and setup overhead without introducing a GitHub matrix.
      # The downstream `Run metrics generic runner` step consumes both reports
      # via the M3 T-015 dispatchBench pixelDiff branch.
      - name: Run pixel parity benches (all fixtures)
        env:
          BENCH_TARGET: all
        # Chrome Beta's Linux/lavapipe WebGPU device is stable when headed
        # under Xvfb; headless GPU-process teardown can destroy the active
        # device while the renderer-owned capture is draining.
        run: xvfb-run -a env FORGEAX_BROWSER_HEADLESS=0 pnpm bench:pixel-parity

      # M7 final color-lighting matrix: browser WebGPU + Dawn producer evidence
      # is required before the generic metrics runner consumes the report. The
      # script writes a partial status index when the fallback or a producer is not
      # executed; it never promotes an incomplete matrix to complete.
      - name: Run color-lighting parity matrix
        env:
          # The complete direct-light roster is owned by vitest-dawn. The
          # metrics matrix asks its runner for the HDRP producer scope only,
          # because its browser URP join consumes those artifacts and does not
          # need a second copy of the falsifier/contract partitions. Keep the
          # CI warmup bounded; the 300-frame stability window remains owned by
          # the full Dawn smoke fleet and local/nightly runs.
          FORGEAX_DAWN_LIGHTWEIGHT: '1'
        # Match the stable Chrome Beta WebGPU contract used by the browser
        # Vitest gate: headed Chromium under Xvfb avoids the Linux headless
        # GPU-process teardown while retaining real WebGPU and pixel evidence.
        run: xvfb-run -a env FORGEAX_BROWSER_HEADLESS=0 pnpm bench:color-lighting-parity

      # The final metrics runner consumes this producer's browser/color reports
      # through the stable join job below. A failed producer is already visible
      # through the required job context; do not upload a partial copy of the
      # full evidence tree that the join job will never consume.
      - name: Stage browser metrics evidence
        if: success()
        run: >-
          node scripts/ci/merge-metrics-evidence.mjs
          --stage --producer browser --output metrics-validate-browser-evidence

      - name: Upload browser metrics evidence
        id: upload-metrics-browser-evidence
        if: success()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: metrics-validate-browser-evidence-a${{ github.run_attempt }}
          path: metrics-validate-browser-evidence/
          if-no-files-found: error
          retention-days: 1

  # Runtime-only metrics producer. It shares the core artifact and smoke-fleet
  # release boundary with the browser producer, but no longer waits behind the
  # browser/color work or re-runs it.
  metrics-validate-runtime:
    name: metrics-validate-runtime
    outputs:
      metrics_evidence_artifact_id: ${{ steps.upload-metrics-runtime-evidence.outputs.artifact-id }}
      metrics_evidence_artifact_name: ${{ steps.upload-metrics-runtime-evidence.outputs.artifact-name }}
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "heavy"]') }}
    needs: [core-build, post-merge-gate, smoke-fleet]
    if: |
      always() &&
      needs.core-build.result == 'success' &&
      needs.smoke-fleet.result == 'success' &&
      ! (needs.post-merge-gate.result == 'success' && needs.post-merge-gate.outputs.skip_checks == 'true')
    permissions:
      actions: read
      contents: read
    # The locked 1k A/B protocol keeps the same 90/10 visibility split and
    # evidence contract while staying within the lavapipe heavy lane's
    # practical memory/CPU budget. Four ordered samples still precede the
    # budget-derived settled groups and six isolated falsifiers.
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=10240
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: recursive
          token: ${{ secrets.GHA }}

      - name: Prepare XDG runtime directory
        uses: ./.github/actions/prepare-xdg-runtime

      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> $GITHUB_OUTPUT
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify heavy runner capacity
        run: node scripts/ci/verify-runner-pool-capacity.mjs --pool heavy
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      - name: Prepare Dawn device-limit normalization
        uses: ./.github/actions/prepare-dawn-device-limits
      - name: Hydrate immutable build artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.core-build.outputs.core_artifact_id }}" --path .
      - name: Verify artifact inputs
        run: node scripts/ci/verify-build-artifact-input.mjs --consumer metrics-validate-runtime --root .
      - name: Install Mesa Vulkan (lavapipe software path for runtime metrics)
        uses: ./.github/actions/install-mesa-vulkan-drivers
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}
      # The feature-owned GPU frame report is produced in this runtime
      # producer job so the metrics join carries the same package-root
      # evidence as the Dawn smoke. Build the app from the hydrated Engine
      # packages first; its bench:json command writes and validates the real
      # same-device report, and exits non-zero when timestamps or any required
      # falsification are unavailable.
      - name: Build hello-lod-occlusion performance consumer
        run: pnpm --filter '@forgeax/hello-lod-occlusion' build
      # Keep the CPU A/B sample on the runner's declared cgroup CPU budget.
      # Without this existing affinity boundary, a shared heavy runner can
      # inject scheduler noise into the treatment p95 while leaving all GPU
      # and falsification facts valid. This changes no metric threshold or
      # workload; it only makes the measurement owner deterministic.
      - name: Run hello-lod-occlusion GPU frame samples producer
        run: >-
          node scripts/ci/run-with-runner-cpu-affinity.mjs --
          node scripts/ci/run-lod-performance-with-retry.mjs --
          pnpm --filter @forgeax/hello-lod-occlusion bench:json
      - name: Dual-impl spike texture-4x4 (dawn-node + lavapipe WebGPU)
        run: pnpm --filter dual-impl-spike smoke
      - name: Run engine-runtime bench (json output for metrics:run)
        run: pnpm -F @forgeax/engine-runtime bench:json
      - name: Check metrics declared
        run: pnpm metrics:check
      - name: Asset authority audit
        run: pnpm run check:asset-authority-audit
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.CACHE_RUNNER_SCOPE }}-${{ hashFiles('apps/hello/triangle/package.json') }}
      - name: Install Playwright browser binary (idempotent)
        run: pnpm exec playwright install chromium
        working-directory: apps/hello/triangle
      - name: Install Playwright system deps (every run)
        shell: bash
        run: |
          set -eu
          apt_wrapper="${GITHUB_WORKSPACE}/scripts/ci/with-apt-ubuntu-sources.sh"
          "$apt_wrapper" pnpm exec playwright install-deps chromium
        working-directory: apps/hello/triangle
      - name: Run fps reporter
        env:
          VK_ICD_FILENAMES: ''
          VK_DRIVER_FILES: ''
        run: pnpm metrics:run-fps
      - name: Run fps reporter (parity-instancing-static)
        env:
          VK_ICD_FILENAMES: ''
          VK_DRIVER_FILES: ''
        run: pnpm metrics:run-fps -- --app apps/parity/instancing-static
      - name: Stage runtime metrics evidence
        if: success()
        run: >-
          node scripts/ci/merge-metrics-evidence.mjs
          --stage --producer runtime --output metrics-validate-runtime-evidence
      - name: Upload runtime metrics evidence
        id: upload-metrics-runtime-evidence
        if: success()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: metrics-validate-runtime-evidence-a${{ github.run_attempt }}
          path: metrics-validate-runtime-evidence/
          if-no-files-found: error
          retention-days: 1

  # Stable required context and report owner. All producer failures are
  # projected into this context; a successful final report is impossible until
  # both attempt-unique producer manifests pass identity/path validation.
  metrics-validate:
    name: metrics-validate
    outputs:
      metrics_artifact_id: ${{ steps.upload-metrics-report.outputs.artifact-id }}
      metrics_artifact_name: ${{ steps.upload-metrics-report.outputs.artifact-name }}
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "heavy"]') }}
    needs: [core-build, post-merge-gate, smoke-fleet, metrics-validate-browser, metrics-validate-runtime]
    if: |
      always() &&
      needs.core-build.result == 'success' &&
      needs.smoke-fleet.result == 'success' &&
      ! (needs.post-merge-gate.result == 'success' && needs.post-merge-gate.outputs.skip_checks == 'true')
    permissions:
      actions: read
      contents: read
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=10240
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: recursive
          token: ${{ secrets.GHA }}

      - name: Prepare XDG runtime directory
        uses: ./.github/actions/prepare-xdg-runtime

      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> $GITHUB_OUTPUT
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify heavy runner capacity
        run: node scripts/ci/verify-runner-pool-capacity.mjs --pool heavy
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Hydrate immutable build artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.core-build.outputs.core_artifact_id }}" --path .
      - name: Verify artifact inputs
        run: node scripts/ci/verify-build-artifact-input.mjs --consumer metrics-validate --root .

      # The VFX batch metric owns one narrow app-local fixture. Build that
      # fixture here from the checked-out source instead of pulling an entire
      # app shard back through the metrics join; the generic runner invokes
      # the fixture's Dawn smoke three times at 10K/100K/1M capacity.
      - name: Build VFX metric fixture
        run: pnpm --filter @forgeax/hello-boss-lightning build

      - name: Validate metrics producer outcomes
        id: validate-metrics-producers
        if: always()
        env:
          BROWSER_RESULT: ${{ needs.metrics-validate-browser.result }}
          RUNTIME_RESULT: ${{ needs.metrics-validate-runtime.result }}
        run: |
          if [ "$BROWSER_RESULT" != success ] || [ "$RUNTIME_RESULT" != success ]; then
            mkdir -p report
            node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const payload = {
            schemaVersion: 1,
            code: 'metrics-producer-failed',
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            headSha: process.env.GITHUB_SHA,
            producers: {
              browser: process.env.BROWSER_RESULT,
              runtime: process.env.RUNTIME_RESULT,
            },
          };
          writeFileSync('report/metrics-producer-failure.json', `${JSON.stringify(payload, null, 2)}\n`);
          NODE
            exit 1
          fi
      - name: Hydrate browser metrics evidence
        if: steps.validate-metrics-producers.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.metrics-validate-browser.outputs.metrics_evidence_artifact_id }}"
          --path metrics-validate-browser-evidence
      - name: Hydrate runtime metrics evidence
        if: steps.validate-metrics-producers.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.metrics-validate-runtime.outputs.metrics_evidence_artifact_id }}"
          --path metrics-validate-runtime-evidence
      - name: Merge metrics producer evidence
        if: steps.validate-metrics-producers.outcome == 'success'
        run: >-
          node scripts/ci/merge-metrics-evidence.mjs
          --merge
          --allow-earlier-attempt
          --browser metrics-validate-browser-evidence
          --runtime metrics-validate-runtime-evidence
          --output .
      - name: Install Mesa Vulkan (lavapipe software path for generic metrics)
        if: steps.validate-metrics-producers.outcome == 'success'
        uses: ./.github/actions/install-mesa-vulkan-drivers
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}

      # The VFX batch report classifies the adapter from the active Vulkan ICD.
      # Keep generic metrics on the same forced lavapipe reference path as the
      # other Dawn jobs; without this export a software runner is mislabeled as
      # hardware and is incorrectly subjected to the 33.34 ms product gate.
      - name: Detect lavapipe ICD (for generic Dawn metrics)
        if: steps.validate-metrics-producers.outcome == 'success'
        run: |
          set -e
          ICD_PATH=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "Detected ICD: $ICD_PATH"
          echo "VK_ICD_FILENAMES=$ICD_PATH" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$ICD_PATH" >> "$GITHUB_ENV"

      - name: Run metrics generic runner
        if: steps.validate-metrics-producers.outcome == 'success'
        env:
          FORGEAX_CHROME_CHANNEL: chrome-beta
        run: pnpm metrics:run
      - name: Upload hello-sprite smoke references (bootstrap)
        if: failure()
        uses: ./.github/actions/upload-optional-artifact
        timeout-minutes: 2
        with:
          name: hello-sprite-smoke-references
          path: forgeax-engine-assets/smoke-baselines/hello-sprite/
          if-no-files-found: ignore
      - name: Render sticky comment
        id: render-metrics-report
        if: steps.validate-metrics-producers.outcome == 'success'
        run: pnpm metrics:report
      - name: Upload metrics report artifact
        id: upload-metrics-report
        # Only PR sticky-comment consumes this file. Main pushes keep the
        # report in the job summary/logs and do not create an unconsumed
        # Actions artifact. Upload the one markdown file instead of the whole
        # report/ tree, which can contain large benchmark evidence.
        if: >-
          github.event_name == 'pull_request' &&
          steps.render-metrics-report.outcome == 'success'
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: metrics-report
          path: report/sticky-comment.md
          if-no-files-found: warn
          retention-days: 1

  # feat-20260704-collapse-fbx-to-ufbx (M4 / T20): collectathon dev-server boot
  # e2e. The D-10 zero-tolerance gate catches dev-server boot crashes that the
  # dawn smoke cannot catch. FBX is parsed by ufbx WASM, so this is the same
  # self-hosted Ubuntu + lavapipe + Chrome Beta capability used by the other
  # browser gates; no macOS image or native FBX SDK is required.
  #
  # What collapsed away (all FBX-SDK-specific, gone with ufbx): the FBX SDK
  # install, native addon rebuild, and the fbx-cube/fbx-skin/collectathon DAWN
  # smokes -- those three now run in ubuntu smoke-fleet as first-class gates.
  #
  # Self-contained SSOT: the smoke:browser literal matches
  #   apps/collectathon/package.json#scripts.smoke:browser
  collectathon-boot-e2e:
    name: collectathon-boot-e2e
    # Browser WebGPU boot is a resource-intensive gate; use the heavy
    # Ubuntu-capable pool.
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "heavy"]') }}
    # The immutable input includes several app/core archives before
    # the browser boot probe can start.
    timeout-minutes: 45
    needs: [build-artifacts, post-merge-gate]
    if: |
      always() &&
      needs.build-artifacts.result == 'success' &&
      ! (needs.post-merge-gate.result == 'success' && needs.post-merge-gate.outputs.skip_checks == 'true')
    permissions:
      actions: read
      contents: read
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: true
          # `token: secrets.GHA` clones the PRIVATE forgeax-engine-assets
          # submodule (the collectathon dev server loads humanoid.fbx from it);
          # the default GITHUB_TOKEN is repo-scoped and fails on the submodule.
          token: ${{ secrets.GHA }}

      - name: Prepare XDG runtime directory
        uses: ./.github/actions/prepare-xdg-runtime

      # Read the pnpm version from the .pnpm-version SSOT (matches packageManager
      # in package.json); mirrors every other job.
      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify heavy runner capacity
        run: node scripts/ci/verify-runner-pool-capacity.mjs --pool heavy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Consume per-contract-class artifacts from build-artifacts
      # (feat-20260716-ci-build-artifact-cost-optimization M2).
      - name: Hydrate immutable build artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.build-artifacts.outputs.artifact_ids_collectathon_boot_e2e }}" --path .

      # Verify required artifact classes are present before main logic
      # (feat-20260716-ci-build-artifact-cost-optimization M2).
      - name: Verify artifact inputs
        run: node scripts/ci/verify-build-artifact-input.mjs --consumer collectathon-boot-e2e --root .

      - name: Install Mesa Vulkan (lavapipe software path for Chrome WebGPU)
        uses: ./.github/actions/install-mesa-vulkan-drivers
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}

      - name: Install Playwright Chrome Beta
        uses: ./.github/actions/install-playwright-chrome-beta
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}

      - name: Detect lavapipe ICD
        run: |
          set -e
          ICD_PATH=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "Detected ICD: $ICD_PATH"
          echo "VK_ICD_FILENAMES=$ICD_PATH" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$ICD_PATH" >> "$GITHUB_ENV"

      # Collectathon dev-server BOOT e2e (feat-20260626 / M6 / D-10 gate, m6-7).
      # Boots the REAL vite dev server in headed Chrome+WebGPU and asserts ZERO
      # boot-window crash signatures + pageerrors (the judgment reject was a
      # dev-server boot crash the dawn smoke could not catch).
      - name: Run collectathon dev-server boot e2e
        env:
          FORGEAX_CHROME_CHANNEL: chrome-beta
          # The self-hosted lavapipe image crashes Chromium's swapchain path;
          # keep this dev-server gate on a real offscreen GPUTexture. Dawn smoke
          # covers actual GPU execution independently of the browser surface.
          FORGEAX_COLLECTATHON_OFFSCREEN: '1'
        run: pnpm --filter @forgeax/collectathon smoke:browser

  # M7 required contract lane: exercise the no-GPU refusal path and the
  # artifact validator on the ordinary standard container pool. This lane never
  # invokes the real-GPU benchmark producer, so 4c8g/8c16g runners remain a
  # supported default CI configuration.
  gpu-pass-timing-contract:
    name: gpu-pass-timing-contract
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "standard"]') }}
    needs: [build-artifacts, post-merge-gate]
    if: |
      always() &&
      needs.build-artifacts.result == 'success' &&
      ! (needs.post-merge-gate.result == 'success' && needs.post-merge-gate.outputs.skip_checks == 'true')
    permissions:
      actions: read
      contents: read
    timeout-minutes: 15
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true

      - name: Checkout contract sources
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: false
          token: ${{ secrets.GHA }}

      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify standard runner capacity
        run: node scripts/ci/verify-runner-pool-capacity.mjs --pool standard

      - name: Clear stale root dependency links (self-hosted)
        run: rm -rf node_modules

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Hydrate immutable core artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.build-artifacts.outputs.artifact_ids_primary_pnpm }}" --path .

