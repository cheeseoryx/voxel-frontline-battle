  cost-reporter:
    name: cost-reporter
    # The cost ledger is paired with the explicit cache/shared-input measurement.
    # Correctness jobs remain unchanged on ordinary pull requests and main pushes.
    if: github.event_name == 'workflow_dispatch' && inputs.run_shared_evidence_probe == true
    needs: [build-artifacts, primary-pnpm, coverage-pnpm, coverage-perf, vitest-browser, shared-inputs-browser, multithread-browser-benchmark, smoke-fleet, bevy-smoke-fleet, vitest-dawn, webkit-fallback, portability-bun, metrics-validate, collectathon-boot-e2e, gpu-pass-timing-contract, cache-warm, shared-evidence-probe]
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "standard"]') }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: false
          token: ${{ secrets.GHA }}
      - name: Setup Node.js for CI cost scripts
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Decode cost inputs
        run: |
          set -euo pipefail
          mkdir -p ci-cost-input/cache
          printf '%s' '${{ needs.build-artifacts.outputs.provenance_payload }}' | base64 --decode > ci-cost-input/ci-provenance-merged.json
          printf '%s' '${{ needs.cache-warm.outputs.timing_payload }}' | base64 --decode > ci-cost-input/cache/ci-cache-timing.json
          printf '%s' '${{ needs.cache-warm.outputs.audit_payload }}' | base64 --decode > ci-cost-input/cache/ci-cache-audit.json
          shared_payload='${{ needs.shared-evidence-probe.outputs.evidence_payload }}'
          if [ -n "$shared_payload" ]; then
            printf '%s' "$shared_payload" | base64 --decode > ci-cost-input/shared-evidence.json
          fi
      - name: Collect cost facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shared_args=()
          if [ -f ci-cost-input/shared-evidence.json ]; then
            shared_args+=(--shared-evidence ci-cost-input/shared-evidence.json)
          fi
          node scripts/ci/collect-ci-cost-monitor.mjs --run-id ${{ github.run_id }} --attempt ${{ github.run_attempt }} \
            --merged-provenance ci-cost-input/ci-provenance-merged.json \
            --cache-audit ci-cost-input/cache/ci-cache-audit.json \
            --cache-timing ci-cost-input/cache/ci-cache-timing.json \
            "${shared_args[@]}" --out ci-cost-facts.json
      - name: Check single-run cost budgets
        run: >-
          node scripts/ci/report-ci-cost-monitor.mjs --mode single-run --run-id $GITHUB_RUN_ID
          --attempt $GITHUB_RUN_ATTEMPT --facts ci-cost-facts.json
      - name: Write cost summary
        run: node scripts/ci/write-ci-cost-summary.mjs --facts ci-cost-facts.json --output "$GITHUB_STEP_SUMMARY"
      - name: Record return evidence observations
        shell: node {0}
        run: |
          const { appendFileSync, readFileSync } = require('node:fs');
          const facts = JSON.parse(readFileSync('ci-cost-facts.json', 'utf8'));
          const families = facts.returnEvidence?.families;
          if (!Array.isArray(families) || families.length !== 10) {
            throw new Error('ci-return-evidence-family-count-invalid');
          }
          const names = new Set();
          for (const row of families) {
            if (names.has(row.family) || !['valid', 'invalidEvidence'].includes(row.status)) {
              throw new Error('ci-return-evidence-family-shape-invalid');
            }
            names.add(row.family);
          }
          const observations = families.map((row) => ({
            family: row.family,
            status: row.status,
            artifactId: row.artifactId ?? null,
            classification: row.classification ?? null,
            ownerGap: row.status === 'invalidEvidence'
              ? {
                  code: row.code,
                  owner: row.detail?.owner ?? row.producer?.owner ?? null,
                  field: row.detail?.field ?? null,
                }
              : null,
          }));
          const rows = observations.map((row) => {
            const ownerGap = row.ownerGap
              ? [row.ownerGap.code, row.ownerGap.owner, row.ownerGap.field]
                  .filter((value) => value !== null)
                  .join(' / ')
              : 'N/A';
            return `| ${row.family} | ${row.status} | ${row.artifactId ?? 'N/A'} | ${row.classification ?? 'N/A'} | ${ownerGap} |`;
          });
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              '',
              '## Return evidence observations',
              '| Family | Status | Artifact ID | Cache classification | Owner gap |',
              '| --- | --- | --- | --- | --- |',
              ...rows,
              '',
            ].join('\n'),
          );
          process.stdout.write(`${JSON.stringify({ returnEvidenceObservations: observations })}\n`);
  # L2 split-job sticky-comment PR-only feat-20260510-ci-merge-gate-hardening K-1 + K-2
  # sticky-comment: PR-only; needs metrics-validate but runs even when it failed
  # (so AI users see partial report + warning bar instead of "no report"). push
  # event -> entire job skipped (does not pollute ci.yml conclusion; research
  # §F-7 compatibility).
  sticky-comment:
    name: sticky-comment
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "standard"]') }}
    # feat-20260616-ci-time-cut-roi-batch M3 (D-4): vitest-browser +
    # vitest-dawn split out from primary-pnpm now appear as independent PR
    # check rows; add them to needs[] so a red row is visible in the PR
    # check list (partial-mode logic below remains unchanged — primary-pnpm
    # + portability-bun gate the sticky-comment body, charter proposition 4
    # explicit failure stays surfaced via the standalone job rows).
    needs: [primary-pnpm, coverage-pnpm, coverage-perf, smoke-fleet, bevy-smoke-fleet, vitest-browser, shared-inputs-browser, multithread-browser-benchmark, vitest-dawn, webkit-fallback, portability-bun, metrics-validate, gpu-pass-timing-contract]
    if: always() && github.event_name == 'pull_request' && needs.metrics-validate.result != 'cancelled'
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true
      - name: Checkout CI scripts
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: false
          token: ${{ secrets.GHA }}
      - name: Setup Node.js for CI report download
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify successful metrics report identity
        if: needs.metrics-validate.result == 'success' && needs.metrics-validate.outputs.metrics_artifact_id == ''
        run: |
          echo "::error::metrics-validate succeeded without a metrics report artifact ID"
          exit 1
      - name: Download metrics report artifact
        if: needs.primary-pnpm.result == 'success' && needs.portability-bun.result == 'success' && (needs.metrics-validate.result == 'success' || needs.metrics-validate.result == 'failure') && needs.metrics-validate.outputs.metrics_artifact_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.metrics-validate.outputs.metrics_artifact_id }}"
          --path report/

      # K-2 partial mode: when metrics-validate did not succeed (but build did),
      # prepend a GitHub markdown alert blockquote so AI users see the "partial
      # report" signal at the top of the sticky comment (charter proposition 4
      # explicit failure + K-2 partial upload strategy).
      - name: Inject partial-mode warning bar
        if: needs.primary-pnpm.result == 'success' && needs.portability-bun.result == 'success' && needs.metrics-validate.result != 'success'
        run: |
          mkdir -p report
          if [ -f report/sticky-comment.md ]; then
            cp report/sticky-comment.md report/sticky-comment.body.md
          else
            : > report/sticky-comment.body.md
          fi
          {
            echo "> [!WARNING] metrics-validate failed — partial report below"
            echo ""
            cat report/sticky-comment.body.md
          } > report/sticky-comment.md

      - name: Sticky comment (success or partial)
        if: needs.primary-pnpm.result == 'success' && needs.portability-bun.result == 'success'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: forgeax-engine-report
          path: report/sticky-comment.md

      - name: Sticky comment (build failed)
        if: needs.primary-pnpm.result != 'success' || needs.portability-bun.result != 'success'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: forgeax-engine-report
          message: |
            ### forgeax-engine CI report

            **build failed, no report** — primary-pnpm=${{ needs.primary-pnpm.result }}, portability-bun=${{ needs.portability-bun.result }}.

  # Publish the fbx-wasm pkg/ bundle to GitHub Releases on main push
  # (content-keyed idempotent). The emcc build emits a PAIR — fbx-wasm.wasm +
  # its self-loading fbx-wasm.mjs glue (MODULARIZE + EXPORT_ES6) — and
  # src/index.ts imports the .mjs glue at runtime, so the release asset is the
  # WHOLE pkg/ packed as a content-keyed .tar.gz (mirrors publish-wgpu-wasm and
  # publish-basis-wasm). The content key (bridge.c + fetch-ufbx.mjs +
  # build-wasm.mjs) is computed by scripts/content-key.mjs — the SSOT shared
  # with the consumer-side scripts/fetch-wasm.mjs, so producer and consumer
  # never disagree on the asset name.
  #
  # Only runs on main push (not PR, not branch push). The CI's own build
  # always uses emcc (see build-artifacts above) — this job publishes the
  # result so that downstream `fetch-wasm.mjs` consumers can skip local emcc.
  # Reference: feat-20260704-collapse-fbx-to-ufbx-single-parser-release-based-w M3 T15.
  publish-fbx-wasm-release:
    name: publish-fbx-wasm-release
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "standard"]') }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: core-build
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: false
          token: ${{ secrets.GHA }}

      # setup-node@v5 auto-detects the repo's `packageManager: pnpm` field and
      # fails ("Unable to locate executable file: pnpm") when pnpm is not on PATH,
      # so provision pnpm first even though this job never runs `pnpm install`
      # (it only invokes the content-key + publish node scripts).
      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> $GITHUB_OUTPUT
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download fbx-wasm pkg from core-build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.core-build.outputs.core_artifact_id }}" --path build-output/

      # Compute the content key via the shared SSOT module. Uses the checked-out
      # sources (the canonical state that triggered this push), guaranteeing the
      # key matches what fetch-wasm.mjs will later compute for the same commit.
      - name: Compute content key
        id: content-key
        run: |
          set -euo pipefail
          ASSET_NAME=$(node packages/fbx/scripts/content-key.mjs | tail -1)
          echo "asset_name=${ASSET_NAME}" >> $GITHUB_OUTPUT
          echo "asset name = ${ASSET_NAME}"

      # Pack the built pkg/ (downloaded from core-build) into a flat tarball
      # whose members are pkg/'s direct contents, matching fetch-wasm.mjs's
      # `tar -xzf ... -C pkg/` extraction.
      - name: Pack pkg/ tarball
        id: pack
        env:
          ASSET_NAME: ${{ steps.content-key.outputs.asset_name }}
        run: |
          set -euo pipefail
          PKG_DIR="build-output/packages/fbx/pkg"
          if [ ! -f "$PKG_DIR/fbx-wasm.mjs" ] || [ ! -f "$PKG_DIR/fbx-wasm.wasm" ]; then
            echo "ERROR: fbx-wasm pkg/ pair not found at $PKG_DIR"
            ls -R "$PKG_DIR" || true
            exit 1
          fi
          TARBALL="${RUNNER_TEMP}/${ASSET_NAME}"
          tar -czf "$TARBALL" -C "$PKG_DIR" .
          echo "path=${TARBALL}" >> $GITHUB_OUTPUT
          echo "tarball size: $(stat -c%s "$TARBALL") bytes"

      - name: Publish pkg tarball (content-keyed idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_NAME: ${{ steps.content-key.outputs.asset_name }}
          TARBALL_PATH: ${{ steps.pack.outputs.path }}
          TAG: wasm-artifacts
        run: node scripts/publish-wasm-release.mjs "$TAG" "$ASSET_NAME" "$TARBALL_PATH"


