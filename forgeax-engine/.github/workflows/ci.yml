      # `.gltf` is JSON text and stays allowed; `.glb` (binary) is banned.
      - name: Zero-binary invariant gate
        run: pnpm grep:no-binary-assets

      # AC-13 / AC-14 array-vocab + Children/Instances cross-cut gates
      # (feat-20260514-ecs-children-instances-managed-buffer-array M4 / w17):
      #   asset-registry-instanced-removed: legacy AssetRegistry instanced-buffer
      #     triplet (createInstancedBuffer / updateInstancedBuffer /
      #     getInstancedGpuBuffer) + InstancedBufferAsset POD brand are
      #     physically removed from packages/ apps/ templates/ live code (M3
      #     deletion is permanent; comments documenting the cross-cut are
      #     allowed and the gate strips them before scanning).
      #   no-entity-array-literal: legacy schema-vocab keyword 'entity[]' is
      #     no longer present as a string literal in TS / JS sources; the
      #     replacement vocab is array<entity> (ECS-managed variable-length
      #     path consumed via VarArrayView).
      #   readme-array-vocab-mentioned: AI-user READMEs (packages/ecs/README.md
      #     + packages/runtime/README.md) carry the new vocab + component
      #     schema literals (array<T,N> / array<T> / Children { entities /
      #     Instances { transforms) — reverse-coupling discoverability check.
      #   readme-string-vocab-mentioned (feat-20260515-ecs-name-component-and-
      #     string-schema M3 / w3-grep-gate-wire-ci): packages/ecs/README.md
      #     carries 'string' bare-literal vocab + Name { value: schema literal
      #     + StringView value-shape symbol — reverse-coupling discoverability
      #     check for the third managed value-shape (sibling to FixedArrayView
      #     / VarArrayView). Same shape as readme-array-vocab-mentioned.
      - name: AC-13 + AC-14 array-vocab + cross-cut gates
        run: |
          pnpm grep:asset-registry-instanced-removed
          pnpm grep:no-entity-array-literal
          pnpm grep:readme-array-vocab-mentioned
          pnpm grep:readme-string-vocab-mentioned
          pnpm grep:no-managed-array-view-import
          pnpm grep:no-array-stride-option
          pnpm grep:no-buffer-colon-keyword
          pnpm grep:no-managed-array-error-code
          pnpm grep:no-result-reproject-cast

      # AC-07 PackErrorDetail narrowing lint gate (feat-20260513-guid-asset-package-system w19).
      # Uses ts-morph to verify that every case 'pack-xxx': in switch(err.code) blocks
      # accesses .detail via discriminant narrowing and not via "as" type-assertion.
      # Exit 0 = all pack-xxx case clauses narrow .detail correctly.
      # Exit 1 = one or more "as"-cast violations found.
      - name: AC-07 check-pack-error-detail-narrowed
        run: node packages/pack/scripts/check-pack-error-detail-narrowed.mjs

      # AC-20 end-to-end CLI evidence collector (feat-20260511-inspector-p0-spike
      # T-16 + T-17). Drives the forgeax CLI binary against an in-process
      # @forgeax/engine-remote server bound to an ephemeral port, exercising all 12
      # cases (5 inspect targets + script file + eval happy + eval write-denied
      # + 3 script error codes + fixture-injection mutation blacklist). Exit 0
      # = all 12 cases match the expected exit code + stderr triple; exit 1 =
      # one or more cases regressed silently (charter proposition 6 simulation
      # coverage delta+zeta double gate). Node-only — no dawn / chromium /
      # vite needed; the harness uses a synthetic World object whose shape
      # mirrors world.inspect() (charter proposition 5 consistent abstraction
      # — same JSON-RPC envelope, same InspectorError triple, same exit
      # codes).
      - name: AC-20 remote-demo end-to-end CLI evidence
        run: node apps/remote-demo/scripts/e2e-cli.mjs

      - name: Multiplayer snake process E2E
        run: pnpm -F @forgeax/multiplayer-snake test:process-e2e

  # feat-20260616-ci-time-cut-roi-batch M3 (D-4): vitest browser project
  # extracted from primary-pnpm into a standalone job so it runs in parallel
  # Coverage is independent of the lint and named-gate stream. It
  # consumes the same immutable build output and owns the JSON/diagnostic chain,
  # while coverage-perf owns the uninstrumented ratio projects in parallel.
  coverage-pnpm:
    name: coverage-pnpm
    # V8 coverage runs on the heavy pool; repository-wide typecheck is already
    # produced by ci-core/build-artifacts. The split producer keeps each child
    # below the 4 GiB V8 heap tier.
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "heavy"]') }}
    needs: [build-artifacts, post-merge-gate]
    if: |
      always() &&
      needs.build-artifacts.result == 'success' &&
      ! (needs.post-merge-gate.result == 'success' && needs.post-merge-gate.outputs.skip_checks == 'true')
    permissions:
      actions: read
      contents: read
    # The immutable input includes several app/core archives; leave
    # transfer, coverage, and the perf-budget guard room together.
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GHA }}

      - name: Prepare XDG runtime directory
        uses: ./.github/actions/prepare-xdg-runtime

      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> $GITHUB_OUTPUT
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # See primary-pnpm: persistent self-hosted workspaces can retain a
      # lockfile-clean node_modules tree with missing root command shims.
      - name: Verify heavy runner capacity
        run: node scripts/ci/verify-runner-pool-capacity.mjs --pool heavy

      - name: Clear stale root dependency links (self-hosted)
        run: rm -rf node_modules

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright Chrome Beta (for real Browser Host coverage)
        uses: ./.github/actions/install-playwright-chrome-beta
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}
      - name: Materialize harness documentation
        env:
          FORGEAX_HARNESS_TOKEN: ${{ secrets.GHA }}
          FORGEAX_HARNESS_SPARSE_DOCS: '1'
        run: node scripts/ci/materialize-harness-docs.mjs
      - name: Hydrate immutable build artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.build-artifacts.outputs.artifact_ids_coverage_pnpm }}" --path .

      - name: Hydrate immutable shared app inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.build-artifacts.outputs.shared_artifact_id }}"
          --path shared-app-inputs-transfer

      - name: Unpack immutable shared app inputs
        run: node scripts/ci/unpack-shared-app-inputs.mjs --root .

      # The coverage consumer runs the shader-plugin tests themselves. Restore
      # the producer-owned projection before Vitest so those tests exercise the
      # same immutable shader input as the other read-only consumers instead of
      # silently falling back to a cold source compile under runner contention.
      - name: Materialize shared app shader manifests
        timeout-minutes: 2
        run: >-
          node scripts/ci/materialize-app-shader-manifests.mjs
          --root . --shared-input-manifest shared-app-inputs/manifest.json
      - name: Verify artifact inputs
        run: node scripts/ci/verify-build-artifact-input.mjs --consumer coverage-pnpm --root .
      # The coverage consumer receives immutable package artifacts, but hello-taa
      # owns its app-local shader manifest. Build it before Vitest coverage so
      # render integration tests exercise the cold producer contract.
      - name: Build hello-taa cold shader manifest
        run: pnpm --filter @forgeax/hello-taa build
      # AC-03 is intentionally a real cold-production grep, not a package-only
      # source assertion. Coverage runs in an isolated consumer, so materialize
      # the small tree-shake app bundles here before the rhi-debug project sees
      # their tests. These are consumer-owned probes, not transferred app
      # artifacts.
      - name: Build hello-cube cold dist for tree-shake gate
        run: pnpm --filter @forgeax/hello-cube build
      - name: Build hello-triangle cold dist for tree-shake gate
        run: pnpm --filter @forgeax/hello-triangle build
      - name: Vitest coverage (v8) (bounded runtime children)
        env:
          FORGEAX_CHROME_CHANNEL: chrome-beta
          FORGEAX_SHARED_APP_INPUTS_MANIFEST: ${{ github.workspace }}/shared-app-inputs/manifest.json
        run: |
          set +e
          # Keep the package bin directory explicit because pnpm's ignored-
          # scripts install may not recreate root .bin shims on a persistent
          # self-hosted workspace.
          export PATH="$PWD/node_modules/typescript/bin:$PWD/node_modules/.bin:$PATH"
          # ci-core/build-artifacts already owns the exact-source declaration
          # gate. Skip the duplicate Vitest typecheck here and use larger
          # groups plus the heavy-runner adaptive concurrency to reduce fresh
          # process and scheduler overhead.
          node scripts/ci/run-split-vitest-coverage.mjs \
            --group-size=8 \
            --group-concurrency=auto \
            --max-workers=1 \
            --skip-typecheck \
            --output-file=vitest-coverage-out.json \
            --coverage-dir=coverage 2>&1 | tee vitest-coverage.log
          VRC=${PIPESTATUS[0]}
          set -e
          if [ "$VRC" -ne 0 ]; then exit "$VRC"; fi
          node scripts/ci/check-vitest-passed-or-fail.mjs vitest-coverage-out.json
      - name: Upload coverage diagnostics on failure (feat-20260608-ci-time-cut)
        if: failure()
        uses: ./.github/actions/upload-optional-artifact
        timeout-minutes: 2
        with:
          name: coverage-diagnostics
          path: |
            vitest-coverage-out.json
            coverage/
          retention-days: 1
          if-no-files-found: warn
      - name: Perf-budget regression guard - coverage path (feat-20260616-ci-time-cut-roi-batch)
        run: node scripts/ci/check-test-perf-budget.mjs < vitest-coverage-out.json

  # P4 treatment A/B: the named performance projects must remain uninstrumented,
  # but they do not consume vitest-coverage-out.json. Keep them in a separate
  # consumer so the coverage producer and its hard perf-budget guard
  # remain one owner while the two ratio gates can run concurrently.
  coverage-perf:
    name: coverage-perf
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "standard"]') }}
    needs: [build-artifacts, post-merge-gate]
    if: |
      always() &&
      needs.build-artifacts.result == 'success' &&
      ! (needs.post-merge-gate.result == 'success' && needs.post-merge-gate.outputs.skip_checks == 'true')
    permissions:
      actions: read
      contents: read
    # The immutable build-artifact input can contain several app/core
    # archives; leave transfer, benchmark, and cleanup room without changing the
    # benchmark's sample or threshold contract.
    timeout-minutes: 45
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GHA }}
      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> $GITHUB_OUTPUT
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Clear stale root dependency links (self-hosted)
        run: rm -rf node_modules
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Hydrate immutable build artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.build-artifacts.outputs.artifact_ids_coverage_perf }}" --path .
      - name: Verify artifact inputs
        run: node scripts/ci/verify-build-artifact-input.mjs --consumer coverage-perf --root .
      # V8 coverage instrumentation changes ratio results, so these projects
      # stay in their own uninstrumented invocations.
      - name: ECS performance ratio gates (uninstrumented)
        run: pnpm exec vitest run --maxWorkers=1 --project=ecs-perf
      - name: Render performance ratio gates (uninstrumented)
        run: pnpm exec vitest run --maxWorkers=1 --project=render-perf

  # Dedicated CSM Browser WebGPU producer. The prior failure stopped at the
  # pre-render adapter-acquisition boundary; give that unchanged evidence
  # carrier an independent job/process and failure owner while the four Vitest
  # shards retain their existing matrix and protected aggregate.
  directional-csm-browser:
    name: directional-csm-browser
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "heavy"]') }}
    needs: [build-artifacts, shared-app-inputs, post-merge-gate]
    if: |
      always() &&
      needs.build-artifacts.result == 'success' &&
      needs.shared-app-inputs.result == 'success' &&
      ! (needs.post-merge-gate.result == 'success' && needs.post-merge-gate.outputs.skip_checks == 'true')
    permissions:
      actions: read
      contents: read
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      FORGEAX_SHARED_APP_INPUTS_MANIFEST: ${{ github.workspace }}/shared-app-inputs/manifest.json
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: recursive
          token: ${{ secrets.GHA }}

      - name: Prepare XDG runtime directory
        uses: ./.github/actions/prepare-xdg-runtime

      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> $GITHUB_OUTPUT
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify heavy runner capacity
        run: node scripts/ci/verify-runner-pool-capacity.mjs --pool heavy
      - name: Clear stale root dependency links (self-hosted)
        run: rm -rf node_modules
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare Dawn device-limit normalization
        uses: ./.github/actions/prepare-dawn-device-limits
      - name: Hydrate immutable build artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.build-artifacts.outputs.artifact_ids_vitest_browser }}" --path .

      - name: Hydrate immutable shared app inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.shared-app-inputs.outputs.shared_artifact_id }}"
          --path shared-app-inputs-transfer

      - name: Unpack immutable shared app inputs
        run: node scripts/ci/unpack-shared-app-inputs.mjs --root .

      - name: Verify artifact inputs
        run: >-
          node scripts/ci/verify-build-artifact-input.mjs
          --consumer directional-csm-browser --root .
          --shared-input-manifest shared-app-inputs/manifest.json
          --shared-input-mode catalog-only
          --input-fingerprint "${{ needs.shared-app-inputs.outputs.input_fingerprint }}"
      - name: Install Mesa Vulkan (lavapipe software path for chrome-beta WebGPU)
        uses: ./.github/actions/install-mesa-vulkan-drivers
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}
      - name: Install Playwright Chrome Beta (for directional CSM WebGPU)
        uses: ./.github/actions/install-playwright-chrome-beta
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}
      - name: Detect lavapipe ICD (for chrome-beta WebGPU in directional CSM)
        run: |
          set -e
          ICD_PATH=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "Detected ICD: $ICD_PATH"
          echo "VK_ICD_FILENAMES=$ICD_PATH" >> $GITHUB_ENV
          echo "VK_DRIVER_FILES=$ICD_PATH" >> $GITHUB_ENV
      - name: Directional CSM Browser WebGPU smoke (M5 MVD)
        env:
          FORGEAX_CHROME_CHANNEL: chrome-beta
          FORGEAX_BROWSER_HEADLESS: '0'
        run: >-
          node scripts/ci/run-browser-gate-with-retry.mjs
          --mode=rhi-debug
          --
          xvfb-run -a env FORGEAX_BROWSER_HEADLESS=0
          pnpm --filter '@forgeax/app-learn-render-5-advanced-lighting-3-3-csm'
          smoke:browser
      - name: Upload directional CSM pixel evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: directional-csm-pixel-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/learn-render/5.advanced-lighting/3.3.csm/.forgeax-debug/verify-*/frame.rhitape
            apps/learn-render/5.advanced-lighting/3.3.csm/.forgeax-debug/verify-*/live.png
            apps/learn-render/5.advanced-lighting/3.3.csm/.forgeax-debug/verify-*/replay.png
            apps/learn-render/5.advanced-lighting/3.3.csm/.forgeax-debug/verify-*/compare.png
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # with primary-pnpm + portability-bun + metrics-validate instead of
  # extending primary-pnpm's serial chain. Mirror of primary-pnpm prelude
  # (Read pnpm version + Setup pnpm + Setup Node + Install (frozen) +
  # Download build artifacts) is intentionally inlined here — OOS-5 explicitly
  # forbids extracting the prelude into a reusable workflow / composite
  # action; both jobs walk the same setup independently.
  # Cache key string-identical to primary-pnpm Chrome Beta cache (:1640 region)
  # and metrics-validate :2308 region per AC-06 SSOT parity.
  vitest-browser-shard:
    name: vitest-browser-shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # Four lanes match the heavy runner pool. The split runner keeps all
        # four lanes productive; shard 0 carries a lighter Vitest slice to
        # account for its fixed smoke tail below.
        shard: [0, 1, 2, 3]
    # Chrome Beta + lavapipe is a resource-intensive WebGPU gate; target the
    # heavy runner pool rather than the standard pool.
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "heavy"]') }}
    needs: [build-artifacts, shared-app-inputs, post-merge-gate]
    if: |
      always() &&
      needs.build-artifacts.result == 'success' &&
      needs.shared-app-inputs.result == 'success' &&
      ! (needs.post-merge-gate.result == 'success' && needs.post-merge-gate.outputs.skip_checks == 'true')
    permissions:
      actions: read
      contents: read
    # The immutable input includes several app/core archives before
    # Chrome and the browser suite can start.
    timeout-minutes: 45
    # Vitest's Vite dependency optimizer plus Chrome needs the heavy pool; keep
    # the Node heap bounded so Chrome and lavapipe fit the 16 GiB machine tier.
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      # Browser CI keeps the full assertion roster but uses the smallest
      # meaningful frame/readback windows for high-density carriers. Local
      # browser runs retain their longer stability profiles; Dawn remains the
      # long-window native evidence owner.
      FORGEAX_BROWSER_CI_LIGHTWEIGHT: '1'
      FORGEAX_BROWSER_FIXED_SMOKE: '1'
      # Reuse the immutable shader projection produced by shared-app-inputs so
      # the M16 Vite server spends CPU on browser assertions instead of
      # recooking the entire built-in shader fleet during cold start.
      FORGEAX_SHARED_APP_INPUTS_MANIFEST: ${{ github.workspace }}/shared-app-inputs/manifest.json
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: recursive
          token: ${{ secrets.GHA }}

      - name: Prepare XDG runtime directory
        uses: ./.github/actions/prepare-xdg-runtime

      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # See primary-pnpm: force a clean root dependency tree so pnpm recreates
      # the Playwright command shim on persistent Ubuntu runners.
      - name: Verify heavy runner capacity
        run: node scripts/ci/verify-runner-pool-capacity.mjs --pool heavy

      - name: Clear stale root dependency links (self-hosted)
        run: rm -rf node_modules

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Cross-job artifact pipeline (feat-20260716-ci-build-artifact-cost-optimization
      # M2): consume per-contract-class artifacts from build-artifacts.
      - name: Hydrate immutable build artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.build-artifacts.outputs.artifact_ids_vitest_browser }}" --path .

      - name: Hydrate immutable shared app inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.shared-app-inputs.outputs.shared_artifact_id }}"
          --path shared-app-inputs-transfer

      - name: Unpack immutable shared app inputs
        run: node scripts/ci/unpack-shared-app-inputs.mjs --root .

      # Verify required artifact classes are present before main logic
      # (feat-20260716-ci-build-artifact-cost-optimization M2).
      - name: Verify artifact inputs
        run: >-
          node scripts/ci/verify-build-artifact-input.mjs
          --consumer vitest-browser --root .
          --shared-input-manifest shared-app-inputs/manifest.json
          --shared-input-mode catalog-only
          --input-fingerprint "${{ needs.shared-app-inputs.outputs.input_fingerprint }}"

      # Linux runtime deps: mesa-vulkan-drivers (lavapipe ICD). Required
      # because chrome-beta launched by @vitest/browser-playwright walks
      # WebGPU through the lavapipe Vulkan driver (vitest.config.ts
      # launchOptions.args includes --enable-unsafe-webgpu).
      - name: Install Mesa Vulkan (lavapipe software path for chrome-beta WebGPU)
        uses: ./.github/actions/install-mesa-vulkan-drivers
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}

      # chrome-beta is installed through the composite action's physically
      # isolated ~/.cache/chrome-beta deb cache. This job never launches a
      # Playwright-managed browser from ~/.cache/ms-playwright, so restoring
      # that 300+ MB cache only adds a slow transfer and cross-channel cache
      # contention with the other browser jobs.

      # @vitest/browser-playwright provider needs a chromium binary with
      # WebGPU support; the bundled `chromium_headless_shell` lacks it.
      # Install Chrome Beta and configure vitest.config.ts to use it via
      # `channel: 'chrome-beta'` in launchOptions.
      - name: Install Playwright Chrome Beta (for @vitest/browser-playwright)
        uses: ./.github/actions/install-playwright-chrome-beta
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}

      # Detect lavapipe ICD path + export VK_ICD_FILENAMES / VK_DRIVER_FILES so
      # chrome-beta (with WebGPU flags in vitest.config.ts launchOptions.args)
      # discovers the Mesa lavapipe Vulkan driver. dawn-node auto-discovers
      # via standard Vulkan loader paths and does not need this; chromium /
      # chrome does.
      - name: Detect lavapipe ICD (for chrome-beta WebGPU in vitest browser)
        run: |
          set -e
          ICD_PATH=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "Detected ICD: $ICD_PATH"
          echo "VK_ICD_FILENAMES=$ICD_PATH" >> $GITHUB_ENV
          echo "VK_DRIVER_FILES=$ICD_PATH" >> $GITHUB_ENV

      # AC-05 (K-3 + K-6 PR only Linux): RHI/engine API integration gate
      # (complements smoke e2e). K-10 stance: failure = job failure, manual
      # override not allowed. Browser groups keep their fresh-process
      # boundaries, but CI uses a deterministic cost-balanced assignment;
      # round-robin put the direct-light and render-target owners on one
      # shard in the reference run and left that runner at ~20m while the
      # other three were ~8m. The split plan reserves two process slots on the
      # smoke lane and lets the other lanes absorb those light groups, retaining
      # the owner-specific boundaries below without adding a fifth runner.
      # M7 HDRP clustered spot-shadow coverage: the shard set includes
      # apps/parity/color-lighting/cases/direct-light/__tests__/
      # direct-light.browser.test.ts. Keep its live linear-HDR producer and
      # pipeline-provenance assertions in the gate; do not replace them with a
      # screenshot-only or unit-only check.
      - name: Vitest browser project (RHI/engine API integration — shard)
        # Chrome Beta's real WebGPU device is stable on this Linux/lavapipe
        # path when headed under Xvfb; the entity-visibility visual smoke uses
        # the same headed browser contract. Each bounded test group owns its
        # fresh browser process and retries only its own declared runner
        # instability, so one flaky group never re-runs a successful shard.
        run: >-
          xvfb-run -a env FORGEAX_BROWSER_HEADLESS=0
          node scripts/ci/run-split-vitest-browser.mjs
          --group-size=16
          --max-workers=1
          --shard-strategy=balanced
          --shard-index=${{ matrix.shard }}
          --shard-count=4

      - name: MSAA paired P2 proof (real OFF/ON captures)
        if: matrix.shard == 0
        env:
          FORGEAX_CHROME_CHANNEL: chrome-beta
        # Chrome Beta's real WebGPU device is stable on this Linux/lavapipe
        # path when headed under Xvfb; headless GPU-process teardown can
        # destroy the external Instance while rhi-debug drains the queue.
        run: >-
          node scripts/ci/run-browser-gate-with-retry.mjs
          --mode=rhi-debug
          --
          xvfb-run -a env FORGEAX_BROWSER_HEADLESS=0
          pnpm --filter @forgeax/app-learn-render-4-advanced-opengl-10-anti-aliasing-msaa
          smoke:browser:pair

      - name: Start hello-fxaa dev server (owned background)
        if: matrix.shard == 0
        run: |
          GITHUB_ENV="$GITHUB_ENV" node scripts/ci/owned-dev-server.mjs start \
            --state-file report/ci-lifecycle/hello-fxaa.json \
            --log-file report/ci-lifecycle/hello-fxaa.log \
            --requested-port 5183 \
            --env-name DARK_GRADIENT_SERVER_URL \
            --timeout-ms 180000 \
            --cwd apps/hello/fxaa \
            -- \
            pnpm exec vite --host 127.0.0.1 --port __PORT__ --strictPort

      # Hello FXAA dark-gradient concrete producer: one Browser WebGPU page
      # captures the none and FXAA phases from the same fixture identity.
      # The script exits non-zero when readback or any frozen metric is absent.
      - name: Hello FXAA dark-gradient Browser WebGPU smoke (direct)
        if: matrix.shard == 0
        env:
          FORGEAX_BROWSER_CHANNEL: chrome-beta
          FORGEAX_DARK_GRADIENT_LANE: direct
        run: >-
          xvfb-run -a env FORGEAX_BROWSER_HEADLESS=0
          FORGEAX_DARK_GRADIENT_URL="$DARK_GRADIENT_SERVER_URL"
          pnpm --filter @forgeax/hello-fxaa smoke:browser

      - name: Hello FXAA dark-gradient Browser WebGPU smoke (clustered)
        if: matrix.shard == 0
        env:
          FORGEAX_BROWSER_CHANNEL: chrome-beta
          FORGEAX_DARK_GRADIENT_LANE: clustered
        run: >-
          xvfb-run -a env FORGEAX_BROWSER_HEADLESS=0
          FORGEAX_DARK_GRADIENT_URL="$DARK_GRADIENT_SERVER_URL"
          pnpm --filter @forgeax/hello-fxaa smoke:browser

      - name: Stop hello-fxaa dev server
        if: always() && matrix.shard == 0
        run: |
          node scripts/ci/owned-dev-server.mjs stop \
            --state-file report/ci-lifecycle/hello-fxaa.json \
            --allow-missing=true

      # M16 same-session reconnect/resync journey. The script uses the real
      # Node authority, WebSocket connector, Chrome Beta WebGPU, structured
      # recovery trace, and the post-resync canvas oracle. The two deliberate
      # visual falsifiers remain runnable locally through SNAKE_SABOTAGE and
      # are enforced by the browser script's expected-failure contract.
      - name: Multiplayer snake browser E2E (M16 reconnect/resync)
        if: matrix.shard == 0
        # Chrome Beta's lavapipe WebGPU path is stable when headed under Xvfb;
        # headless GPU-process teardown invalidates Dawn's external Instance
        # while the M16 capture drains the queue.
        run: xvfb-run -a env FORGEAX_BROWSER_HEADLESS=0 pnpm -F @forgeax/multiplayer-snake e2e:browser

  # Keep the required `vitest-browser` context stable while the four real
  # browser producers and the dedicated CSM producer run concurrently. A
  # failed producer is projected as a failed required check; intentional
  # post-merge skips remain successful.
  vitest-browser:
    name: vitest-browser
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "standard"]') }}
    needs: [build-artifacts, post-merge-gate, vitest-browser-shard, directional-csm-browser]
    if: always()
    permissions:
      actions: read
      contents: read
    timeout-minutes: 5
    steps:
      - name: Report browser matrix result
        if: |
          needs.build-artifacts.result == 'success' &&
          ! (needs.post-merge-gate.result == 'success' && needs.post-merge-gate.outputs.skip_checks == 'true')
        run: |
          test "${{ needs.vitest-browser-shard.result }}" = success
          test "${{ needs.directional-csm-browser.result }}" = success

  # The shared-inputs browser probe has a distinct falsification contract from
  # Vitest: it boots preview output, fetches the generated catalog/manifest,
  # then proves a real Vite HMR update reaches the browser. Keep that slow
  # dev-server tail out of the Vitest job so the two browser contracts can run
  # concurrently without deleting either gate.
  shared-inputs-browser:
    name: shared-inputs-browser
    # The Vite preview/HMR probe retains the generated app graph while Chrome
    # is alive; the default Node heap exhausts before the browser assertions.
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "heavy"]') }}
    needs: [build-artifacts, post-merge-gate]
    if: |
      always() &&
      needs.build-artifacts.result == 'success' &&
      ! (needs.post-merge-gate.result == 'success' && needs.post-merge-gate.outputs.skip_checks == 'true')
    permissions:
      actions: read
      contents: read
    # Immutable build-artifact hydration transfers several app/core archives
    # before the preview/HMR probe can start; the transfer is part of the job
    # budget on a cold self-hosted runner.
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=10240
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: recursive
          token: ${{ secrets.GHA }}

      - name: Prepare XDG runtime directory
        uses: ./.github/actions/prepare-xdg-runtime

      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify heavy runner capacity
        run: node scripts/ci/verify-runner-pool-capacity.mjs --pool heavy

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Hydrate immutable build artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.build-artifacts.outputs.artifact_ids_shared_inputs_browser }}" --path .

      - name: Hydrate immutable shared app inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.build-artifacts.outputs.shared_artifact_id }}"
          --path shared-app-inputs-transfer

      - name: Unpack immutable shared app inputs
        run: node scripts/ci/unpack-shared-app-inputs.mjs --root .

      - name: Verify artifact inputs
        run: >-
          node scripts/ci/verify-build-artifact-input.mjs
          --consumer shared-inputs-browser --root .
          --shared-input-manifest shared-app-inputs/manifest.json
          --shared-input-mode catalog-only
          --input-fingerprint "${{ needs.build-artifacts.outputs.shared_input_fingerprint }}"

      - name: Install Mesa Vulkan (lavapipe software path for Chrome WebGPU)
        uses: ./.github/actions/install-mesa-vulkan-drivers
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}

      - name: Install Playwright Chrome Beta
        uses: ./.github/actions/install-playwright-chrome-beta
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}

      - name: Detect lavapipe ICD
        run: |
          set -e
          ICD_PATH=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "Detected ICD: $ICD_PATH"
          echo "VK_ICD_FILENAMES=$ICD_PATH" >> $GITHUB_ENV
          echo "VK_DRIVER_FILES=$ICD_PATH" >> $GITHUB_ENV

      - name: Blending shared-inputs preview/HMR probe
        env:
          FORGEAX_CHROME_CHANNEL: chrome-beta
          FORGEAX_BROWSER_HEADLESS: '0'
          FORGEAX_SHARED_APP_INPUTS_MANIFEST: ${{ github.workspace }}/shared-app-inputs/manifest.json
        run: xvfb-run -a pnpm --filter @forgeax/app-learn-render-4-advanced-opengl-3-blending smoke:shared-inputs-browser

      # M5 UI authoring dogfood: the independent host validates, repairs,
      # previews both scenarios, and checks deterministic capture evidence.
      - name: UI authoring preview/capture probe
        env:
          FORGEAX_CHROME_CHANNEL: chrome-beta
        # Use the same headed Chrome Beta + lavapipe contract as the other
        # positive WebGPU probes. Headless GPU-process teardown can make the
        # preview app fall back to its default catalog before authoring starts.
        run: xvfb-run -a env FORGEAX_BROWSER_HEADLESS=0 pnpm --filter @forgeax/preview smoke:ui-authoring

      # Every directory under engine/templates is a real browser smoke:
      # start the Preview host, boot the template, and fail on page errors,
      # unexpected console errors, bad responses, or renderer/inspection
      # failures and rejects a game-3d canvas that only presents the clear
      # color after a healthy-looking frame submission. Keep it on the same
      # Chrome Beta + lavapipe path as the Vitest browser gate. Headed Chrome
      # under Xvfb avoids Chromium's headless GPU-process teardown on lavapipe.
      - name: engine templates Preview browser smoke (render + console gate)
        env:
          FORGEAX_CHROME_CHANNEL: chrome-beta
        run: xvfb-run -a env FORGEAX_BROWSER_HEADLESS=0 pnpm --filter @forgeax/preview smoke:templates

  # Capability coverage and the production performance verdict are one owner,
  # but they are not part of the shared-input/HMR contract above. Keep this
  # independent so a benchmark regression is attributed to the benchmark and
  # both browser gates can execute concurrently.
  multithread-browser-benchmark:
    name: multithread-browser-benchmark
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "heavy"]') }}
    needs: [build-artifacts, post-merge-gate]
    if: |
      always() &&
      needs.build-artifacts.result == 'success' &&
      ! (needs.post-merge-gate.result == 'success' && needs.post-merge-gate.outputs.skip_checks == 'true')
    permissions:
      actions: read
      contents: read
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: recursive
          token: ${{ secrets.GHA }}

      - name: Prepare XDG runtime directory
        uses: ./.github/actions/prepare-xdg-runtime

      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify heavy runner capacity
        run: node scripts/ci/verify-runner-pool-capacity.mjs --pool heavy

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Hydrate immutable build artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.build-artifacts.outputs.artifact_ids_multithread_browser_benchmark }}" --path .

      # App shards carry compact shader deltas. Restore the one shared engine
      # manifest before any benchmark-side app dist is inspected.
      - name: Hydrate immutable shared app inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.build-artifacts.outputs.shared_artifact_id }}"
          --path shared-app-inputs-transfer

      - name: Unpack immutable shared app inputs
        run: node scripts/ci/unpack-shared-app-inputs.mjs --root .

      - name: Materialize shared app shader manifests
        timeout-minutes: 2
        run: >-
          node scripts/ci/materialize-app-shader-manifests.mjs
          --root . --shared-input-manifest shared-app-inputs/manifest.json

      - name: Verify artifact inputs
        run: >-
          node scripts/ci/verify-build-artifact-input.mjs
          --consumer multithread-browser-benchmark --root .

      - name: Install Mesa Vulkan (lavapipe software path for Chrome WebGPU)
        uses: ./.github/actions/install-mesa-vulkan-drivers
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}

      - name: Install Playwright Chrome Beta
        uses: ./.github/actions/install-playwright-chrome-beta
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}

      - name: Detect lavapipe ICD
        run: |
          set -e
          ICD_PATH=$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)
          echo "Detected ICD: $ICD_PATH"
          echo "VK_ICD_FILENAMES=$ICD_PATH" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$ICD_PATH" >> "$GITHUB_ENV"

      - name: Web TypeScript multithread capability, smoke, and production benchmark
        env:
          FORGEAX_CHROME_CHANNEL: chrome-beta
          FORGEAX_BROWSER_HEADLESS: 0
        run: |
          run_browser() {
            node scripts/ci/run-with-runner-cpu-affinity.mjs -- "$@"
          }
          pnpm --filter @forgeax/hello-multithreaded-execution m0:self-test
          run_browser xvfb-run -a node apps/hello/multithreaded-execution/m0/scripts/run-capability-matrix.mjs --browser=chrome
          run_browser xvfb-run -a node apps/hello/multithreaded-execution/m0/scripts/run-raw-kernel.mjs
          run_browser node scripts/ci/run-browser-gate-with-retry.mjs \
            --mode=multithread-smoke \
            -- \
            xvfb-run -a pnpm --filter @forgeax/hello-multithreaded-execution smoke:browser
          run_browser node scripts/ci/run-browser-gate-with-retry.mjs \
            --mode=benchmark \
            -- \
            xvfb-run -a pnpm --filter @forgeax/hello-multithreaded-execution bench:production

  # feat-20260623-ci-time-cut-smoke-fleet-split: the dawn-node smoke fleet
  # (~50 headless smokes + Mesa install + smoke coverage gate, ~6m serial) was
  # extracted from primary-pnpm into this standalone job. It is the largest
  # segment of primary-pnpm (~60%) yet depends only on build-output (download),
  # not on coverage/lint, so running it in parallel removes it from the critical
  # path build-artifacts -> primary-pnpm. Skeleton mirrors vitest-dawn:
  # checkout / pnpm / node / install / download build-output, then the moved
  # smoke block (which carries its own Mesa Vulkan install). sticky-comment
  # needs: includes it so a red smoke row stays visible in the PR check list
  # (same shape as the vitest-browser / vitest-dawn / webkit-fallback splits).
  smoke-fleet:
    name: smoke-fleet-${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "heavy"]') }}
    needs: [build-artifacts, post-merge-gate]
    if: |
      always() &&
      needs.build-artifacts.result == 'success' &&
      ! (needs.post-merge-gate.result == 'success' && needs.post-merge-gate.outputs.skip_checks == 'true')
    permissions:
      actions: read
      contents: read
    timeout-minutes: 60
    env:
      CACHE_RUNNER_SCOPE: self-hosted-ubuntu-linux-x64
      SMOKE_MIN_FRAMES: 300
      SMOKE_DURATION_MS: 5000
      DAWN_SMOKE_ENTRY_TIMEOUT_MS: 300000
    steps:
      - name: Scrub stale global/system git auth header (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          git config --global --unset-all http."https://github.com/".extraheader || true
          sudo git config --system --unset-all http."https://github.com/".extraheader || true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          submodules: recursive
          token: ${{ secrets.GHA }}

      - name: Prepare XDG runtime directory
        uses: ./.github/actions/prepare-xdg-runtime

      - name: Read pnpm version
        id: pnpm-version
        run: echo "value=$(cat .pnpm-version)" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.value }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify heavy runner capacity
        run: node scripts/ci/verify-runner-pool-capacity.mjs --pool heavy

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare Dawn device-limit normalization
        uses: ./.github/actions/prepare-dawn-device-limits

      - name: Hydrate immutable build artifacts
        timeout-minutes: 50
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.build-artifacts.outputs.artifact_ids_smoke_fleet }}" --path .

      - name: Hydrate immutable shared app inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/download-artifact-with-retry.mjs
          --artifact-ids "${{ needs.build-artifacts.outputs.shared_artifact_id }}"
          --path shared-app-inputs-transfer

      - name: Unpack immutable shared app inputs
        run: node scripts/ci/unpack-shared-app-inputs.mjs --root .

      # App shards omit the byte-identical engine shader manifest from each
      # transfer archive. Rehydrate the one shared copy before the smoke
      # verifier and before any demo can read its app-local manifest path.
      - name: Materialize shared app shader manifests
        timeout-minutes: 2
        run: >-
          node scripts/ci/materialize-app-shader-manifests.mjs
          --root . --shared-input-manifest shared-app-inputs/manifest.json
          --app-root apps/hello
          --app-root apps/learn-render
          --app-root apps/shadertoy
          --app-root apps/collectathon

      - name: Build hello-taa smoke consumer
        if: matrix.group == 3
        run: pnpm --filter @forgeax/hello-taa build

      - name: Verify artifact inputs
        timeout-minutes: 2
        run: node scripts/ci/verify-build-artifact-input.mjs --consumer smoke-fleet --root .

      - name: Install Mesa Vulkan (lavapipe software path for dawn-node)
        timeout-minutes: 5
        uses: ./.github/actions/install-mesa-vulkan-drivers
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}

      # Groups 0/1/3 contain browser smoke producers (M7/custom-shader,
      # authorized M4 re-entry, and TAA). Reuse the pinned Chrome Beta path
      # used by the standalone browser jobs instead of assuming the runner has
      # a system `chrome` binary.
      - name: Install Playwright Chrome Beta (browser smoke carriers)
        if: matrix.group != 2
        uses: ./.github/actions/install-playwright-chrome-beta
        with:
          cache-scope: ${{ env.CACHE_RUNNER_SCOPE }}

      - name: Detect lavapipe ICD (browser smoke carriers)
        if: matrix.group != 2
        run: |
          set -e
          ICD_PATH=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "Detected ICD: $ICD_PATH"
          echo "VK_ICD_FILENAMES=$ICD_PATH" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$ICD_PATH" >> "$GITHUB_ENV"

      - name: Run authoritative Dawn roster shard
        timeout-minutes: 45
        # The roster is the owner for the gates that are not already explicit
        # smoke-fleet steps. Workflow-owned direct Dawn gates remain declared
        # for conservation, but are marked independent in the roster so they
        # are not executed a second time here.
        # Legacy smoke producers without a canonical receipt remain BLOCKED in
        # the report and are never promoted to pass. Any non-zero runnable
        # smoke remains a hard failure.
        run: >-
          node scripts/ci/run-dawn-smoke-roster.mjs --run
          --shard-index ${{ matrix.group }} --shard-count 4
          --allow-blocked
          --expected-product-sha "$EXPECTED_PRODUCT_SHA"
          --report artifacts/renderer-device-loss/smoke-roster/shard-${{ matrix.group }}.json

      # Browser device-loss evidence is independent from the direct-Dawn roster.
      - name: Hello-m7-backend-recovery device-loss smoke
        if: matrix.group == 0
        env:
          FORGEAX_CHROME_CHANNEL: chrome-beta
        # AC-19 is explicitly authorized to remain BLOCKED when the browser
        # driver cannot produce evidence. The wrapper is fail-closed for all
        # other failures and keeps the underlying command visible here.
        run: >-
          node scripts/ci/run-authorized-m7-smoke.mjs --allow-blocked --
          pnpm --filter @forgeax/hello-m7-backend-recovery smoke

      - name: Upload M7 device-loss evidence
        if: always() && matrix.group == 0
        uses: actions/upload-artifact@v4
        with:
          name: renderer-device-loss-m7-${{ matrix.group }}
          path: artifacts/renderer-device-loss/m7-device-loss/
          if-no-files-found: warn
          retention-days: 7

      # Skin writeback is an independent gate; it must not disappear behind
      # the direct-Dawn shard invocation.
      - name: Hello-skin writeback smoke
        if: matrix.group == 0
        run: pnpm --filter @forgeax/hello-skin smoke:writeback

      - name: Hello-custom-shader composite smoke
        if: matrix.group == 0
        env:
          FORGEAX_CHROME_CHANNEL: chrome-beta
          FORGEAX_BROWSER_HEADLESS: '0'
        run: xvfb-run -a pnpm --filter @forgeax/hello-custom-shader smoke:all

      - name: Learn-render framebuffers Dawn smoke
        if: matrix.group == 1
        # Keep the concrete Dawn producer hard-fail. Browser/re-entry evidence
        # has its own explicit browser owner below.
        run: pnpm --filter @forgeax/app-learn-render-4-advanced-opengl-5-framebuffers smoke

      - name: Learn-render framebuffers M4 reentry_m4_t2 browser evidence
        if: matrix.group == 1
        # This is the real browser-WebGPU capture/replay and same-page
        # recovery gate. Run headed under Xvfb: headless Chromium is the
        # observed source of Dawn's invalid external-Instance lifetime.
        env:
          FORGEAX_CHROME_CHANNEL: chrome-beta
        timeout-minutes: 10
        run: >-
          xvfb-run -a env FORGEAX_BROWSER_HEADLESS=0
          node scripts/ci/run-browser-gate-with-retry.mjs
          --mode=rhi-debug --
          pnpm --filter @forgeax/app-learn-render-4-advanced-opengl-5-framebuffers smoke:browser

      - name: Learn-render framebuffers M4 reentry_m4_t3 live evidence
        # This Chrome/WebGPU live probe is currently an environment-level
        # external-Instance failure on the shared Linux software-GPU pool. It
        # is retained as an explicit manual diagnostic, not a PR gate. It is
        # still fail-closed when requested, so a broken live path is visible.
