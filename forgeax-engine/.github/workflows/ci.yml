      #   the gltf feat lands. Stdlib python; no extra dependency.
      - name: Image meta alignment gate (NEW)
        run: python3 scripts/check_image_meta_alignment.py

      # AC-06 RenderSystem record opaque-order-zero-material
      # reverse-grep gate (bug-20260522-per-entity-material-texture-binding
      # D-3), banning validatedOrdered[0]?.source.material global material
      # resolution + shared materialBindGroup variable. Zero npm deps;
      # exit 1 fails CI.
      - name: AC-06 per-entity material texture binding grep gate
        run: node scripts/forgeax/check-render-record-no-opaque-order-zero-material.mjs

      # feat-20260517-merge-mesh-renderer-material-renderer M3 / w8 reverse-grep
      # gate. Bans direct MaterialAsset registry lookups + structural casts in
      # render-system-record.ts (orthogonal to bug-20260522's AC-07 fallback
      # semantics — the gates share a render-system-record.ts target file but
      # enforce different invariants). Zero npm deps; exit 1 fails CI.
      - name: feat-20260517 reverse-grep gate (record material-asset-get)
        run: node scripts/forgeax/check-render-record-no-material-asset-get.mjs

      # AC-09 single-exit gate
      # (feat-20260514-ecs-managed-buffer-and-resource-handles M6 / w22,
      #  extended by feat-20260514-ecs-children-instances-managed-buffer-array
      #  M4 / w17 to cover FixedArrayView / VarArrayView):
      #   single-exit: gated @forgeax/engine-ecs symbols (Handle, SchemaFieldType,
      #     ManagedRefStore, EcsErrorCode, EcsErrorDetail, EcsError,
      #     FixedArrayView, VarArrayView) re-exported only from packages/ecs —
      #     no other package may smuggle them through its own barrel
      #     (charter proposition 1: one obvious import path).
      #
      # Note: the previous OOS-05 instances-oos gate
      # (packages/ecs/scripts/check-instances-oos.mjs) was retired by
      # feat-20260514-ecs-children-instances-managed-buffer-array M3 / w14
      # — Instances.buffer was lifted to the ECS-managed `array<f32>` path
      # (transforms field) so the OOS-05 freeze contract no longer applies.
