name: Setup wasm-pack with bounded retry
description: Reuse a runner-local wasm-pack binary and retry transient release transport errors.
inputs:
  version:
    description: wasm-pack release version.
    required: false
    default: '0.14.0'
runs:
  using: composite
  steps:
    - name: Install or reuse wasm-pack
      shell: bash
      env:
        WASM_PACK_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        dir="$RUNNER_TEMP/wasm-pack-${WASM_PACK_VERSION}"
        archive="$RUNNER_TEMP/wasm-pack-${WASM_PACK_VERSION}.tar.gz"
        if [ ! -x "$dir/wasm-pack" ]; then
          curl_retry_args=(--fail --location --retry 8 --retry-connrefused --retry-delay 2
            --connect-timeout 20 --max-time 180)
          if curl --help all 2>/dev/null | grep -q -- '--retry-all-errors'; then
            curl_retry_args+=(--retry-all-errors)
          fi
          for attempt in 1 2 3; do
            if curl "${curl_retry_args[@]}" \
              "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
              --output "$archive"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "[wasm-pack] release download failed after 3 attempts" >&2
              exit 1
            fi
            echo "[wasm-pack] release download failed (attempt ${attempt}/3); retrying" >&2
            sleep $((attempt * 3))
          done
          rm -rf "$dir"
          mkdir -p "$dir"
          tar -xzf "$archive" -C "$dir" --strip-components=1
        else
          echo "[wasm-pack] reusing $dir/wasm-pack"
        fi
        "$dir/wasm-pack" --version
        echo "$dir" >> "$GITHUB_PATH"
