name: Setup Rust toolchain with bounded retry
description: Reuse a runner-local Rust install and retry only the missing network hydration.
inputs:
  toolchain:
    description: Rust toolchain channel or version to install.
    required: true
  targets:
    description: Comma-separated rustup targets to install.
    required: false
    default: ''
  components:
    description: Comma-separated rustup components to install.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install or reuse Rust toolchain
      shell: bash
      env:
        RUST_TOOLCHAIN: ${{ inputs.toolchain }}
        RUST_TARGETS: ${{ inputs.targets }}
        RUST_COMPONENTS: ${{ inputs.components }}
      run: |
        set -euo pipefail

        cargo_home="${CARGO_HOME:-$HOME/.cargo}"
        rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
        export CARGO_HOME="$cargo_home"
        export RUSTUP_HOME="$rustup_home"
        export PATH="$CARGO_HOME/bin:$PATH"
        mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
        echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
        echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

        curl_retry_args=(--fail --location --retry 8 --retry-connrefused --retry-delay 2
          --connect-timeout 20 --max-time 180)
        if curl --help all 2>/dev/null | grep -q -- '--retry-all-errors'; then
          curl_retry_args+=(--retry-all-errors)
        fi

        retry() {
          local label="$1"
          shift
          local attempt
          for attempt in 1 2 3; do
            if "$@"; then
              return 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "[rust-toolchain] ${label} failed (attempt ${attempt}/3); retrying" >&2
              sleep $((attempt * 3))
            fi
          done
          echo "[rust-toolchain] ${label} failed after 3 attempts" >&2
          return 1
        }

        if ! command -v rustup >/dev/null 2>&1; then
          installer="$(mktemp "$RUNNER_TEMP/rustup-init.XXXXXX")"
          trap 'rm -f "$installer"' EXIT
          retry 'rustup bootstrap download' curl "${curl_retry_args[@]}" \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
            --output "$installer"
          chmod +x "$installer"
          "$installer" --default-toolchain none -y
        fi

        toolchain_args=("$RUST_TOOLCHAIN" --profile minimal --no-self-update)
        if [ -n "$RUST_TARGETS" ]; then
          IFS=',' read -r -a targets <<< "$RUST_TARGETS"
          for target in "${targets[@]}"; do
            toolchain_args+=(--target "$target")
          done
        fi
        if [ -n "$RUST_COMPONENTS" ]; then
          IFS=',' read -r -a components <<< "$RUST_COMPONENTS"
          for component in "${components[@]}"; do
            toolchain_args+=(--component "$component")
          done
        fi

        if ! rustup toolchain list | awk '{print $1}' | grep -q "^${RUST_TOOLCHAIN}(-|$)"; then
          retry "Rust ${RUST_TOOLCHAIN} download" env RUSTUP_MAX_RETRIES=10 \
            rustup toolchain install "${toolchain_args[@]}"
        else
          echo "[rust-toolchain] reusing installed ${RUST_TOOLCHAIN}"
        fi

        if [ -n "$RUST_TARGETS" ]; then
          IFS=',' read -r -a targets <<< "$RUST_TARGETS"
          for target in "${targets[@]}"; do
            if ! rustup target list --toolchain "$RUST_TOOLCHAIN" | grep -q "^${target} (installed)$"; then
              retry "Rust ${RUST_TOOLCHAIN}/${target} download" env RUSTUP_MAX_RETRIES=10 \
                rustup target add --toolchain "$RUST_TOOLCHAIN" "$target"
            fi
          done
        fi

        if [ -n "$RUST_COMPONENTS" ]; then
          IFS=',' read -r -a components <<< "$RUST_COMPONENTS"
          for component in "${components[@]}"; do
            if ! rustup component list --toolchain "$RUST_TOOLCHAIN" | grep -q "^${component}.*(installed)$"; then
              retry "Rust ${RUST_TOOLCHAIN}/${component} download" env RUSTUP_MAX_RETRIES=10 \
                rustup component add --toolchain "$RUST_TOOLCHAIN" "$component"
            fi
          done
        fi

        rustup default "$RUST_TOOLCHAIN"
        rustc +"$RUST_TOOLCHAIN" --version --verbose
