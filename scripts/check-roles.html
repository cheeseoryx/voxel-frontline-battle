<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<!-- base href="/" 是必须的：本页位于 /scripts/ 下，而 js/soldier-voxel.js 以相对路径
     加载 assets/characters/*.glb；没有 base 时它们会解析到 /scripts/assets/ 而 404。 -->
<base href="/" />
<title>check-roles harness</title>
<style>html,body{margin:0;background:#16202a}canvas{display:block}</style>
</head>
<body>
<canvas id="stage" width="480" height="640"></canvas>
<script src="../js/vendor/three.gltf.global.js"></script>
<script src="../js/soldier.js"></script>
<script src="../js/soldier-voxel.js"></script>
<script>
/* 组件级测试页：不经过游戏 UI，直接驱动 VF.SoldierVoxel 渲染单个角色。
 * window.RolesCheck 由 scripts/check-roles.js 调用。 */
(function () {
  const canvas = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(480, 640, false);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x16202a);
  scene.add(new THREE.AmbientLight(0x99aabb, 0.9));
  const key = new THREE.DirectionalLight(0xfff0dd, 1.3);
  key.position.set(2, 6, 4);
  scene.add(key);
  const cam = new THREE.PerspectiveCamera(38, 480 / 640, 0.1, 40);
  cam.position.set(0, 1.1, 3.2);
  cam.lookAt(0, 0.95, 0);

  let model = null;

  const ARM_BONE = 'Bip001-L-UpperArm';

  // classId = 'assault' | 'engineer' | 'recon' | 'support'；
  // 传 'box' 时用 voxel:false 强制走程序化盒子兵作为对照。
  function render(classId, driveState, opts) {
    if (model) { scene.remove(model); model = null; }
    model = classId === 'box'
      ? VF.Soldier.createClassSoldier('assault', { team: 'ally', voxel: false })
      : VF.Soldier.createClassSoldier(classId, { team: 'ally' });
    if (!model) return { ok: false, reason: 'create returned null' };
    model.rotation.y = Math.PI; // 面向镜头
    scene.add(model);
    if (opts && opts.noDrive) {
      // 不驱动：验证 create() 自身是否已将骨架推离绑定姿势
    } else if (driveState) {
      // 模拟 1.5 秒移动，推进动画状态机
      for (let i = 0; i < 90; i++) {
        VF.Soldier.updateLocomotion(model, 1 / 60, driveState);
      }
    } else {
      VF.Soldier.updateLocomotion(model, 1 / 60, { moving: false, speedRatio: 0, onGround: true });
    }
    renderer.render(scene, cam);
    const skinned = [];
    model.traverse((o) => { if (o.isSkinnedMesh) skinned.push(o.name || '(unnamed)'); });
    const armBone = model.getObjectByName(ARM_BONE);
    const armQuat = armBone
      ? [armBone.quaternion.x, armBone.quaternion.y, armBone.quaternion.z, armBone.quaternion.w]
      : null;
    return {
      ok: true,
      name: model.name,
      skinnedMeshes: skinned.length,
      hasWeapon: !!model.getObjectByName('Weapon'),
      hasMarker: !!model.getObjectByName('TeamMarker'),
      armQuat: armQuat,
    };
  }

  /** 从 FRESH GLTFLoader 独立加载得到绑定姿势的骨骼四元数（不经过 mixer）。 */
  function bindQuat(modelFile, boneName) {
    return new Promise((resolve, reject) => {
      const loader = new THREE.GLTFLoader();
      loader.load(
        'assets/characters/' + modelFile,
        (gltf) => {
          const bone = gltf.scene.getObjectByName(boneName);
          if (!bone) { resolve(null); return; }
          resolve([bone.quaternion.x, bone.quaternion.y, bone.quaternion.z, bone.quaternion.w]);
        },
        undefined,
        (err) => reject(err)
      );
    });
  }

  window.RolesCheck = {
    preloadAll: () => VF.SoldierVoxel.preloadAll(),
    classIds: () => VF.SoldierVoxel.CLASS_IDS.slice(),
    render,
    bindQuat,
  };
})();
</script>
</body>
</html>
