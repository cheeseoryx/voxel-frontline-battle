<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<!-- base href="/" 必须：本页在 /scripts/ 下，GLB 按相对 assets/ 解析 -->
<base href="/" />
<title>check-ai-armed harness</title>
<style>
  html,body{margin:0;background:#1b2430}
  #wrap{position:relative;width:1500px;height:520px}
  #wrap canvas{position:absolute;left:0;top:0;display:block}
  #gl{z-index:1}
  #lbl{z-index:2;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl" width="1500" height="520"></canvas>
  <canvas id="lbl" width="1500" height="520"></canvas>
</div>
<script src="../js/vendor/three.gltf.global.js"></script>
<script src="../js/weapon-models.js"></script>
<script src="../js/weapon-viewmodels.js"></script>
<script src="../js/weapon-catalog.js"></script>
<script src="../js/soldier.js"></script>
<script src="../js/soldier-voxel.js"></script>
<script>
/*
 * AI 持枪验证台。
 *
 * 左：站立持枪（Idle / AimIdle 姿势）
 * 中：持枪跑（RifleRun）
 * 右：正面视角，看枪口是否指向角色正前方（-Z）
 *
 * 三个 viewport 各自 new 一个相机（共用一个改 lookAt 会让第二个沿用第一个朝向）。
 */
(function () {
  const glCanvas = document.getElementById('gl');
  const lblCanvas = document.getElementById('lbl');
  const renderer = new THREE.WebGLRenderer({
    canvas: glCanvas, antialias: true, preserveDrawingBuffer: true,
  });
  renderer.setSize(1500, 520, false);
  renderer.setScissorTest(true);


  const W = 300;
  const H = 520;
  const VIEWS = 5;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1b2430);
  scene.add(new THREE.HemisphereLight(0xdfeaff, 0x2a3340, 1.2));
  const key = new THREE.DirectionalLight(0xfff2e0, 1.6);
  key.position.set(1.5, 3, 2);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x88aaff, 0.9);
  rim.position.set(-3, 1.5, -2);
  scene.add(rim);

  let roots = [];
  let lastInfo = {};

  function clearRoots() {
    roots.forEach(function (r) { if (r.parent) r.parent.remove(r); });
    roots = [];
  }

  function drawLabels(title) {
    const ctx = lblCanvas.getContext('2d');
    ctx.clearRect(0, 0, W * VIEWS, 520);
    ctx.fillStyle = '#9fb3c8';
    ctx.font = '13px sans-serif';
    ctx.fillText(title, 8, 18);
    ctx.fillStyle = '#7fd1ff';
    ctx.fillText('① 站立持枪（斜前）', 12, 508);
    ctx.fillText('② 持枪跑（斜前）', W + 12, 508);
    ctx.fillText('③ 正面（枪口朝相机）', W * 2 + 12, 508);
    ctx.fillText('④ 背后视角（玩家所见）', W * 3 + 12, 508);
    ctx.fillText('⑤ 右手特写', W * 4 + 12, 508);
    ctx.strokeStyle = '#2b3a4a';
    ctx.beginPath();
    for (let i = 1; i < VIEWS; i++) {
      ctx.moveTo(W * i, 0);
      ctx.lineTo(W * i, 520);
    }
    ctx.stroke();
  }

  window.__boot = null;

  async function init() {
    const boot = {
      hasTHREE: !!window.THREE,
      hasWM: !!(window.VF && window.VF.WeaponModels),
      hasSoldier: !!(window.VF && window.VF.Soldier),
      hasVoxel: !!(window.VF && window.VF.SoldierVoxel),
    };
    window.__boot = boot;
    if (!boot.hasVoxel) {
      window.__ready = true;
      return;
    }
    try {
      await window.VF.SoldierVoxel.preloadAll();
    } catch (_) {}
    boot.voxelReady = !!(
      window.VF.SoldierVoxel.isReady && window.VF.SoldierVoxel.isReady('assault')
    );
    const V = window.VF.SoldierVoxel;
    boot.hasDriveArmed = !!(V && V.driveArmed);
    boot.clipKeys = V && V.CLIP ? Object.keys(V.CLIP) : [];
    window.__boot = boot;
    window.__ready = true;
  }

  /** 列出模型里所有 Dummy* 挂点，便于确认右手骨骼名 */
  window.AIArmed = {};

  /**
   * 枪在几个持枪姿势下的世界朝向。
   * 枪口方向 = gun 局部 -Z 在世界里的方向（buildProp 的枪口统一朝 -Z）。
   * 期望：在 aimIdle / rifleRun 各帧都大致指向 (0, 小, -1)——即角色正前方。
   */
  window.AIArmed.probeGun = async function (id) {
    const M = window.VF.WeaponModels;
    await M.preloadAll();
    const r = window.VF.SoldierVoxel.create('assault', {
      team: 'ally', weaponId: id, armed: true,
    });
    if (!r) return { error: 'create null' };
    scene.add(r);
    const V = window.VF.SoldierVoxel;
    const rows = [];

    // 必须走 driveArmed 推进：朝向是每帧在 _alignHandGun 里锁的，
    // 手动 mixer.update 测到的是 create 那次的对齐结果，不是运行时状态。
    function sample(label, state, steps) {
      for (let i = 0; i < steps; i++) {
        V.driveArmed(r, 0.016, state);
      }
      r.updateMatrixWorld(true);
      const hand = r.getObjectByName('Dummy001_R-Hand');
      const gun = hand
        ? hand.getObjectByName('ViewGun') || hand.getObjectByName('Weapon')
        : null;
      if (!gun) { rows.push({ clip: label, gun: false }); return; }
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(
        gun.getWorldQuaternion(new THREE.Quaternion())
      );
      const mp = gun.getObjectByName('Muzzle');
      const mw = mp ? mp.getWorldPosition(new THREE.Vector3()) : null;
      const cur = r.userData.glbAnim.current;
      rows.push({
        clip: label,
        playing: cur ? cur.getClip().name : null,
        dir: [dir.x, dir.y, dir.z].map(function (n) { return Number(n.toFixed(2)); }),
        muzzle: mw ? [mw.x, mw.y, mw.z].map(function (n) { return Number(n.toFixed(2)); }) : null,
      });
    }

    // 站立 → 跑 → 静止，各取几个时间点
    sample('idle+0.3s', { moving: false, speedRatio: 0, onGround: true }, 20);
    sample('idle+0.6s', { moving: false, speedRatio: 0, onGround: true }, 20);
    for (let i = 0; i < 6; i++) {
      sample('run+' + ((i + 1) * 0.15).toFixed(2) + 's',
        { moving: true, speedRatio: 1, onGround: true }, 9);
    }
    // 角色转 90°（AI 会转向），枪口应跟着转，仍是"角色正前方"
    r.rotation.y = Math.PI / 2;
    r.updateMatrixWorld(true);
    sample('turn90 idle', { moving: false, speedRatio: 0, onGround: true }, 12);
    r.rotation.y = 0;
    r.updateMatrixWorld(true);

    if (r.parent) r.parent.remove(r);
    return { id: id, rows: rows };
  };

  window.AIArmed.probe = function () {
    const root = window.VF.SoldierVoxel.create('assault', { team: 'ally' });
    if (!root) return { error: 'create 返回 null（模型没就绪）' };
    const dummies = [];
    root.traverse(function (o) {
      if (o.name.indexOf('Dummy') === 0 || /Hand/i.test(o.name)) dummies.push(o.name);
    });
    // R-Hand 在 Idle 与 RifleRun 下的世界变换
    const out = { dummies: dummies, poses: {} };
    const a = root.userData.glbAnim;
    const V = window.VF.SoldierVoxel;
    ['Idle', 'RifleRun', 'AimIdle', 'Run'].forEach(function (clip) {
      if (!a.actions[clip]) { out.poses[clip] = null; return; }
      Object.keys(a.actions).forEach(function (k) { a.actions[k].stop(); });
      const act = a.actions[clip];
      act.reset();
      act.setLoop(THREE.LoopRepeat, Infinity);
      act.play();
      a.current = act;
      a.mixer.update(0.2);
      root.updateMatrixWorld(true);
      const hand = root.getObjectByName('Dummy001_R-Hand');
      if (!hand) { out.poses[clip] = 'no-hand'; return; }
      const p = new THREE.Vector3();
      const q = new THREE.Quaternion();
      hand.getWorldPosition(p);
      hand.getWorldQuaternion(q);
      const e = new THREE.Euler().setFromQuaternion(q, 'XYZ');
      out.poses[clip] = {
        pos: [p.x, p.y, p.z].map(function (n) { return Number(n.toFixed(3)); }),
        euler: [e.x, e.y, e.z].map(function (n) { return Number(n.toFixed(3)); }),
      };
    });
    return out;
  };

  /**
   * 渲染三个视角。
   * @param {string} id 武器 id
   * @param {object} opts { t: 动画推进秒数, moving: 是否跑 }
   */
  window.AIArmed.render = async function (id, opts) {
    opts = opts || {};
    const M = window.VF.WeaponModels;
    if (!M || !window.VF.SoldierVoxel) return { ok: false, reason: '依赖未就绪' };
    await M.preloadAll();
    if (!M.has(id)) return { ok: false, reason: '没有 ' + id + ' 的美术资产' };

    clearRoots();

    function makeRoot(moving) {
      const r = window.VF.SoldierVoxel.create('assault', {
        team: 'enemy',
        weaponId: id,
        armed: true,
      });
      if (!r) return null;
      scene.add(r);
      r.updateMatrixWorld(true);
      const a = r.userData.glbAnim;
      // 手动推进到某个姿势：armed 角色的 locomotion 由 drive/driveArmed 管
      const t = opts.t != null ? opts.t : 0.2;
      for (let i = 0; i < Math.max(1, Math.round(t / 0.016)); i++) {
        const fn = window.VF.SoldierVoxel.driveArmed || window.VF.SoldierVoxel.drive;
        fn(r, 0.016, { moving: !!moving, speedRatio: moving ? 1 : 0, onGround: true });
      }
      r.updateMatrixWorld(true);
      return r;
    }

    const rIdle = makeRoot(false);
    const rRun = makeRoot(opts.moving !== false);
    roots = [rIdle, rRun].filter(Boolean);

    const info = { id: id, armed: [], muzzle: {} };
    roots.forEach(function (r) {
      const hand = r.getObjectByName('Dummy001_R-Hand');
      const gun = hand
        ? hand.getObjectByName('ViewGun') || hand.getObjectByName('Weapon')
        : null;
      // 背枪挂点是 Dummy001；armed 角色不该再有枪挂在那儿
      const backBone = r.getObjectByName('Dummy001');
      const backGun = backBone
        ? backBone.getObjectByName('ViewGun') || backBone.getObjectByName('Weapon')
        : null;
      info.armed.push({
        hand: !!hand,
        gun: !!gun,
        hasMesh: !!(gun && gun.getObjectByName('WeaponMesh')),
        back: !!backGun,
      });
      const m = gun && gun.getObjectByName('Muzzle');
      if (m) {
        const wp = m.getWorldPosition(new THREE.Vector3());
        const lp = r.worldToLocal(wp.clone());
        info.muzzle.world = [wp.x, wp.y, wp.z].map(function (n) { return Number(n.toFixed(3)); });
        info.muzzle.root = [lp.x, lp.y, lp.z].map(function (n) { return Number(n.toFixed(3)); });
      }
    });

    function shot(x, camPos, look, root) {
      renderer.setViewport(x, 0, W, H);
      renderer.setScissor(x, 0, W, H);
      const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 60);
      cam.position.set(camPos[0], camPos[1], camPos[2]);
      cam.lookAt(look[0], look[1], look[2]);
      cam.updateMatrixWorld(true);
      // 只画当前 root：其它先藏起来，避免三个角色叠在一起
      roots.forEach(function (r) { r.visible = false; });
      if (root) root.visible = true;
      renderer.render(scene, cam);
      if (root) root.visible = false;
      roots.forEach(function (r) { r.visible = true; });
    }

    // 角色正面朝世界 -Z（wrap.rotation.y = π），所以正面视角的相机要放在 -Z 一侧
    renderer.clear();
    shot(0, [-2.6, 1.5, -3.4], [0, 1.1, 0], rIdle); // 站立持枪（斜前）
    shot(W, [2.6, 1.5, -3.4], [0, 1.1, 0], rRun); // 持枪跑（斜前）
    shot(W * 2, [0.2, 1.35, -3.6], [0, 1.2, 0], rIdle); // 正面（枪口朝相机）
    // 玩家视角：在角色背后上方（世界 +Z 一侧），跑动中的样子
    shot(W * 3, [0.9, 2.1, 3.2], [0, 1.15, 0], rRun);

    // 右手特写：确认握把落在掌心、枪不穿手
    const handObj = rRun && rRun.getObjectByName('Dummy001_R-Hand');
    const hp = handObj
      ? handObj.getWorldPosition(new THREE.Vector3())
      : new THREE.Vector3(0.25, 1.0, -0.4);
    shot(
      W * 4,
      [hp.x + 0.85, hp.y + 0.5, hp.z - 1.15],
      [hp.x, hp.y - 0.02, hp.z - 0.12],
      rRun
    );

    lastInfo = info;
    drawLabels(
      id + '   持枪GLB=' + info.armed.map(function (a) { return a.hasMesh; }).join('/') +
        '   枪口(root)=' + JSON.stringify(info.muzzle.root || null)
    );
    return info;
  };

  window.AIArmed.last = function () { return lastInfo; };
  init();
})();
</script>
</body>
</html>
