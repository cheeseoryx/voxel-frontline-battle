<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<!-- base href="/" 必须：本页在 /scripts/ 下，资源按相对 assets/ 解析 -->
<base href="/" />
<title>check-weapons harness</title>
<style>
  html,body{margin:0;background:#1b2430}
  #wrap{position:relative;width:960px;height:380px}
  #wrap canvas{position:absolute;left:0;top:0;display:block}
  #gl{z-index:1}
  #lbl{z-index:2;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl" width="960" height="380"></canvas>
  <canvas id="lbl" width="960" height="380"></canvas>
</div>
<script src="../js/vendor/three.gltf.global.js"></script>
<script>
/*
 * 组件级验证页：加载 assets/weapons/*.glb，三个正交视角并排渲染。
 * 目的只有一个——确认「枪口朝 +Z 还是 -Z」「原点在模型的什么位置」。
 *
 * 视口1 侧视：相机在 +X，屏幕右 = 世界 -Z，屏幕左 = 世界 +Z
 * 视口2 顶视：相机在 +Y，屏幕上方 = 世界 -Z，屏幕右 = 世界 +X
 * 视口3 轴测：相机在 (+X,+Y,+Z)
 *
 * 图例：红=X 绿=Y 蓝=Z（AxesHelper，蓝轴指向 +Z）；黄球=模型原点(0,0,0)；
 *       绿框=包围盒；品红小球=按包围盒推测的枪口（长轴细端）。
 */
(function () {
  const glCanvas = document.getElementById('gl');
  const lblCanvas = document.getElementById('lbl');
  const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(960, 380, false);
  renderer.setScissorTest(true);

  const VIEWS = [
    { name: '侧视 (从+X看)  ← +Z | -Z →', w: 320, cam: (d) => ({ pos: [d, 0, 0], up: [0, 1, 0] }) },
    { name: '顶视 (从+Y看)  上=-Z', w: 320, cam: (d) => ({ pos: [0, d, 0], up: [0, 0, -1] }) },
    { name: '轴测 (+X+Y+Z)', w: 320, cam: (d) => ({ pos: [d * 0.7, d * 0.6, d * 0.7], up: [0, 1, 0] }) },
  ];

  /*
   * id → 文件。⚠️ 这里的键必须是 js/weapon-catalog.js 里的 weaponId。
   * Mod_* 是 2026-09-15 补的第二批（6 把步枪/战斗步枪），
   * 命名规则是枪的型号而不是 weaponId，所以映射得手写。
   */
  const FILES = {
    m249: 'assets/weapons/SM_M249_001.glb',
    mp5: 'assets/weapons/SM_MP5_001.glb',
    mp7: 'assets/weapons/SM_MP7_001.glb',
    p90: 'assets/weapons/SM_P90_001.glb',
    usp: 'assets/weapons/SM_USP_001.glb',
    acr: 'assets/weapons/Mod_ACR.glb',
    ak74: 'assets/weapons/Mod_AK_74.glb',
    hk419: 'assets/weapons/Mod_HK419.glb',
    m4a1: 'assets/weapons/Mod_M4A1.glb',
    mk14ebr: 'assets/weapons/Mod_MK14EBR.glb',
    scarh: 'assets/weapons/Mod_SCAR_H.glb',
  };

  const cache = {};
  const loader = new THREE.GLTFLoader();

  function load(url) {
    if (cache[url]) return cache[url];
    cache[url] = new Promise((resolve) => {
      loader.load(url, (g) => resolve({ ok: true, gltf: g }), undefined, (e) =>
        resolve({ ok: false, err: (e && e.message) || String(e) })
      );
    });
    return cache[url];
  }

  function objRadius(obj, axis) {
    // 沿 axis 分 12 段，返回两端各 3 段的平均最大半径（到轴线的距离）
    const box = new THREE.Box3().setFromObject(obj);
    const min = box.min, max = box.max;
    const center = new THREE.Vector3();
    box.getCenter(center);
    const span = max.getComponent(axis) - min.getComponent(axis);
    const o1 = (axis + 1) % 3, o2 = (axis + 2) % 3;
    const buckets = [];
    for (let i = 0; i < 12; i++) buckets.push(0);
    obj.traverse((o) => {
      if (!o.isMesh || !o.geometry) return;
      const pos = o.geometry.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        o.localToWorld(v);
        const t = (v.getComponent(axis) - min.getComponent(axis)) / (span || 1);
        const b = Math.min(11, Math.max(0, Math.floor(t * 12)));
        const d1 = v.getComponent(o1) - center.getComponent(o1);
        const d2 = v.getComponent(o2) - center.getComponent(o2);
        buckets[b] = Math.max(buckets[b], Math.sqrt(d1 * d1 + d2 * d2));
      }
    });
    const avg = (arr) => arr.reduce((s, x) => s + x, 0) / arr.length;
    return { neg: avg(buckets.slice(0, 3)), pos: avg(buckets.slice(-3)), buckets };
  }

  function drawLabels(title, info) {
    const ctx = lblCanvas.getContext('2d');
    ctx.clearRect(0, 0, 960, 380);
    ctx.fillStyle = '#ff6b8a';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText(title, 8, 20);
    ctx.font = '12px sans-serif';
    ctx.fillStyle = '#9fb3c8';
    ctx.fillText(info, 8, 38);
    let x = 0;
    VIEWS.forEach((v) => {
      ctx.fillStyle = '#7fd1ff';
      ctx.fillText(v.name, x + 8, 372);
      x += v.w;
    });
    ctx.fillStyle = '#ffd166';
    ctx.fillText('黄球=原点  绿框=包围盒  品红=推测枪口  红/绿/蓝轴=X/Y/Z', 330, 20);
  }

  async function render(id) {
    const url = FILES[id];
    if (!url) return { ok: false, reason: '未知 id: ' + id };
    const res = await load(url);
    if (!res.ok) return { ok: false, reason: res.err };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1b2430);
    scene.add(new THREE.HemisphereLight(0xdfeaff, 0x2a3340, 1.1));
    const key = new THREE.DirectionalLight(0xfff2e0, 1.6);
    key.position.set(3, 6, 4);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x88aaff, 0.7);
    rim.position.set(-4, 2, -3);
    scene.add(rim);

    const root = res.gltf.scene;
    scene.add(root);

    const box = new THREE.Box3().setFromObject(root);
    const size = new THREE.Vector3();
    box.getSize(size);
    let longAxis = 0;
    for (let k = 1; k < 3; k++) if (size.getComponent(k) > size.getComponent(longAxis)) longAxis = k;
    const maxDim = Math.max(size.x, size.y, size.z);
    const frustum = maxDim * 0.75;

    // 图元：坐标轴、原点球、包围盒
    const axes = new THREE.AxesHelper(maxDim * 0.8);
    scene.add(axes);
    const originBall = new THREE.Mesh(
      new THREE.SphereGeometry(maxDim * 0.035, 12, 8),
      new THREE.MeshBasicMaterial({ color: 0xffd166 })
    );
    scene.add(originBall);
    const boxHelper = new THREE.BoxHelper(root, 0x33ff99);
    scene.add(boxHelper);

    // 推测枪口：长轴的细端
    const rad = objRadius(root, longAxis);
    const muzzleNeg = rad.neg < rad.pos;
    const muzzlePos = new THREE.Vector3();
    box.getCenter(muzzlePos);
    muzzlePos.setComponent(longAxis, muzzleNeg ? box.min.getComponent(longAxis) : box.max.getComponent(longAxis));
    const muzzleBall = new THREE.Mesh(
      new THREE.SphereGeometry(maxDim * 0.03, 12, 8),
      new THREE.MeshBasicMaterial({ color: 0xff44dd })
    );
    muzzleBall.position.copy(muzzlePos);
    scene.add(muzzleBall);

    let x = 0;
    VIEWS.forEach((v) => {
      const cam = new THREE.OrthographicCamera(-frustum, frustum, frustum, -frustum, -50, 50);
      cam.position.set(v.cam(5).pos[0], v.cam(5).pos[1], v.cam(5).pos[2]);
      cam.up.set(v.cam(5).up[0], v.cam(5).up[1], v.cam(5).up[2]);
      cam.lookAt(0, 0, 0);
      cam.updateProjectionMatrix();
      renderer.setViewport(x, 0, v.w, 380);
      renderer.setScissor(x, 0, v.w, 380);
      renderer.render(scene, cam);
      x += v.w;
    });

    let tris = 0;
    let matCount = 0;
    const matSet = new Set();
    root.traverse((o) => {
      if (o.isMesh) {
        const g = o.geometry;
        tris += g.index ? g.index.count / 3 : g.attributes.position.count / 3;
        (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => matSet.add(m.uuid));
      }
    });
    matCount = matSet.size;

    const pct = ['x', 'y', 'z'].map((k, i) => {
      const s = size.getComponent(i);
      return k + '=' + (s > 1e-6 ? Math.round(((0 - box.min.getComponent(i)) / s) * 100) : 0) + '%';
    });
    drawLabels(
      id + '  (' + url.split('/').pop() + ')',
      '尺寸 ' + size.x.toFixed(3) + '×' + size.y.toFixed(3) + '×' + size.z.toFixed(3) +
        'm   长轴=' + ['X', 'Y', 'Z'][longAxis] +
        '   枪口推测=' + (muzzleNeg ? '-' : '+') + ['X', 'Y', 'Z'][longAxis] +
        '   原点在包围盒 ' + pct.join(' ') +
        '   面数=' + Math.round(tris) + ' 材质=' + matCount
    );

    return {
      ok: true,
      size: [size.x, size.y, size.z],
      longAxis: ['X', 'Y', 'Z'][longAxis],
      muzzleEnd: (muzzleNeg ? '-' : '+') + ['X', 'Y', 'Z'][longAxis],
      radNeg: rad.neg,
      radPos: rad.pos,
      originPct: pct,
      tris: Math.round(tris),
      materials: matCount,
    };
  }

  window.WeaponsCheck = { ids: () => Object.keys(FILES), render };
})();
</script>
</body>
</html>
